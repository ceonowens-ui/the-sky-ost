<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A09">
<title>CHANCE 周邊銷售報表</title>
<style>
:root{--bg:#0B0A09;--card:#141210;--line:rgba(214,182,111,.2);--gold:#D6B66F;--gold2:#F0DCA8;--ink:#F3EEEA;--soft:#BDB5A6;--dim:#857e71}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--gold);margin:0 0 6px}
h1{font-family:"Noto Serif TC",Georgia,serif;font-weight:500;font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
.lock{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.lock p{margin:0 0 12px;color:var(--soft);font-size:14px;line-height:1.6}
input{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#1a1815;color:var(--ink);font-size:16px;outline:none}
input:focus{border-color:rgba(214,182,111,.7)}
button{min-height:48px;border-radius:999px;border:0;font-size:15px;font-weight:600;cursor:pointer}
.primary{width:100%;margin-top:12px;background:linear-gradient(90deg,#B8964F,#D6B66F 52%,#F0DCA8);color:#17130B}
.ghost{background:none;border:1px solid var(--line);color:var(--gold2);padding:0 16px;min-height:40px;font-size:13px}
.err{color:#F2A38F;font-size:13px;min-height:18px;margin:10px 0 0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 12px}
.hero .k{font-size:12px;color:var(--soft);letter-spacing:.08em}
.hero .big{font-family:"Bodoni Moda",Georgia,serif;font-size:52px;line-height:1.05;color:var(--gold2);margin:6px 0 2px}
.hero .big small{font-family:-apple-system,"PingFang TC",sans-serif;font-size:16px;color:var(--soft);margin-left:6px}
.hero .note{font-size:12.5px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.cell .k{font-size:12px;color:var(--soft)}
.cell .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.cell .v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}
h2{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:500;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;border-bottom:1px solid rgba(214,182,111,.12);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--dim);font-weight:500}
.empty{color:var(--dim);font-size:14px;padding:16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0;color:var(--dim);font-size:12px}
.status{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--gold2);margin-left:6px;vertical-align:middle}
.status.off{color:var(--dim)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <p class="eyebrow">CHANCE · OFFICIAL MERCH</p>
  <h1>周邊銷售報表</h1>
  <p class="sub">CHANCE 官方卡包 Vol.1 無限可能 C.X.　只顯示銷售數字</p>

  <section id="lock" class="lock">
    <p>請輸入報表密碼（只要輸入一次，這台手機會記住）。</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="報表密碼" aria-label="報表密碼">
    <button class="primary" id="go">查看報表</button>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section id="view" class="hide" aria-live="polite">
    <div class="hero">
      <div class="k">已售出<span id="sale" class="status"></span></div>
      <div class="big"><span id="packs">0</span><small>包</small></div>
      <div class="note" id="cap"></div>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">訂單</div><div class="v" id="orders">0<small>筆</small></div></div>
      <div class="cell"><div class="k">營收（含運費）</div><div class="v" id="amount">NT$0</div></div>
      <div class="cell"><div class="k">台灣／海外／現場領</div><div class="v" id="area">0 / 0 / 0<small>包</small></div></div>
      <div class="cell"><div class="k">待出貨</div><div class="v" id="toship">0<small>筆</small></div></div>
    </div>
    <div class="cell"><div class="k">商品金額／運費</div><div class="v" id="split" style="font-size:17px">NT$0 ／ NT$0</div></div>
    <h2>每日銷售</h2>
    <table><thead><tr><th>日期</th><th>訂單</th><th>包數</th><th>金額</th></tr></thead><tbody id="days"></tbody></table>
    <div class="bar"><span id="at"></span><span><button class="ghost" id="refresh">重新整理</button> <button class="ghost" id="logout">登出</button></span></div>
  </section>
</main>
<script>
(function () {
  var API = "https://the-sky-shop.anthonywen0693.workers.dev";
  var LSK = "chance-shop-report-key";
  var $ = function (id) { return document.getElementById(id); };
  var nt = function (n) { return "NT$" + Number(n || 0).toLocaleString("en-US"); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function show(locked, msg) { $("lock").classList.toggle("hide", !locked); $("view").classList.toggle("hide", locked); $("err").textContent = msg || ""; }
  function load(key) {
    $("go").disabled = true; $("refresh").disabled = true;
    fetch(API + "/report/data", { headers: { "X-Key": key }, cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) { set(LSK, ""); return show(true, d && d.error === "forbidden" ? "密碼不對" : "暫時連不上，請稍後再試"); }
      set(LSK, key);
      var s = d.sum, it = (d.items || [])[0] || {};
      $("packs").textContent = Number(s.packs).toLocaleString("en-US");
      $("orders").innerHTML = s.orders + "<small>筆</small>";
      $("amount").textContent = nt(s.amount);
      $("area").innerHTML = s.tw + " / " + s.overseas + " / " + (s.pickup || 0) + "<small>包</small>";
      $("toship").innerHTML = s.toShip + "<small>筆</small>";
      $("split").textContent = nt(s.goods) + " ／ " + nt(s.shipping);
      $("sale").textContent = it.onSale ? "販售中" : "未開賣"; $("sale").className = "status" + (it.onSale ? "" : " off");
      $("cap").textContent = it.cap ? "限量 " + it.cap + " 包・剩 " + Math.max(0, it.cap - (it.sold || 0)) + " 包" : "不限量・單價 " + nt(it.price);
      $("days").innerHTML = d.days && d.days.length ? d.days.map(function (x) { return "<tr><td>" + esc(x.day.slice(5).replace("-", "/")) + "</td><td>" + x.orders + "</td><td>" + x.packs + "</td><td>" + nt(x.amount) + "</td></tr>"; }).join("") : '<tr><td colspan="4" class="empty">還沒有訂單</td></tr>';
      var t = new Date(d.at); $("at").textContent = "更新於 " + (t.getMonth() + 1) + "/" + t.getDate() + " " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
      show(false);
    }).catch(function () { show(!get(LSK), "暫時連不上，請稍後再試"); }).then(function () { $("go").disabled = false; $("refresh").disabled = false; });
  }
  $("go").onclick = function () { var k = $("key").value.trim(); if (k) load(k); };
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  $("refresh").onclick = function () { var k = get(LSK); if (k) load(k); };
  $("logout").onclick = function () { set(LSK, ""); $("key").value = ""; show(true); };
  var saved = get(LSK); if (saved) load(saved);
})();
</script>
</body>
</html>
