<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CHANCE 歌詞編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0c0c11; --panel:#15151b; --panel2:#1b1b22; --line:#26262f;
  --ink:#e9e6df; --mut:#8f8c84; --mut2:#6f6c65;
  --gold:#c9a86a; --blue:#7fb3ff; --ok:#6fcf97;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;background:rgba(12,12,17,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;letter-spacing:.5px}
.brand b{color:var(--gold)}
.top .sub{color:var(--mut);font-size:12px}
.spacer{flex:1}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#1a1408}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0}
.tab{font-size:13px;padding:7px 12px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;
  background:var(--panel);color:var(--mut);cursor:pointer;white-space:nowrap}
.tab .dot{color:var(--gold);opacity:0;margin-left:6px}
.tab.edited .dot{opacity:1}
.tab.active{background:var(--panel2);color:var(--ink)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px 40px;max-width:1200px;margin:0 auto}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 12px;overflow:hidden;min-width:0}
.pane.pv{border-radius:12px}
.pane h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--mut);
  padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.pane h2 .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.count{font-family:var(--mono);font-size:11px;color:var(--mut2)}
textarea{width:100%;min-height:62vh;resize:vertical;border:none;outline:none;display:block;
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.7;
  padding:16px;white-space:pre;overflow-wrap:normal;tab-size:2}
.hint{padding:10px 16px;border-top:1px solid var(--line);color:var(--mut2);font-size:11.5px;line-height:1.6}
.hint b{color:var(--mut)}
/* preview card mirrors the app */
.controls{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.controls label{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--gold)}
.stage{padding:26px 20px 34px;background:#0b0b0f;min-height:62vh}
.lyr{max-width:520px;margin:0 auto;text-align:center}
.lyr .ti{font-family:var(--serif);font-weight:700;color:var(--gold);letter-spacing:1px;margin:2px 0 18px;text-wrap:balance}
.lyr .ln{font-family:var(--serif);color:#ded9cf}
.lyr .sp{height:.9em}
.lyr .cr{font-family:var(--serif);color:var(--mut2)}
.lyr .cr.first{margin-top:18px;padding-top:14px;border-top:1px solid #23232b}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ok);color:#062012;font-weight:700;font-size:13px;padding:10px 18px;border-radius:10px;
  transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.pane.pv{position:relative}textarea{min-height:44vh}.stage{min-height:auto}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>CHANCE</b> 歌詞編輯器</div>
  <div class="sub">改標題 / 空格 / 斷句 → 右邊即時預覽</div>
  <div class="spacer"></div>
  <button class="btn ghost" id="resetAll">全部還原</button>
  <button class="btn primary" id="copyAll">複製全部給 Claude</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <section class="pane">
    <h2>編輯 <span id="songName"></span>
      <span class="r">
        <span class="count" id="count"></span>
        <button class="btn ghost" id="resetOne" style="padding:5px 10px;font-size:12px">還原這首</button>
      </span>
    </h2>
    <textarea id="ta" spellcheck="false" wrap="off"></textarea>
    <div class="hint"><b>第一行＝歌名</b>（會放大顯示）。空一行＝段落之間留空。句子中間你打幾個空格就留幾個。<br>最下面「詞曲 / 製作人 / 錄音…」那幾行會自動變小（製作名單）。改完直接開 <b>chance1228.com/test.html</b> 看真 App 效果（同一支手機/瀏覽器）。滿意後按上面 <b>複製全部給 Claude</b> 貼給我轉正。</div>
  </section>

  <section class="pane pv">
    <h2>預覽（跟 App 一樣）
      <span class="r">
        <button class="btn ghost" id="copyOne" style="padding:5px 10px;font-size:12px">複製這首</button>
      </span>
    </h2>
    <div class="controls">
      <label>字級 <input type="range" id="fs" min="14" max="24" step="1" value="17"></label>
      <label>行距 <input type="range" id="lh" min="150" max="240" step="5" value="190"></label>
    </div>
    <div class="stage"><div class="lyr" id="stage"></div></div>
  </section>
</div>

  var LSK = 'chance_lyrics_v1';
  var CRED = /^(詞|曲|作詞|作曲|製作|制作|編曲|和聲|和音|錄音|混音|母帶|歌曲|Produce|Producer|Arranger|Background|Recording|Mixing|Mastering|吉他|鼓|Bass|Guitars?|Drum)/;

  // state: map n -> text (from localStorage overlay on SEED)
  var saved = {};
  try{ saved = JSON.parse(localStorage.getItem(LSK)||'{}') || {}; }catch(e){ saved = {}; }
  var texts = {};
  SEED.forEach(function(s){ texts[s.n] = (saved[s.n]!=null ? saved[s.n] : s.text); });
  var cur = SEED[0].n;

  var tabsEl=document.getElementById('tabs'), ta=document.getElementById('ta'),
      stage=document.getElementById('stage'), nameEl=document.getElementById('songName'),
      countEl=document.getElementById('count'), toast=document.getElementById('toast'),
      fs=document.getElementById('fs'), lh=document.getElementById('lh');

  function orig(n){ return SEED.filter(function(s){return s.n===n})[0].text; }
  function isEdited(n){ return texts[n] !== orig(n); }

  function persist(){
    var o={}; SEED.forEach(function(s){ if(isEdited(s.n)) o[s.n]=texts[s.n]; });
    try{ localStorage.setItem(LSK, JSON.stringify(o)); }catch(e){}
  }

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderPreview(){
    var lines = texts[cur].split('\n');
    var html = '';
    var title = (lines[0]||'').trim();
    html += '<div class="ti">'+esc(title)+'</div>';
    var seenCred=false, firstCred=true;
    for(var i=1;i<lines.length;i++){
      var s=lines[i].replace(/\s+$/,'');
      if(s.trim()===''){ html+='<div class="sp"></div>'; continue; }
      if(CRED.test(s.trim())) seenCred=true;
      if(seenCred){
        html+='<div class="cr'+(firstCred?' first':'')+'">'+esc(s.trim())+'</div>';
        firstCred=false;
      } else {
        html+='<div class="ln">'+esc(s)+'</div>';
      }
    }
    stage.innerHTML=html;
    applyType();
  }
  function applyType(){
    stage.style.fontSize=fs.value+'px';
    var lhv=(lh.value/100);
    [].forEach.call(stage.querySelectorAll('.ln'),function(e){e.style.lineHeight=lhv;});
    [].forEach.call(stage.querySelectorAll('.cr'),function(e){e.style.fontSize=(fs.value*0.62)+'px';e.style.lineHeight=1.7;});
    stage.querySelector('.ti').style.fontSize=(fs.value*1.55)+'px';
  }

  function updateCount(){
    var t=texts[cur]; var lines=t.split('\n').length;
    countEl.textContent=t.length+' 字 · '+lines+' 行';
  }
  function buildTabs(){
    tabsEl.innerHTML='';
    SEED.forEach(function(s){
      var b=document.createElement('button');
      b.className='tab'+(s.n===cur?' active':'')+(isEdited(s.n)?' edited':'');
      b.innerHTML='#'+s.n+' '+s.label+'<span class="dot">●</span>';
      b.onclick=function(){ cur=s.n; sync(); };
      tabsEl.appendChild(b);
    });
  }
  function sync(){
    ta.value=texts[cur];
    nameEl.textContent='· #'+cur;
    buildTabs(); renderPreview(); updateCount();
  }

  ta.addEventListener('input',function(){
    if(ta.value.indexOf('`')>-1){var p=ta.selectionStart;ta.value=ta.value.replace(/`/g,'\u2019');ta.setSelectionRange(p,p);}
    texts[cur]=ta.value; persist(); renderPreview(); updateCount(); buildTabs();
  });
  fs.addEventListener('input',applyType);
  lh.addEventListener('input',applyType);

  function showToast(msg){ toast.textContent=msg||'已複製'; toast.classList.add('show'); setTimeout(function(){toast.classList.remove('show');},1400); }
  function copy(str,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(str).then(function(){showToast(msg);},function(){fallback(str,msg);});
    } else fallback(str,msg);
  }
  function fallback(str,msg){
    var t=document.createElement('textarea');t.value=str;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');showToast(msg);}catch(e){showToast('複製失敗，請手動選取');}
    document.body.removeChild(t);
  }

  function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
  document.getElementById('copyOne').onclick=function(){
    var payload={}; payload[cur]=texts[cur];
    copy('CHANCE-LYRICS-B64::'+b64(JSON.stringify(payload)),'已複製 #'+cur+'（精準碼）');
  };
  document.getElementById('copyAll').onclick=function(){
    var payload={}; SEED.forEach(function(s){ payload[s.n]=texts[s.n]; });
    copy('CHANCE-LYRICS-B64::'+b64(JSON.stringify(payload)),'6 首都複製好了（精準碼），貼回給 Claude');
  };
  document.getElementById('resetOne').onclick=function(){
    if(!isEdited(cur)){showToast('這首沒有改過');return;}
    texts[cur]=orig(cur); persist(); sync(); showToast('#'+cur+' 已還原');
  };
  document.getElementById('resetAll').onclick=function(){
    SEED.forEach(function(s){texts[s.n]=s.text;}); persist(); sync(); showToast('全部還原');
  };

  sync();
})();
</script>
</body>
</html>
