<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>連 Tuner</title>
<style>
/* B368T：iPhone 連 SHOP Tuner 的短網址（chance1228.com/t）——輸入電腦 Tuner 上的 6 碼連線碼就連上。只是轉到 test.html?tune=碼，不存任何資料 */
:root{ color-scheme:dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:#0b0709; color:#f6f1e7; font:17px/1.5 -apple-system,"PingFang TC",sans-serif; }
main{ max-width:420px; margin:0 auto; padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px; }
h1{ font:600 24px/1.3 -apple-system,"PingFang TC",sans-serif; color:#f0dcaa; margin:0 0 8px; }
p{ color:#cfc7b8; margin:0 0 20px; font-size:16px; }
input{ width:100%; font:700 34px/1.2 ui-monospace,Menlo,monospace; letter-spacing:.2em; text-align:center; text-transform:uppercase; padding:14px 10px; border-radius:14px; border:2px solid #d8c3a0; background:#15110b; color:#fff; }
button{ width:100%; margin-top:16px; min-height:56px; border:0; border-radius:14px; background:#e8c987; color:#151210; font:700 19px/1 -apple-system,"PingFang TC",sans-serif; }
button:disabled{ opacity:.4; }
label{ display:flex; gap:10px; align-items:center; margin-top:18px; font-size:15px; color:#cfc7b8; }
label input{ width:22px; height:22px; padding:0; border-width:1px; }
.err{ color:#ff8f7a; font-size:15px; min-height:22px; margin-top:10px; }
</style></head>
<body><main>
<h1>連 SHOP Tuner</h1>
<p>輸入電腦 Tuner 上顯示的 6 碼連線碼。連上後，電腦拖滑桿這支手機就會跟著變。</p>
<form id="f" autocomplete="off">
  <input id="c" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="10" placeholder="ABC123" aria-label="連線碼">
  <label><input type="checkbox" id="real"> 用測試後台（不勾＝示範資料，有票可以看）</label>
  <div class="err" id="e"></div>
  <button id="go" type="submit">連線</button>
</form>
</main>
<script>
(function(){
  var c = document.getElementById('c'), e = document.getElementById('e');
  function go(code){
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!/^[A-Z0-9]{6,10}$/.test(code)) { e.textContent = '連線碼是 6 碼英文或數字'; return; }
    var real = document.getElementById('real').checked;
    location.href = 'test.html?' + (real ? '' : 'tkdemo=1&') + 'lang=zh&tune=' + code;
  }
  var pre = (new URLSearchParams(location.search).get('c') || location.hash.slice(1) || '');
  if (pre) { c.value = pre.toUpperCase(); go(pre); }
  document.getElementById('f').addEventListener('submit', function(ev){ ev.preventDefault(); go(c.value); });
  c.addEventListener('input', function(){ e.textContent = ''; c.value = c.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  setTimeout(function(){ try { c.focus(); } catch (x) {} }, 300);
})();
</script>
</body></html>
