      for(i=0;i<15;i++){md=+f[14-i];
        if(i<8)g2[8][sz-1-i]=md;else if(i<9)g2[8][7]=md;else g2[8][14-i]=md;}
      g2[sz-8][8]=1;

    return {g:best,ver:ver,mask:bm};}
  function draw(cv,text,px){

    var sc=Math.max(2,Math.floor((px||212)/S));

    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,cv.width,cv.height);

<script>
/* =====================================================================
 * Instant preview \u2014 plays the moment the page opens, no tap required.
 * Browsers only ever block *audible* autoplay, never muted autoplay, so:
 *   1. try audible autoplay (works on desktop / many Android browsers)
 *   2. if blocked, start MUTED immediately (always allowed) so the track
 *      is already running, and show "TAP FOR SOUND"
 *   3. the very first touch/click/scroll anywhere unmutes it in place
 * The visitor never has to find a play button.
 * ===================================================================== */
(function () {
  var au   = document.getElementById("pv-audio");
  var btn  = document.getElementById("pv-btn"), icon = document.getElementById("pv-icon");
  var fill = document.getElementById("pv-fill"), tag = document.getElementById("pv-tag");
  var hero = document.querySelector(".hero");
  var PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
  var needsSound = false, ended = false;

  function setIcon(p){ icon.setAttribute("d", p ? PAUSE : PLAY); }
  function label(t){ tag.textContent = t; }

  function paint(){
    var d = au.duration || 32, r = d ? au.currentTime / d : 0;
    fill.style.width = (r * 100) + "%";
    if (!au.paused && !needsSound) {
      label("PREVIEW \u00B7 " + Math.max(0, Math.ceil(d - au.currentTime)) + "\u2033");
    }
  }
  au.addEventListener("timeupdate", paint);
  au.addEventListener("play",  function(){ setIcon(true); btn.classList.remove("pulse"); });
  au.addEventListener("pause", function(){ if (!ended) { setIcon(false); label("PAUSED"); } });
  au.addEventListener("ended", function(){
    ended = true; setIcon(false); fill.style.width = "100%"; label("HEAR THE FULL SONG \u2193");
  });
  au.addEventListener("error", function(){ label(""); btn.style.display = "none"; });

  /* The single place that guarantees audible playback. Every manual control
     goes through here, so the element can never be left muted by an earlier
     autoplay fallback — that bug made the play button run the track silently. */
  function playAudible() {
    needsSound = false;
    ended = false;
    au.muted = false;
    au.volume = 1;
    btn.classList.remove("pulse");
    var p = au.play();
    if (p && p.catch) p.catch(function () { label("TAP TO PLAY"); btn.classList.add("pulse"); });
    label("NOW PLAYING");
  }

  /* Unmute on the first gesture of any kind. */
  function enableSound() {
    if (!needsSound) return;
    playAudible();
  }
  ["pointerdown", "touchstart", "click", "keydown", "scroll"].forEach(function (ev) {
    window.addEventListener(ev, enableSound, { once: true, passive: true });
  });

  /* Start immediately \u2014 do not wait for window.load. */
  function start() {
    au.muted = false;
    var p = au.play();
    if (p && p.catch) {
      p.catch(function () {
        /* Audible autoplay refused: run it muted so playback is already underway. */
        au.muted = true;
        needsSound = true;
        au.play().then(function () {
          label("TAP FOR SOUND");
          btn.classList.add("pulse");
        }).catch(function () {
          /* Even muted autoplay refused (rare): fall back to the play button. */
          needsSound = false;
          label("TAP TO PLAY");
          btn.classList.add("pulse");
        });
      });
    }
  }
  start();
  /* Retry once metadata is ready, in case the first attempt fired too early. */
  au.addEventListener("canplay", function () { if (au.paused && !ended) start(); }, { once: true });

  /* Manual controls: always route through playAudible() so a tap can never
     resume a muted element. The button is the only pause control. */
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (au.paused || au.muted) { playAudible(); } else { au.pause(); }
  });
  hero.addEventListener("click", function () {
    if (au.paused || au.muted) playAudible();
  });
})();

/* =====================================================================
 * SHARE button \u2014 opens the native iOS/Android share sheet
 * (AirDrop / LINE / Messages / Mail / save to Photos).
 * Shares the JPG share card as a file when the platform supports it,
 * otherwise falls back to sharing the link, then to copying it.
 * ===================================================================== */
(function () {
  var btn = document.getElementById("btn-airdrop");
  if (!btn) return;
  var SITE = "https://chance1228.com";
  var PAGE = SITE + "/im-sorry/";
  var CARD = "../assets/share/im-sorry-share-card-story.jpg";

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 2400);
  }

  btn.addEventListener("click", function () {
    /* The URL is repeated inside `text` on purpose: when an image file is
       attached, several apps (LINE, IG, Messages) drop the separate `url`
       field, which would leave the recipient with a picture and no tappable
       link. Keeping it in the text guarantees a link travels with the card. */
    var payload = {
      title: "CHANCE \u2014 I'M SORRY",
      text: "CHANCE \u2014 I'M SORRY \u00b7 Listen now: " + PAGE,
      url: PAGE
    };

    /* Try sharing the actual image file first (AirDrop / LINE / IG all accept it). */
    if (navigator.canShare && window.fetch) {
      fetch(CARD).then(function (r) {
        if (!r.ok) throw new Error("no card");
        return r.blob();
      }).then(function (blob) {
        var file = new File([blob], "chance-im-sorry.jpg", { type: "image/jpeg" });
        if (navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: payload.title, text: payload.text });
        }
        throw new Error("files unsupported");
      }).catch(function () {
        shareLink(payload);
      });
      return;
    }
    shareLink(payload);
  });

  function shareLink(payload) {
    if (navigator.share) { navigator.share(payload).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload.url).then(
        function () { toast("LINK COPIED"); },
        function () { toast(payload.url); });
      return;
    }
    toast(payload.url);
  }
})();
</script>
