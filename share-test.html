<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHARE TEST">
<title>share-test</title>
<style>
body{margin:0;min-height:100vh;background:#111;color:#eee;font:17px/1.6 -apple-system,"PingFang TC",sans-serif;padding:40px 20px}
h1{font-size:20px;margin:0 0 6px}p{color:#aaa;font-size:14px;margin:0 0 18px}
button{display:block;width:100%;height:56px;margin:0 0 14px;border:0;border-radius:14px;background:#DFCBA8;color:#111;font:600 18px -apple-system,sans-serif}
#log{white-space:pre-wrap;font:13px ui-monospace,monospace;color:#9f9;background:#000;padding:12px;border-radius:10px;min-height:80px}
</style></head><body>
<h1>navigator.share 測試（隔離測試頁）</h1>
<p>只用來確認：網頁叫出的系統分享選單裡，有沒有「加入主畫面」。不讀寫任何解鎖資料、不打後台。</p>
<button id="b1">① navigator.share（title＋url）</button>
<button id="b2">② navigator.share（只有 url）</button>
<div id="log"></div>
<script>
var L=document.getElementById('log');function log(s){L.textContent+=s+'\n';}
log('UA: '+navigator.userAgent);
log('canShare: '+(typeof navigator.share)+' standalone: '+(navigator.standalone===true));
function go(data){ if(!navigator.share){log('沒有 navigator.share');return;}
  navigator.share(data).then(function(){log('resolve（只代表選單關閉／完成，不代表已安裝）');}).catch(function(e){log('reject: '+e.name+' '+e.message);}); }
document.getElementById('b1').onclick=function(){go({title:'THE SKY',url:'https://chance1228.com/test.html'});};
document.getElementById('b2').onclick=function(){go({url:'https://chance1228.com/test.html'});};
</script>
</body></html>
