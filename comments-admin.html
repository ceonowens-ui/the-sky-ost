<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHANCE 留言後台</title>
<style>
body{font:15px/1.55 -apple-system,"PingFang TC",sans-serif;background:#0F0D13;color:#F1ECE3;margin:0;padding:18px;max-width:760px;margin:0 auto}
h1{font:600 18px/1.3 Georgia,serif;color:#DDC9A4;margin:6px 0 14px}
input,select,textarea,button{font:inherit}input,select,textarea{background:#1A1620;color:#F1ECE3;border:1px solid #2E2836;border-radius:8px;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{border:0;border-radius:8px;padding:8px 12px;background:#2A2433;color:#F1ECE3;cursor:pointer}button.gold{background:#DDC9A4;color:#171410}button.red{background:#5A2323}button.sm{padding:5px 9px;font-size:13px}
.it{padding:12px 0;border-top:1px solid #241F2B}.it.artist{background:rgba(221,201,164,.06);padding:12px;border-radius:10px;border:1px solid rgba(221,201,164,.3)}
.meta{font-size:12px;color:#8F8778;display:flex;gap:10px;flex-wrap:wrap}.name{color:#D6CFE0}.artist .name{color:#DDC9A4}.body{margin:4px 0 8px;white-space:pre-wrap}
.banned{color:#E88}.msg{color:#A59A87;font-size:13px;margin:8px 0}textarea{width:100%;min-height:70px;box-sizing:border-box}
</style></head><body>
<h1>CHANCE 留言後台 · CM1</h1>
<div class="row"><input id="base" placeholder="Worker 網址" style="flex:1;min-width:260px" value="https://the-sky-ost-api.anthonywen0693.workers.dev"><input id="key" type="password" placeholder="ADMIN_KEY" style="width:170px"></div>
<div class="row"><select id="album"><option value="the-sky">THE SKY</option><option value="classics">經典 classics</option></select><input id="track" type="number" min="1" placeholder="曲目 n" style="width:90px" value="1"><button class="gold" id="load">載入</button><span class="msg" id="msg"></span></div>
<details style="margin:10px 0"><summary style="cursor:pointer;color:#DDC9A4">以「成晞 Chance」身份留言（置頂）</summary>
<div class="row" style="margin-top:8px"><textarea id="abody" placeholder="留言內容（最多 300 字）"></textarea></div>
<div class="row"><input id="atime" type="number" min="0" placeholder="秒數（空＝整首）" style="width:150px"><label><input id="apin" type="checkbox" checked> 置頂</label><button class="gold" id="apost">送出藝人留言</button></div></details>
<div id="list"></div>
<script>
var $=function(i){return document.getElementById(i);}; function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
try{ $("key").value=localStorage.getItem("cm-admin-key")||""; }catch(e){}
function base(){return $("base").value.replace(/\/$/,"");} function key(){try{localStorage.setItem("cm-admin-key",$("key").value);}catch(e){} return $("key").value.trim();}
function q(){return "album="+encodeURIComponent($("album").value)+"&track="+encodeURIComponent($("track").value);}
function post(body){return fetch(base()+"/comments/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({key:key(),album:$("album").value,track:$("track").value},body))}).then(function(r){return r.json();});}
function load(){ $("msg").textContent="載入中…"; fetch(base()+"/comments/admin/list?key="+encodeURIComponent(key())+"&"+q()).then(function(r){return r.json();}).then(function(j){
  if(!j.ok){$("msg").textContent="✗ "+(j.message==="not found"?"ADMIN_KEY 不對或 Worker 還沒合併留言模組":j.message);$("list").innerHTML="";return;}
  $("msg").textContent="共 "+j.items.length+" 則"; $("list").innerHTML=j.items.map(function(it){
    return '<div class="it'+(it.isArtist?' artist':'')+'" data-id="'+esc(it.id)+'"><div class="meta"><span class="name">'+esc(it.userName)+(it.isArtist?' · ARTIST':'')+'</span><span>'+(it.timestampSeconds!=null?fmt(it.timestampSeconds):'整首')+'</span><span>♡ '+it.likes+'</span><span>'+new Date(it.createdAt).toLocaleString("zh-TW")+'</span>'+(it.isPinned?'<span>📌 置頂</span>':'')+(it.banned?'<span class="banned">已封鎖</span>':'')+(!it.isArtist?'<span>id '+esc(it.userId)+'</span>':'')+'</div><div class="body">'+esc(it.body)+'</div><div class="row">'+
      '<button class="sm" data-act="'+(it.isPinned?'unpin':'pin')+'">'+(it.isPinned?'取消置頂':'置頂')+'</button><button class="sm red" data-act="del">刪除</button>'+(!it.isArtist?'<button class="sm red" data-act="'+(it.banned?'unban':'ban')+'" data-uid="'+esc(it.userId)+'">'+(it.banned?'解除封鎖':'封鎖此人＋清掉他的留言')+'</button>':'')+'</div></div>';}).join("")||'<p class="msg">這首歌還沒有留言</p>'; }).catch(function(){$("msg").textContent="✗ 連線失敗";}); }
$("load").onclick=load;
$("list").addEventListener("click",function(e){ var b=e.target.closest("[data-act]"); if(!b)return; var it=b.closest(".it"), id=it.getAttribute("data-id"), act=b.getAttribute("data-act");
  if((act==="del"||act==="ban")&&!confirm(act==="del"?"確定刪除這則？":"確定封鎖此人並清掉他在這首歌的留言？"))return;
  post({action:act,id:id,userId:b.getAttribute("data-uid")||undefined,purge:act==="ban"}).then(function(j){ if(!j.ok){alert("✗ "+j.message);return;} load(); }); });
$("apost").onclick=function(){ var b=$("abody").value.trim(); if(!b){alert("請輸入內容");return;} var t=$("atime").value===""?null:Number($("atime").value);
  post({action:"post",body:b,timestampSeconds:t,isPinned:$("apin").checked}).then(function(j){ if(!j.ok){alert("✗ "+j.message);return;} $("abody").value=""; load(); }); };
</script></body></html>
