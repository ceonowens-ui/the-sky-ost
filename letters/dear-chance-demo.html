<title>Dear CHANCE 相遇信箋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<style>
/* 版面：單欄手機殼（max 440），黑曜底 + 香檳金 + 銀色軌道；信紙是唯一的暖色面。
   單一深色世界（刻意不做淺色版），所有顏色明確設定。 */
:root{
  --bg:#0E0D12; --surface:#242229; --paper:#EFE5D3; --paper-edge:#E4D6BE;
  --text:#F0EBE4; --muted:#B7AFA7; --faint:#8E877F; --border:#51473A; --gold:#D4B77E; --gold-hi:#F1D9A0;
  --silver:#D4D0C9; --ink:#3A332E; --danger:#E7A08F; --ok:#B9D4A8; --info:#A9C2DC;
  --gold-grad:linear-gradient(110deg,#B99A60,#F1D9A0 52%,#C0A06C);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-head:"Noto Serif TC","Songti TC","PingFang TC",serif;
  --f-ui:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"Caveat","Snell Roundhand","Segoe Script",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  background:radial-gradient(120% 60% at 50% -10%,rgba(212,183,126,.10),transparent 60%),var(--bg);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:8px}
.app{max-width:440px;margin:0 auto;padding-bottom:48px;position:relative}
.orbits{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
.orbits svg{width:100%;height:100%}
.app>*{position:relative;z-index:1}

.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:rgba(14,13,18,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,183,126,.22)}
.demo-tag{flex:none;font:700 11px/1 var(--f-ui);letter-spacing:.14em;color:#1b1408;background:var(--gold);padding:5px 8px;border-radius:6px}
.demo-txt{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4}
.demo-txt b{color:var(--text);font-weight:500}
.demo-open{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:transparent;font-size:13px;color:var(--gold);cursor:pointer}

.top{display:flex;align-items:center;gap:8px;min-height:56px;margin-top:6px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:0;background:transparent;cursor:pointer;color:var(--silver)}
.icon-btn svg{width:22px;height:22px}
.top-mid{flex:1;min-width:0;text-align:center;font:600 12px/1 var(--f-ui);letter-spacing:.3em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--border);background:rgba(36,34,41,.6);font-size:13px;color:var(--text);cursor:pointer}
.spacer{width:44px;flex:none}

.eyebrow{font:600 12px/1.2 var(--f-ui);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.en{font-family:var(--f-display);font-style:italic;font-weight:500;letter-spacing:.02em;color:var(--silver)}
h1,h2,h3{font-family:var(--f-head);font-weight:600;letter-spacing:.04em;text-wrap:balance;margin:0;color:var(--text)}
h1{font-size:clamp(26px,7.6vw,32px);line-height:1.38;white-space:pre-line}
h2{font-size:21px;line-height:1.45;white-space:pre-line}
h3{font-size:17px;line-height:1.5}
.lead{font-size:17px;line-height:1.8;color:var(--muted);white-space:pre-line;margin:0}
.small{font-size:13.5px;line-height:1.65;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:6px;animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:16px;border:0;cursor:pointer;font:700 16px/1.25 var(--f-ui);letter-spacing:.05em;text-align:center}
.btn-gold{background:var(--gold-grad);color:#1D1608;box-shadow:0 10px 26px rgba(212,183,126,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-gold:active{transform:scale(.985)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn-text{background:transparent;color:var(--gold);font-weight:500;min-height:44px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(29,22,8,.3);border-top-color:#1D1608;animation:sp .8s linear infinite;flex:none}
.spin.lt{border-color:rgba(212,183,126,.3);border-top-color:var(--gold)}
@keyframes sp{to{transform:rotate(360deg)}}

.shop-head{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.shop-head .t{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,8vw,34px);letter-spacing:.06em;line-height:1.1}
.pcard{border-radius:22px;overflow:hidden;border:1px solid rgba(212,183,126,.32);background:linear-gradient(170deg,#1D1C23,#111015);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.pcard-img{position:relative;background:radial-gradient(80% 90% at 50% 40%,#25232B,#121116);display:grid;place-items:center;padding:30px 18px 18px}
.pcard-img img{width:min(70%,280px);height:auto;aspect-ratio:320/300;object-fit:contain;display:block}
.badge{position:absolute;top:14px;left:14px;font:600 11px/1 var(--f-ui);letter-spacing:.14em;color:var(--gold-hi);background:rgba(14,13,18,.72);border:1px solid rgba(212,183,126,.5);padding:7px 10px;border-radius:9px}
.pcard-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.pcard-name{font-family:var(--f-head);font-size:22px;font-weight:600;letter-spacing:.06em;line-height:1.4}
.pcard-desc{font-size:15px;color:var(--muted);line-height:1.7}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:var(--f-display);font-weight:600;font-size:26px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.price-note{font-size:13px;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--muted)}
.meter-top b{font-family:var(--f-display);font-size:24px;color:var(--gold-hi);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(212,208,201,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-grad);border-radius:3px}

.hero-art{display:grid;place-items:center;padding:6px 0}
.hero-art img{width:min(66%,240px);height:auto;aspect-ratio:320/300;object-fit:contain}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.facts li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:13px 2px;border-bottom:1px solid rgba(81,71,58,.6);font-size:15px;line-height:1.55}
.facts li>span{color:var(--muted);flex:none}
.facts li b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-display);font-size:20px;color:var(--gold-hi);font-weight:600;font-variant-numeric:tabular-nums}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ticks li{display:flex;gap:10px;font-size:14.5px;line-height:1.6;color:var(--text)}
.ticks li::before{content:"✦";color:var(--gold);flex:none;font-size:12px;margin-top:3px}

.state{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.65;border:1px solid rgba(212,183,126,.4);background:rgba(212,183,126,.08);display:flex;flex-direction:column;gap:8px}
.state b{font-family:var(--f-head);font-size:17px;font-weight:600}
.state.err{border-color:rgba(231,160,143,.5);background:rgba(231,160,143,.08)}
.state.info{border-color:rgba(169,194,220,.4);background:rgba(169,194,220,.07)}
.state .row{display:flex;gap:10px;flex-wrap:wrap}
.state .row .btn{min-height:44px;font-size:14px;width:auto;flex:1}

.recip{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--silver)}
.recip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.paper{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;padding:46px 26px 30px;box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px var(--paper-edge) inset}
.paper .corner{position:absolute;width:22px;height:22px;border-color:#AA9066;border-style:solid;border-width:0}
.paper .c1{top:14px;left:14px;border-top-width:1px;border-left-width:1px}
.paper .c2{top:14px;right:14px;border-top-width:1px;border-right-width:1px}
.paper .c3{bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px}
.paper .c4{bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px}
.paper .mast{position:absolute;top:18px;left:0;right:0;text-align:center;font:500 10.5px/1 var(--f-display);letter-spacing:.42em;color:#6E5F49}
.salute{font-family:var(--f-hand);font-size:30px;line-height:1.1;color:var(--ink);margin:4px 0 12px}
.body-ta{display:block;width:100%;min-height:240px;resize:none;border:0;outline:0;background:repeating-linear-gradient(transparent 0 32px,rgba(170,144,102,.28) 32px 33px);
  font:400 17px/33px var(--f-head);color:var(--ink);padding:0;margin:0;overflow:hidden;caret-color:#8A6A33}
.body-ta::placeholder{color:#8F8170}
.close-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px}
.close-l{flex:1;min-width:0}
.closing{font-family:var(--f-hand);font-size:24px;color:#6B5E50;line-height:1}
.sig{display:block;width:100%;max-width:220px;min-height:44px;margin-top:4px;border:0;border-bottom:1px solid rgba(170,144,102,.55);background:transparent;font:500 26px/1.4 var(--f-hand),var(--f-head);color:var(--ink);padding:2px 0;outline:0}
.sig::placeholder{color:#8F8170;font-size:22px}
.paper-art{flex:none;width:84px;height:auto;aspect-ratio:320/300}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.count{font-variant-numeric:tabular-nums;color:var(--muted)}
.count.over{color:var(--danger);font-weight:500}
.save{color:var(--muted)}.save.ok{color:var(--ok)}.save.err{color:var(--danger)}
.field-err{font-size:13.5px;color:var(--danger)}
.p-body{font:400 17px/1.95 var(--f-head);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.p-sig{font:500 28px/1.3 var(--f-hand),var(--f-head);color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.p-sig.none{font:400 14px/1.6 var(--f-ui);color:#7A6C5B}
.p-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:12px;border-top:1px solid rgba(170,144,102,.35);font:italic 500 13px/1.4 var(--f-display);color:#6B5E50}
.warn{font-size:14.5px;line-height:1.75;color:var(--text);white-space:pre-line;padding:12px 14px;border-left:2px solid var(--gold);background:rgba(212,183,126,.06);border-radius:0 12px 12px 0;margin:0}

/* 封信儀式 */
.ritual{position:relative;width:min(100%,320px);aspect-ratio:440/380;margin:0 auto}
.envwrap{position:absolute;inset:0}
.ritual .lay{position:absolute;left:0;right:0;bottom:0;width:100%;aspect-ratio:440/300}
.ritual svg{width:100%;height:100%;display:block;overflow:visible}
.ritual .letter{position:absolute;left:12%;right:12%;bottom:8%;height:58%;background:var(--paper);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:2;
  background-image:repeating-linear-gradient(transparent 0 13px,rgba(170,144,102,.35) 13px 14px);background-clip:content-box;padding:22px 18px;transform-origin:50% 100%;transform:translateY(4%) scaleY(.62)}
.ritual .back{z-index:1}.ritual .front{z-index:3}.ritual .flapL{z-index:4}.ritual .sealL{z-index:5}
.spark{position:absolute;inset:0;z-index:6;pointer-events:none}
.spark i{position:absolute;color:var(--gold-hi);font-style:normal;opacity:0;text-shadow:0 0 12px rgba(241,217,160,.8)}
.flap{transform-box:fill-box;transform-origin:50% 0}
.seal{transform-box:fill-box;transform-origin:50% 50%}
.arc{position:absolute;left:0;top:-8%;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0}
.arc path{stroke-dasharray:420;stroke-dashoffset:420}
.ritual.play .letter{animation:fold 1.4s cubic-bezier(.5,0,.2,1) both}
.ritual.play .flapL{animation:flapz 1.4s steps(1,end) both}
.ritual.play .flap{animation:flap 1.4s cubic-bezier(.4,0,.2,1) both}
.ritual.play .seal{animation:seal 1.4s cubic-bezier(.3,1.5,.5,1) both}
.ritual.play .spark i{animation:spark 1.4s ease-out both}
.ritual.waiting .sealL{animation:glow 2.2s ease-in-out infinite 1.4s}
@keyframes fold{0%{transform:translateY(-62%) scaleY(1)}22%{transform:translateY(-62%) scaleY(.62)}48%,100%{transform:translateY(4%) scaleY(.62)}}
@keyframes flapz{0%{z-index:1}50%,100%{z-index:4}}
@keyframes flap{0%,46%{transform:scaleY(-1)}68%,100%{transform:scaleY(1)}}
@keyframes seal{0%,64%{transform:scale(0);opacity:0}82%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes spark{0%,70%{opacity:0;transform:scale(.4)}82%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px rgba(241,217,160,.95))}}
.ritual.fly .arc{opacity:1}
.ritual.fly .arc path{animation:draw 1.2s ease-out forwards}
.ritual.fly .envwrap{animation:away 1.2s cubic-bezier(.45,0,.25,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes away{0%{transform:none;opacity:1}35%{transform:translate(16%,-20%) scale(.72) rotate(-5deg);opacity:1}100%{transform:translate(44%,-72%) scale(.16) rotate(-14deg);opacity:0}}
.ritual.gone .envwrap{opacity:0}
.ritual.gone .arc{opacity:.7}.ritual.gone .arc path{stroke-dashoffset:0}
.ritual .endstar{position:absolute;right:1%;top:-8%;z-index:7;color:var(--gold-hi);font-size:18px;opacity:0;text-shadow:0 0 14px rgba(241,217,160,.9)}
.ritual.gone .endstar{opacity:1;transition:opacity .4s}
.rstat{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15.5px;color:var(--text);text-align:center;min-height:28px}
.status-pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:8px 12px;border-radius:12px;border:1px solid rgba(212,183,126,.45);background:rgba(212,183,126,.1);font-size:14px;line-height:1.4}
.status-pill em{font-style:normal;font:700 10.5px/1 var(--f-ui);letter-spacing:.12em;color:#1b1408;background:var(--gold);padding:4px 6px;border-radius:5px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.3;border-radius:8px;padding:4px 8px;border:1px solid rgba(212,183,126,.4);color:var(--gold-hi);white-space:nowrap}
.tag.read{border-color:rgba(185,212,168,.5);color:var(--ok)}
.tag.warn{border-color:rgba(231,160,143,.55);color:var(--danger)}
.tag.info{border-color:rgba(169,194,220,.5);color:var(--info)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 16px 26px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg)}

  o.letterId=id;o.delivery="delivered";h.status="converted";o.events.push({at:t,txt:"信件已送達 Chance 專屬信箱"});
}
function call(fn,lat){return wait(lat==null?320:lat).then(function(){var s=sLoad();tick(s);var r=fn(s);sSave(s);return JSON.parse(JSON.stringify(r==null?{}:r))})}
function orderView(s,o){return{order:o,hold:s.holds[o.holdId],letter:o.letterId?s.letters[o.letterId]:null,period:s.periods[o.periodId]}}

var API={
  overview:function(u){return call(function(s){
    var t=now(),per=relevantPeriod(s,t),st=periodState(s,per,t);
    var r={now:t,period:per,state:st,remaining:per?remaining(s,per):0,sold:per?sold(s,per.id):0,holds:per?liveHolds(s,per.id):0,next:nextPeriod(s,per,t)};
    if(u&&per){var L=userLetters(s,per,u.id)[0];r.myLetter=L?{id:L.id,orderId:L.orderId}:null;var h=userHold(s,per,u.id);r.myHold=h?{id:h.id,orderId:h.orderId,expiresAt:h.expiresAt,status:h.status,draftId:h.draftId,snap:h.snap,order:s.orders[h.orderId]}:null}
    return r;
  },40)},
  reserve:function(u,draft,key){return call(function(s){
    var t=now();
    if(!u)return{err:"login"};
    if(key&&s.keys[key]){var o0=s.orders[s.keys[key]];var h0=s.holds[o0.holdId];if(LIVE_HOLD.indexOf(h0.status)>-1||o0.letterId)return{ok:true,reused:true,view:orderView(s,o0)}}
    if(!String(draft.body).trim()||glen(draft.body)>MAX_BODY||glen(draft.sig)>MAX_SIG)return{err:"content"};
    var per=relevantPeriod(s,t),st=periodState(s,per,t);
    var mineHold=per&&userHold(s,per,u.id);
    if(mineHold)return{ok:true,reused:true,view:orderView(s,s.orders[mineHold.orderId])};
    if(st==="noperiod")return{err:"noperiod"};
    if(st==="notopen")return{err:"notopen",openAt:per.openAt};
    if(st==="closed")return{err:"closed"};
    if(st==="paused")return{err:"paused"};
    var mine=userLetters(s,per,u.id);if(mine.length>=per.perUser)return{err:"already",letterId:mine[0].id};
    if(remaining(s,per)<=0)return{err:"full"};
    var hid=uid("H"),oid="CH"+per.id.replace("-","")+"-"+pad(s.seq++)+Math.random().toString(36).slice(2,5).toUpperCase();
    s.holds[hid]={id:hid,orderId:oid,periodId:per.id,userId:u.id,draftId:draft.id,snap:{body:draft.body,sig:draft.sig},createdAt:t,expiresAt:t+per.holdMin*MIN,status:"active"};
    s.orders[oid]={id:oid,holdId:hid,periodId:per.id,userId:u.id,amount:per.price,readBy:per.readBy,status:"awaiting",createdAt:t,attempts:[],events:[{at:t,txt:"名額保留，信件內容已固定"}],deliverMode:"ok"};
    if(key)s.keys[key]=oid;
    return{ok:true,view:orderView(s,s.orders[oid])};
  })},
  pay:function(u,orderId,mode,deliverMode){return call(function(s){
    var o=s.orders[orderId];if(!o||!u||o.userId!==u.id)return{err:"notfound"};
    var h=s.holds[o.holdId],t=now();
    if(o.status==="paid"||o.status==="confirming"||o.status==="refund_pending"||o.letterId)return{ok:true,view:orderView(s,o)};   /* 不重複發起付款 */
    if(h.status!=="active"||h.expiresAt<=t)return{err:"expired",view:orderView(s,o)};
    var txn=uid("TX");o.attempts.push({txn:txn,at:t,mode:mode});o.status="confirming";o.deliverMode=deliverMode;
    o.events.push({at:t,txt:"前往付款（模擬）"});
    var res={cancel:"cancel",fail:"fail"}[mode]||"paid";
    var delay={pending:7000,late:2200,cancel:1100,fail:1100}[mode]||1300;
    if(mode==="late"){
      /* 模擬：使用者在金流頁停太久，保留已到期且名額被其他粉絲補滿，之後才付款成功 */
      h.expiresAt=t-1;h.status="expired";var per=s.periods[o.periodId];
      while(remaining(s,per,h.id)>0){var oh=uid("H");s.holds[oh]={id:oh,orderId:"X",periodId:per.id,userId:uid("fan-"),status:"active",expiresAt:t+per.holdMin*MIN}}
    }
    s.queue.push({type:"callback",txn:txn,orderId:orderId,result:res,due:t+delay});
    if(mode==="dupe")s.queue.push({type:"callback",txn:txn,orderId:orderId,result:res,due:t+delay+500});
    return{ok:true,view:orderView(s,o)};
  })},
  status:function(orderId){return call(function(s){var o=s.orders[orderId];return o?{view:orderView(s,o)}:{err:"notfound"}},150)},
  myItems:function(u){return call(function(s){
    if(!u)return{items:[]};
    var items=Object.keys(s.orders).map(function(k){return s.orders[k]}).filter(function(o){
      var h=s.holds[o.holdId];if(o.userId!==u.id)return false;if(o.letterId)return true;
      if(["refund_pending","refunded","paid","confirming"].indexOf(o.status)>-1)return true;
      return h&&h.status==="active";
    }).map(function(o){return orderView(s,o)}).sort(function(a,b){return b.order.createdAt-a.order.createdAt});
    return{items:items};
  },60)},
  inbox:function(u){return call(function(s){
    if(!u||(u.id!=="chance"&&u.id!=="team-01"))return{err:"forbidden"};
    var isChance=u.id==="chance";   /* 團隊只拿到後設資料，沒有正文與署名 */
    var L=lettersOf(s,isLive).sort(function(a,b){return b.sentAt-a.sentAt}).map(function(x){var y=JSON.parse(JSON.stringify(x));if(!isChance){y.body=null;y.sig=null}return y});
    return{letters:L,isChance:isChance,now:now()};
  },60)},
  markRead:function(u,letterId){return call(function(s){
    if(!u||u.id!=="chance")return{err:"forbidden"};          /* 只有 Chance 本人帳號 */
    var L=s.letters[letterId];if(!L)return{err:"notfound"};
    if(!L.readAt){L.readAt=now();L.status="read";L.readByWho="chance"}
    return{letter:L};
  })},
  reply:function(u,letterId,text){return call(function(s){
    if(!u||u.id!=="chance")return{err:"forbidden"};
    var L=s.letters[letterId];if(!L||!L.readAt)return{err:"notread"};
    if(!L.reply){L.reply={text:text,at:now()};L.status="replied"}return{letter:L};
  })},
  dashboard:function(u){return call(function(s){
    if(!u||u.id!=="team-01")return{err:"forbidden"};
    var t=now();
    var ps=periodsSorted(s).map(function(p){
      var live=lettersOf(s,function(L){return L.periodId===p.id&&isLive(L)});
      var unread=live.filter(function(L){return!L.readAt});
      return{p:p,sold:live.length,holds:liveHolds(s,p.id),unread:unread.length,read:live.length-unread.length,
        overdue:unread.filter(function(L){return t>L.readBy}).length,dueSoon:unread.filter(function(L){return t<=L.readBy&&L.readBy-t<3*DAY}).length,
        rows:live.map(function(L){var o=s.orders[L.orderId]||{id:"（Demo 其他粉絲）"};return{order:o.id,amount:L.price,paid:o.paidAt,sentAt:L.sentAt,readAt:L.readAt,readBy:L.readBy}})};
    });
    var refunds=Object.keys(s.orders).map(function(k){return s.orders[k]}).filter(function(o){return o.status==="refund_pending"||o.status==="refunded"});
    var cur=relevantPeriod(s,t);
    return{now:t,periods:ps,refunds:refunds,dupRefunds:s.refunds.filter(function(r){return r.reason==="重複付款"}),current:cur&&cur.id};
  },60)},
  updatePeriod:function(u,pid,patch){return call(function(s){
    if(!u||u.id!=="team-01")return{err:"forbidden"};
    var p=s.periods[pid];if(!p)return{err:"notfound"};
    var min=sold(s,pid)+liveHolds(s,pid);if(patch.capacity!=null&&patch.capacity<min)return{err:"capacity",min:min};
    ["capacity","price","perUser","holdMin"].forEach(function(k){if(patch[k]!=null&&!(patch[k]>=1)&&!(k==="capacity"&&patch[k]===0))delete patch[k]});
    Object.keys(patch).forEach(function(k){p[k]=patch[k]});
    return{period:p};
  })},
  createNext:function(u){return call(function(s){
    if(!u||u.id!=="team-01")return{err:"forbidden"};
    var last=periodsSorted(s).slice(-1)[0],a=last.id.split("-"),y=+a[0],m=+a[1]+1;if(m>12){m=1;y++}
    var p=defaultPeriod(y,m);if(!s.periods[p.id])s.periods[p.id]=p;return{period:s.periods[p.id]};
  })},
  refundDone:function(u,orderId){return call(function(s){if(!u||u.id!=="team-01")return{err:"forbidden"};var o=s.orders[orderId];if(o&&o.status==="refund_pending"){o.status="refunded";o.events.push({at:now(),txt:"退款完成"})}return{}})},
  /* ---- Demo 專用 ---- */
  _fill:function(left){return call(function(s){var t=now(),per=relevantPeriod(s,t);if(!per)return{};
    holdsOf(s,function(h){return h.orderId==="X"}).forEach(function(h){delete s.holds[h.id]});
    lettersOf(s,function(L){return L.orderId==="X"}).forEach(function(L){delete s.letters[L.id]});
    var need=per.capacity-left-sold(s,per.id)-liveHolds(s,per.id);
    for(var i=0;i<need;i++){var id="LX"+uid()+i;s.letters[id]={id:id,orderId:"X",userId:"fan-o"+i,periodId:per.id,body:"（其他粉絲的信 · Demo 填充）",sig:"粉絲 "+(i+1),price:per.price,readBy:per.readBy,sentAt:t-(i+1)*HR,status:"delivered",readAt:null,reply:null}}
    return{remaining:remaining(s,per)}},0)},
  _grabLast:function(){return call(function(s){var t=now(),per=relevantPeriod(s,t);if(!per||remaining(s,per)<=0)return{ok:false};var hid=uid("H");s.holds[hid]={id:hid,orderId:"X",periodId:per.id,userId:"fan-other",status:"active",expiresAt:t+per.holdMin*MIN};return{ok:true}},0)},
  _clearOthers:function(){return call(function(s){holdsOf(s,function(h){return h.orderId==="X"}).forEach(function(h){delete s.holds[h.id]});lettersOf(s,function(L){return L.orderId==="X"}).forEach(function(L){delete s.letters[L.id]});return{}},0)},
  _expireMine:function(u){return call(function(s){holdsOf(s,function(h){return u&&h.userId===u.id&&h.status==="active"}).forEach(function(h){h.expiresAt=now()-1});tick(s);return{}},0)},
  _redeliverCallbacks:function(u){return call(function(s){var n=0;Object.keys(s.txns).forEach(function(tx){var r=s.txns[tx],o=s.orders[r.orderId];if(o&&u&&o.userId===u.id){handleCallback(s,tx,r.orderId,r.result);n++}});return{done:n}},0)}
};

/* ═════════ 粉絲：寫信 ═════════ */
var ED=null,saveT=null;
function saveDraft(){
  if(!ED)return true;
  var prev=CL.drafts[ED.id]?JSON.parse(JSON.stringify(CL.drafts[ED.id])):null;
  var d=CL.drafts[ED.id]||{id:ED.id,created:Date.now()};
  d.body=ED.body;d.sig=ED.sig;d.updated=Date.now();CL.drafts[ED.id]=d;
  var ok=!SIM.saveFail&&cSave();
  if(!ok){if(prev)CL.drafts[ED.id]=prev;else delete CL.drafts[ED.id];ED.saveState="err";paintSave();say("這次變更尚未儲存，請先不要離開。");return false}
  ED.dirty=false;ED.saveState="ok";ED.savedAt=d.updated;paintSave();return true;
}
function scheduleSave(){clearTimeout(saveT);ED.saveState="editing";paintSave();saveT=setTimeout(function(){if(!ED.composing)saveDraft()},800)}
function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function paintSave(){
  var el=$("saveState");if(!el)return;
  if(ED.saveState==="ok"){el.className="save ok";el.textContent="✓ 已儲存 · 僅存於此裝置 "+hhmm(ED.savedAt)}
  else if(ED.saveState==="editing"){el.className="save";el.textContent="編輯中…"}
  else if(ED.saveState==="err"){el.className="save err";el.textContent="尚未儲存"}
  else{el.className="save";el.textContent="草稿僅存於此裝置"}
  if($("saveErr"))$("saveErr").hidden=ED.saveState!=="err";
}
function copyText(t){var ok=function(){toast("已複製正文")};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}function fb(){var ta=$("body");if(ta){ta.focus();ta.select();toast("已選取正文，請手動複製")}}}
function leaveCompose(then){
  if(!ED||!ED.dirty)return true;clearTimeout(saveT);if(saveDraft())return true;
  sheet('<h2>這次變更尚未儲存，請先不要離開。</h2><p class="small">剛剛的修改還沒存進此裝置。可以重試，或先複製正文。</p><div class="stack"><button class="btn btn-gold" id="lsRetry" type="button">重試儲存</button><button class="btn btn-ghost" id="lsCopy" type="button">複製正文</button><button class="btn btn-ghost" id="cancel" type="button">留在此頁</button><button class="btn btn-text" id="lsGo" type="button">不儲存，仍要離開</button></div>',
   function(close){$("lsRetry").onclick=function(){if(saveDraft()){close();then()}};$("lsCopy").onclick=function(){copyText(ED.body)};$("cancel").onclick=close;$("lsGo").onclick=function(){ED.dirty=false;close();then()}});
  return false;
}

  return'<section class="screen">'+

   (hold?'<div class="state info"><b>這封信有一個保留中的名額</b><span>付款會寄出保留當下的版本，現在的修改不會改變那筆訂單。保留到 '+fmtMD(hold.expiresAt)+'。</span></div>':'')+

    '<div class="close-row"><div class="close-l"><div class="closing" aria-hidden="true">With love,</div><label class="sr" for="sig">署名，最多 20 字</label><input class="sig" id="sig" type="text" placeholder="你的名字" autocomplete="nickname" enterkeyhint="done"></div><span class="paper-art">'+SVG_PAPER_ART+'</span></div>'+
   '</div>'+
   '<div class="meta-row"><span class="count" id="count"></span><span class="save" id="saveState"></span></div>'+
   '<div class="field-err" id="sigErr" hidden></div>'+
   '<div class="state err" id="saveErr" hidden role="alert"><b>這次變更尚未儲存，請先不要離開。</b><div class="row"><button class="btn btn-gold" id="retry" type="button">重試儲存</button><button class="btn btn-ghost" id="copy" type="button">複製正文</button></div></div>'+
   '<button class="btn btn-gold" id="toPreview" type="button">下一步 · 確認信件</button><p class="small" id="note" style="text-align:center"></p></section>'},
 wire:function(){
  var ta=$("body"),sg=$("sig");ta.value=ED.body;sg.value=ED.sig;
  function grow(){ta.style.height="auto";ta.style.height=Math.max(240,ta.scrollHeight+4)+"px"}
  function validate(){
    var n=glen(ED.body),sn=glen(ED.sig),over=n>MAX_BODY,sover=sn>MAX_SIG,empty=!ED.body.trim();
    var ce=$("count");ce.className="count"+(over?" over":"");ce.textContent=over?("超過 "+(n-MAX_BODY)+" 字 · "+n+" / 1,000"):(n.toLocaleString()+" / 1,000 字");
    $("sigErr").hidden=!sover;$("sigErr").textContent=sover?"署名最多 20 字，目前 "+sn+" 字。":"";
    $("toPreview").disabled=empty||over||sover;
    $("note").textContent=empty?"寫下正文後就能預覽。":"預覽後才會確認名額與付款。";
  }
  function onIn(){ED.body=ta.value;ED.sig=sg.value;ED.dirty=true;grow();if(!ED.composing)validate();scheduleSave()}
  [ta,sg].forEach(function(el){el.addEventListener("input",onIn);el.addEventListener("compositionstart",function(){ED.composing=true});
    el.addEventListener("compositionend",function(){ED.composing=false;ED.body=ta.value;ED.sig=sg.value;validate();scheduleSave()});
    el.addEventListener("focus",function(){setTimeout(function(){el.scrollIntoView({block:"center",behavior:"smooth"})},300)})});
  sg.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();sg.blur()}});
  $("retry").onclick=function(){if(saveDraft())toast("已儲存在此裝置")};$("copy").onclick=function(){copyText(ED.body)};
  $("toPreview").onclick=function(){clearTimeout(saveT);ED.body=ta.value;ED.sig=sg.value;if(!ED.body.trim()||glen(ED.body)>MAX_BODY||glen(ED.sig)>MAX_SIG)return;if(ED.dirty&&!saveDraft())return;go("preview",ED.id)};
  grow();validate();paintSave();
 }};

/* 付款 sheet：保留期限以後端為準，內容已固定 */
function openPay(view){
  var o=view.order,h=view.hold,per=view.period,busy=false,msg="",cdT=null,pollT=null,started=0;
  sheet(function(){
    var expired=!busy&&h.status!=="active"&&h.status!=="verifying"&&o.status!=="paid";
    return'<div class="grab"></div><h2>名額已為你保留</h2>'+
     '<div class="cd"><span class="small" style="color:var(--text)">保留到 '+fmtMD(h.expiresAt)+'<br><span style="color:var(--muted)">時間以伺服器為準</span></span><b id="cd">'+(expired?"00:00":mmss(h.expiresAt-now()))+'</b></div>'+
     '<span class="small">將寄出的是你剛剛預覽、已固定的內容：</span><div class="snap">'+esc(summary(h.snap.body,120))+'</div>'+
     '<ul class="facts"><li><span>訂單</span><b>'+esc(o.id)+'</b></li><li><span>收信期別</span><b>'+monthName(per.id)+'</b></li><li><span>親自閱讀期限</span><b>'+fmtMD(o.readBy)+' 前</b></li><li><span>金額</span><b class="num">NT$'+o.amount+'</b></li></ul>'+
     '<p class="warn">付款成功後，將寄出目前預覽的信件。\n寄出後不能編輯或撤回。不保證逐一回覆。</p>'+
     '<div id="payMsg">'+msg+'</div>'+
     '<div class="stack"><button class="btn btn-gold" id="pay" type="button"'+(busy||expired?' disabled':'')+'>'+(busy?'<span class="spin"></span>付款處理中':'前往付款 · NT$'+o.amount)+'</button>'+
     '<p class="small" style="text-align:center">DEMO 模擬付款 · 不會收費</p>'+
     (expired?'<button class="btn btn-ghost" id="again" type="button">回到預覽，重新確認名額</button>':'')+
     '<button class="btn btn-ghost" id="cancel" type="button"'+(busy?' disabled':'')+'>先不付款</button></div>';
  },function(close0,repaint){
    function close(){clearInterval(cdT);clearInterval(pollT);close0()}
    function wire(){
      $("cancel").onclick=function(){if(busy)return;close();render();if(h.status==="active")toast("名額保留到 "+fmtMD(h.expiresAt)+"，到期未付款會釋放。")};
      $("pay").onclick=function(){
        if(busy)return;busy=true;msg="";repaint();wire();started=Date.now();
        API.pay(me(),o.id,SIM.pay,SIM.deliver).then(function(r){
          if(r.err==="expired"){busy=false;o=r.view.order;h=r.view.hold;msg='<div class="state err"><b>保留時間已到，名額已釋放。</b><span>你的草稿仍在。</span></div>';repaint();wire();return}
          clearInterval(pollT);pollT=setInterval(poll,700);
        });
      };
      if($("again"))$("again").onclick=function(){close();CL.active=null;cSave();render()};
    }
    function refresh(){API.status(o.id).then(function(r){if(!r.view)return;o=r.view.order;h=r.view.hold;repaint();wire()})}
    function poll(){
      API.status(o.id).then(function(r){
        if(!r.view||!document.getElementById("pay"))return;o=r.view.order;h=r.view.hold;
        if(o.status==="paid"||o.status==="refund_pending"||o.letterId||(o.status==="confirming"&&Date.now()-started>2600)){close();go("ritual",o.id);return}
        if(o.status==="cancelled"||o.status==="failed"){
          clearInterval(pollT);busy=false;var live=h.status==="active";
          msg='<div class="state err" role="alert"><b>'+(o.status==="cancelled"?"尚未付款。":"付款沒有完成。")+'</b><span>'+(live?"名額保留到 "+fmtMD(h.expiresAt)+"，可以再試一次。":"保留已到期，名額已釋放。你的草稿仍在。")+'</span></div>';
          repaint();wire();say(o.status==="cancelled"?"尚未付款":"付款沒有完成");
        }
      });
    }
    wire();
    cdT=setInterval(function(){var el=$("cd");if(!el){clearInterval(cdT);return}var left=h.expiresAt-now();el.textContent=mmss(left);if(left<=0&&!busy){clearInterval(cdT);refresh()}},1000);
  });
}

/* ═════════ 粉絲：寄出儀式（交易狀態只看後端，動畫不決定結果） ═════════ */
function reducedMotion(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}}
V.ritual={load:function(){return API.status(R.param)},view:function(r){
  if(!r.view)return V.missing.view();
  return'<section class="screen" style="gap:8px"><div id="lsaHost"></div><div id="rbody" class="stack"></div></section>'},
 wire:function(r){
  if(!r.view)return V.missing.wire();
  var oid=R.param,v0=r.view,snap=v0.letter?{body:v0.letter.body,sig:v0.letter.sig}:v0.hold.snap;
  var seen=!!RT.seen[oid]||!!CL.flown[oid];RT.seen[oid]=1;
  var terminal=false;
  /* 交易狀態只看後端（這裡是模擬後端）；動畫播完不代表送達 */
  function map(v){
    var o=v.order,L=v.letter;
    if(L)return{state:"confirmed",readBy:L.readBy,demo:true};
    if(o.status==="refund_pending"||o.status==="refunded")return{state:"failed",title:"這封信沒有寄出",message:(o.refundReason||"")+"這筆付款"+(o.status==="refunded"?"已退款完成":"已進入退款處理")+"，不會再扣款。你的草稿仍保留在此裝置。",actions:["help"]};
    if(o.status==="confirming")return{state:"pending",waitText:"正在確認付款結果…請勿重複付款"};
    if(o.status==="paid")return{state:"pending",waitText:"付款已完成，正在確認收件…",note:"不需要再次付款。"};
    return{state:"failed",title:({cancelled:"尚未付款。",expired:"保留時間已到，名額已釋放。",awaiting:"還沒有付款。"})[o.status]||"付款沒有完成。",message:"信沒有寄出，你的草稿仍在。",actions:["retry"],retryLabel:"回到預覽"};
  }
  function after(){ /* 單一完成入口：使用動畫模組的「查看信件」。 */ }
  var anim=LetterSendAnimation.create($("lsaHost"),{letter:{body:snap.body,signature:snap.sig},resume:seen,skipToDone:!!CL.flown[oid],
    onVisualComplete:function(){CL.flown[oid]=1;cSave();after();say("你的信已送達 Chance 的專屬信箱")},
    onRetry:function(){var did=v0.hold&&v0.hold.draftId;stack=[{name:home()}];setRoute(CL.drafts[did]?{name:"preview",param:did}:{name:"mailbox",param:"sent"});render()},
    onHelp:function(){toast("Demo：這裡會開客服，帶入訂單編號 "+oid)},
    onViewLetter:function(){go("letter",oid)}});
  RT.anim=anim;
  function update(v){
    var m=map(v);
    if(m.state==="confirmed"&&CL.active&&CL.active.orderId===oid){delete CL.drafts[CL.active.draftId];CL.active=null;cSave()}
    if(m.state==="failed"&&v.order.status!=="refund_pending"&&CL.active&&CL.active.orderId===oid&&v.hold&&v.hold.status!=="active"){CL.active=null;cSave()}
    if(m.state==="confirmed"||m.state==="failed"){terminal=true;clearInterval(t)}
    anim.setStatus(m);
  }
  anim.setStatus(map(v0));anim.start();
  var t=setInterval(function(){if(terminal||R.name!=="ritual"||R.param!==oid){clearInterval(t);return}API.status(oid).then(function(x){if(x.view&&R.name==="ritual"&&R.param===oid)update(x.view)})},900);timers.push(t);
  if(map(v0).state==="confirmed"||map(v0).state==="failed")update(v0);
 }};

/* ═════════ 粉絲：我的信件 ═════════ */
function fanStatus(v){
  var o=v.order,L=v.letter,h=v.hold;
  if(L){if(L.reply)return["已回覆","read"];if(L.readAt)return["Chance 已讀完","read"];if(L.status==="review")return["收信規則待處理","warn"];return["已送達，等待 Chance 閱讀",""]}
  if(o.status==="refund_pending")return["退款處理中","warn"];
  if(o.status==="refunded")return["退款完成","info"];
  if(o.status==="paid")return["已付款，寄送處理中","info"];
  if(o.status==="confirming")return["付款結果確認中","info"];
  if(h&&h.status==="active")return["名額保留中，等待付款","info"];
  return["失敗","warn"];
}
var mtab="sent";
V.mailbox={load:function(){return API.myItems(me())},view:function(r){
  if(R.param)mtab=R.param;
  var items=r.items||[],drafts=Object.keys(CL.drafts).map(function(k){return CL.drafts[k]}).filter(function(d){return d.body||d.sig}).sort(function(a,b){return b.updated-a.updated});

function sheet(content,init){
  var prev=document.activeElement,scrim=document.createElement("div");scrim.className="scrim";
  var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");
  scrim.appendChild(sh);$("layer").appendChild(scrim);
  function paint(){sh.innerHTML=typeof content==="function"?content():content}
  var closed=false;function close(){if(closed)return;closed=true;scrim.remove();document.removeEventListener("keydown",onKey);try{prev&&prev.focus()}catch(e){}}
  function dismiss(){var c=sh.querySelector("#cancel,#simClose");if(c&&!c.disabled)c.click()}
  function onKey(e){if(e.key==="Escape")dismiss()}
  scrim.addEventListener("click",function(e){if(e.target===scrim)dismiss()});document.addEventListener("keydown",onKey);
  paint();init(close,paint);var f=sh.querySelector("button");if(f)f.focus({preventScroll:true});
}

      $("fill1").onclick=function(){API._fill(1).then(function(x){after("剩 "+x.remaining+" 封")})};
      $("fill0").onclick=function(){API._fill(0).then(function(){after("名額已滿")})};
      $("grab").onclick=function(){API._grabLast().then(function(x){after(x.ok?"另一位粉絲保留了 1 封":"已經沒有名額可搶")})};
      $("free").onclick=function(){API._clearOthers().then(function(){after("已清掉其他粉絲")})};
      $("expire").onclick=function(){API._expireMine(me()).then(function(){after("保留已到期")})};
      $("recb").onclick=function(){API._redeliverCallbacks(me()).then(function(x){after("已重送 "+x.done+" 筆回呼（不會重複扣款）")})};
      $("tab2").onclick=function(){var id=newOrLatestDraft(false);CL.drafts[id].body+="\n（另一分頁加上的一句）";CL.drafts[id].updated=Date.now();cSave();ED=null;after("草稿已在另一分頁被修改")};
      $("savefail").onclick=function(){SIM.saveFail=!SIM.saveFail;simSave();repaint();wire()};
      $("long").onclick=function(){var base="謝謝你的歌，陪我走過那些不知道該怎麼說出口的日子。今天回家的路上，又聽見了它。",s="";while(glen(s)<1000)s+=base;s=Array.from(s).slice(0,1000).join("");var id=newOrLatestDraft(true);CL.drafts[id].body=s;CL.drafts[id].sig="小宇";cSave();ED=null;close();if(SIM.role!=="fan"&&SIM.role!=="guest"){SIM.role="fan";simSave()}stack=[{name:home()}];setRoute({name:"compose",param:id});render()};
      $("reset").onclick=function(){try{localStorage.removeItem(SKEY);localStorage.removeItem(CKEY)}catch(e){}CL={drafts:{},route:null,active:null,flown:{}};cSave();SIM={role:"fan",pay:"ok",deliver:"ok",clock:demoDefaultClock(),saveFail:false};simSave();ED=null;RT.seen={};close();goHome();toast("已重設")};
      $("simClose").onclick=close;
    }
    wire();
  });
};

/* ═════════ render ═════════ */
var renderSeq=0;
var ALLOWED={fan:["shop","product","compose","preview","ritual","mailbox","letter"],guest:["shop","product","compose","preview","mailbox"],chance:["inbox","cletter"],team:["admin","inbox"]};
function render(){
  clearTimers();if(RT.anim){try{RT.anim.destroy()}catch(e){}RT.anim=null}if(!R)R={name:home()};
  if(R.name!=="compose"&&ED&&!ED.dirty)ED=null;
  if(ALLOWED[SIM.role].indexOf(R.name)<0){stack=[];R={name:home()};CL.route=R;cSave()}
  document.body.dataset.route=R.name;demoTxt();top();
  var fn=V[R.name]||V.shop,seq=++renderSeq;
  fn.load().then(function(data){
    if(seq!==renderSeq)return;
    var html=fn.view(data);$("view").innerHTML=html;
    if(html.indexOf("找不到這封信")>-1)V.missing.wire();else fn.wire(data);
  },function(e){if(seq!==renderSeq)return;$("view").innerHTML='<section class="screen"><div class="state err"><b>暫時連不上服務</b><span>'+(e==="storage"?"此裝置無法儲存資料。":"請稍後再試。")+'你的草稿仍在。</span></div></section>'});
}
window.addEventListener("pagehide",function(){if(ED&&ED.dirty){clearTimeout(saveT);saveDraft()}});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(ED&&ED.dirty){clearTimeout(saveT);saveDraft()}return}
  if(R&&!document.querySelector(".scrim")&&["ritual","preview","mailbox","product","shop"].indexOf(R.name)>-1)render();   /* 回到前景：重新向後端查狀態 */
});
(function boot(){
  var r=CL.route;
  if(CL.active&&SIM.role==="fan"){
    API.status(CL.active.orderId).then(function(x){var o=x.view&&x.view.order;
      if(o&&(o.letterId||["confirming","paid","refund_pending"].indexOf(o.status)>-1)){stack=[{name:home()}];R={name:"ritual",param:o.id}}
      else{if(!o||x.view.hold.status!=="active"){CL.active=null;cSave()}R=r&&V[r.name]&&r.name!=="ritual"?r:{name:home()};if(R.name!==home())stack=[{name:home()}]}
      render()});
    return;
  }
  if(r&&V[r.name]&&r.name!=="ritual"){R=r;if(r.name!==home())stack=[{name:home()}]}else R={name:home()};
  render();
})();
window.__DC={API:API,USER:USER,sLoad:sLoad,now:now};   /* 測試掛勾（Demo） */
})();
</script>
