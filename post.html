<style>

html,body{margin:0;background:
  radial-gradient(120% 60% at 50% 0%,#2A1440 0%,#1A0E2A 45%,#0E0817 100%) fixed;

body{padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);font-weight:600}

  font-size:14px;z-index:99;box-shadow:0 8px 28px #0009;max-width:90vw;text-align:center}

<body>

<script>
"use strict";
var API = "https://the-sky-ost-api.anthonywen0693.workers.dev/feed";
var LSK = "chance-feed:key";
var S = { key:"", role:"", posts:[], filter:"live", tier:"public",
          att:null, settings:{requireReview:false} };

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600);
}
function when(ts){
  var d=new Date(ts), n=new Date(), p=function(x){return x<10?"0"+x:""+x;};
  var hm=p(d.getHours())+":"+p(d.getMinutes());
  if(d.toDateString()===n.toDateString()) return "今天 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}

async function api(path, opts){
  opts = opts || {};
  var h = Object.assign({ "X-Feed-Key": S.key }, opts.headers || {});
  if (opts.json !== undefined){ h["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.json); }
  var r = await fetch(API + path, { method: opts.method || "GET", headers: h, body: opts.body });
  var data;
  try { data = await r.json(); } catch(e){ data = { ok:false, error:"回應格式錯誤 ("+r.status+")" }; }
  if (!r.ok && !data.error) data.error = "HTTP " + r.status;
  return data;
}

/* ---------- 登入 ---------- */
async function login(key){
  S.key = key;
  var d = await api("/auth");
  if (!d.ok){ $("lock-err").textContent = d.error==="unauthorized" ? "金鑰不對" : ("連不上：" + d.error); S.key=""; return; }
  localStorage.setItem(LSK, key);
  S.role = d.role; S.settings = d.settings || S.settings;
  $("lock").classList.add("hide"); $("app").classList.remove("hide");
  var pill = $("role-pill");
  pill.textContent = S.role==="owner" ? "站主" : "藝人";
  pill.className = "pill " + S.role;
  if (S.role==="owner"){
    $("owner-box").classList.remove("hide");
    document.querySelector('[data-f="deleted"]').classList.remove("hide");
    syncReviewBtn();
  }
  load();
}
$("btn-login").onclick = function(){
  var k = $("key").value.trim();
  if (!k) return;
  $("lock-err").textContent = "";
  login(k);
};
$("key").addEventListener("keydown", function(e){ if(e.key==="Enter") $("btn-login").click(); });
$("btn-out").onclick = function(){
  localStorage.removeItem(LSK); location.reload();
};

/* ---------- 審核開關 ---------- */
function syncReviewBtn(){
  var b = $("btn-review");
  b.textContent = S.settings.requireReview ? "開啟" : "關閉";
  b.setAttribute("aria-pressed", S.settings.requireReview ? "true" : "false");
  b.style.color = S.settings.requireReview ? "var(--gold)" : "var(--dim)";
}
$("btn-review").onclick = async function(){
  var next = !S.settings.requireReview;
  var d = await api("/settings", { method:"POST", json:{ requireReview: next } });
  if (!d.ok) return toast(d.error);
  S.settings = d.settings; syncReviewBtn();
  toast(next ? "他的貼文會先等你審核" : "他的貼文會直接發布");
};

/* ---------- 對象切換 ---------- */
Array.prototype.forEach.call($("seg-tier").children, function(b){
  b.onclick = function(){
    S.tier = b.dataset.t;
    Array.prototype.forEach.call($("seg-tier").children, function(x){
      x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
    preview();
  };
});

/* ---------- 附件 ---------- */
function clearAtt(){ S.att=null; $("att").className="hide"; $("att").innerHTML=""; preview(); }
function showPhoto(blob){
  var url = URL.createObjectURL(blob);
  S.att = { kind:"photo", blob:blob, ext:"jpg", url:url, dur:"" };
  $("att").className = "thumb";
  $("att").innerHTML = '<img alt="已選照片"><button class="x" id="att-x" aria-label="移除照片">✕</button>';
  $("att").querySelector("img").src = url;
  $("att-x").onclick = clearAtt;
  preview();
}
function showAudio(blob, ext){
  var url = URL.createObjectURL(blob);
  var a = new Audio(); a.preload="metadata"; a.src=url;
  a.onloadedmetadata = function(){
    var s = Math.round(a.duration||0);
    if (isFinite(s) && s>0){
      S.att.dur = (s<600?"0":"") + Math.floor(s/60) + ":" + (s%60<10?"0":"") + (s%60);
      preview();
    }
  };
  S.att = { kind:"voice", blob:blob, ext:ext, url:url, dur:"" };
  $("att").className = "";
  $("att").innerHTML = '<div class="rec" style="margin-top:12px"><audio controls style="flex:1"></audio>' +
    '<button class="danger" id="att-x" style="min-height:38px;padding:8px 12px;font-size:13px">移除</button></div>';
  $("att").querySelector("audio").src = url;
  $("att-x").onclick = clearAtt;
  preview();
}
function compress(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w,h) > max){ var k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      var c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(function(b){ URL.revokeObjectURL(url); b ? res(b) : rej(new Error("轉檔失敗")); },
               "image/jpeg", 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("這張照片讀不出來，換一張試試")); };
    img.src = url;
  });
}
function showVideo(blob, ext){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("video"); a.preload="metadata"; a.src=url;
  a.onloadedmetadata = function(){
    var mbps = blob.size * 8 / (a.duration || 0) / 1e6;   /* B249：畫質太高粉絲 4G 會卡 → 只提醒，不擋 */
    if (isFinite(mbps) && mbps > 10) toast("這支影片約 " + Math.round(mbps) + " Mbps，粉絲用 4G 可能要等一下。下次可把 iPhone 錄影改成 1080p 30fps");
    var s = Math.round(a.duration||0);
    if (isFinite(s) && s>0){
      S.att.dur = (s<600?"0":"") + Math.floor(s/60) + ":" + (s%60<10?"0":"") + (s%60);
      preview();
    }
  };
  S.att = { kind:"video", blob:blob, ext:ext, url:url, dur:"" };
  $("att").className = "";
  $("att").innerHTML = '<div class="rec" style="margin-top:12px;flex-direction:column;align-items:stretch">' +
    '<video controls playsinline webkit-playsinline style="width:100%;border-radius:10px;max-height:40vh;background:#000"></video>' +
    '<button class="danger" id="att-x" style="min-height:38px;padding:8px 12px;font-size:13px;margin-top:8px">移除影片</button></div>';
  $("att").querySelector("video").src = url;
  $("att-x").onclick = clearAtt;
  preview();
}
$("btn-photo").onclick = function(){ $("f-photo").click(); };
$("f-photo").onchange = async function(){
  var f = this.files[0]; this.value = "";
  if (!f) return;
  toast("處理照片中…");
  try { showPhoto(await compress(f)); toast("照片好了"); }
  catch(e){ toast(e.message); }
};
$("btn-voice").onclick = function(){ $("f-voice").click(); };
$("f-voice").onchange = function(){
  var f = this.files[0]; this.value = "";
  if (!f) return;
  if (f.size > 11*1024*1024) return toast("這個檔太大了（超過 11MB）");
  var ext = (f.name.split(".").pop()||"m4a").toLowerCase();
  if (["m4a","mp3","mp4","wav","webm"].indexOf(ext) < 0) ext = "m4a";
  showAudio(f, ext);
};

/* ---------- B249：影片「快速開播」整理 ----------
 * iPhone 原檔把影片的目錄（moov）放在檔案最後面，粉絲點播放時，手機要先跑到檔尾讀目錄才能開始播。
 * 上傳前在這支手機上把 moov 搬到最前面：只搬位置、改索引數字，不重新壓縮，畫質與檔案大小不變。
 * 任何一步看不懂（不是 MP4/MOV、壓縮目錄、檔案太特殊）就原檔照傳，絕不卡住發文。 */
function fsBytes(blob, a, b){ return blob.slice(a, b).arrayBuffer().then(function(x){ return new Uint8Array(x); }); }
function fsType(u, p){ return String.fromCharCode(u[p], u[p+1], u[p+2], u[p+3]); }
async function fsTopAtoms(file){
  var atoms = [], off = 0, size = file.size;
  while (off < size){
    if (off + 8 > size || atoms.length > 200) throw new Error("not mp4");
    var h = await fsBytes(file, off, Math.min(off + 16, size)), dv = new DataView(h.buffer);
    var sz = dv.getUint32(0), hdr = 8, type = fsType(h, 4);
    if (sz === 1){ if (h.length < 16) throw new Error("bad atom"); sz = dv.getUint32(8) * 4294967296 + dv.getUint32(12); hdr = 16; }
    else if (sz === 0) sz = size - off;
    if (sz < hdr || off + sz > size || !/^[\x20-\x7e]{4}$/.test(type)) throw new Error("bad atom");
    atoms.push({ type: type, off: off, size: sz });
    off += sz;
  }
  return atoms;
}
function fsPatchOffsets(moov, map){
  var dv = new DataView(moov.buffer, moov.byteOffset, moov.byteLength), touched = 0;
  var GO = { moov: 1, trak: 1, mdia: 1, minf: 1, stbl: 1, edts: 1 };
  function walk(a, b){
    var p = a;
    while (p + 8 <= b){
      var sz = dv.getUint32(p), hdr = 8, type = fsType(moov, p + 4);
      if (sz === 1){ sz = dv.getUint32(p + 8) * 4294967296 + dv.getUint32(p + 12); hdr = 16; }
      else if (sz === 0) sz = b - p;
      if (sz < hdr || p + sz > b) throw new Error("bad moov");
      if (type === "cmov") throw new Error("compressed moov");
      if (type === "stco"){
        var n = dv.getUint32(p + hdr + 4);
        if (p + hdr + 8 + n * 4 > p + sz) throw new Error("bad stco");
        for (var i = 0; i < n; i++){ var q = p + hdr + 8 + i * 4, v = map(dv.getUint32(q)); if (v > 0xFFFFFFFF) throw new Error("need co64"); dv.setUint32(q, v); }
        touched++;
      } else if (type === "co64"){
        var m = dv.getUint32(p + hdr + 4);
        if (p + hdr + 8 + m * 8 > p + sz) throw new Error("bad co64");
        for (var j = 0; j < m; j++){ var r = p + hdr + 8 + j * 8, old = dv.getUint32(r) * 4294967296 + dv.getUint32(r + 4), nv = map(old);
          dv.setUint32(r, Math.floor(nv / 4294967296)); dv.setUint32(r + 4, nv % 4294967296); }
        touched++;
      } else if (GO[type]) walk(p + hdr, p + sz);
      p += sz;
    }
  }
  var top = dv.getUint32(0) === 1 ? 16 : 8;
  walk(top, moov.length);
  if (!touched) throw new Error("no chunk table");
}
async function fastStart(file){
  var atoms = await fsTopAtoms(file);
  var moovs = atoms.filter(function(a){ return a.type === "moov"; });
  var mdatI = atoms.findIndex(function(a){ return a.type === "mdat"; });
  if (moovs.length !== 1 || mdatI < 0) return { blob: file, changed: false, why: "no moov/mdat" };
  var moovA = moovs[0], moovI = atoms.indexOf(moovA);
  if (moovI < mdatI) return { blob: file, changed: false, why: "already fast" };
  if (moovA.size > 48 * 1024 * 1024) return { blob: file, changed: false, why: "moov too big" };
  var moov = await fsBytes(file, moovA.off, moovA.off + moovA.size);
  var order = [];
  atoms.forEach(function(a, i){ if (i < mdatI && a !== moovA) order.push(a); });
  order.push(moovA);
  atoms.forEach(function(a, i){ if (i >= mdatI && a !== moovA) order.push(a); });
  var pos = 0; order.forEach(function(a){ a.newOff = pos; pos += a.size; });
  fsPatchOffsets(moov, function(old){
    for (var k = 0; k < atoms.length; k++){ var a = atoms[k];
      if (a !== moovA && old >= a.off && old < a.off + a.size) return old - a.off + a.newOff; }
    throw new Error("offset outside file");
  });
  var parts = order.map(function(a){ return a === moovA ? moov : file.slice(a.off, a.off + a.size); });
  var out = new Blob(parts, { type: file.type || "video/quicktime" });
  if (out.size !== file.size) throw new Error("size changed");
  return { blob: out, changed: true };
}

$("btn-video").onclick = function(){ $("f-video").click(); };
$("f-video").onchange = async function(){
  var f = this.files[0]; this.value = "";
  if (!f) return;
  if (f.size > 80*1024*1024) return toast("這支影片太大了（超過 80MB）。剪短或壓一下再傳，建議用 Wi-Fi。");
  var ext = (f.name.split(".").pop()||"mp4").toLowerCase();
  if (["mp4","mov","m4v","webm"].indexOf(ext) < 0) ext = "mp4";
  var blob = f;
  if (ext !== "webm"){
    try { var r = await fastStart(f); blob = r.blob; S.fastStart = r.changed ? "moved" : (r.why || "kept"); }
    catch(e){ blob = f; S.fastStart = "fallback:" + (e && e.message || e); }   /* 看不懂就原檔照傳 */
  }
  showVideo(blob, ext);
};

/* ---------- 錄音 ---------- */
var rec = null, recTimer = null, recChunks = [];
$("btn-rec").onclick = async function(){
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("這支瀏覽器不支援錄音，改用「＋ 語音檔」");
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recChunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = function(e){ if (e.data.size) recChunks.push(e.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(recTimer); $("rec-ui").classList.add("hide");
      var type = (rec.mimeType||"").indexOf("webm")>=0 ? "webm" : "m4a";
      showAudio(new Blob(recChunks, { type: rec.mimeType || "audio/mp4" }), type);
    };
    rec.start();
    var t0 = Date.now();
    $("rec-ui").classList.remove("hide");
    recTimer = setInterval(function(){
      var s = Math.floor((Date.now()-t0)/1000);
      $("rec-t").textContent = (s<600?"0":"")+Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60);
      if (s >= 300) $("btn-stop").click();
    }, 250);
  } catch(e){ toast("拿不到麥克風權限"); }
};
$("btn-stop").onclick = function(){ if (rec && rec.state !== "inactive") rec.stop(); };

/* ---------- 預覽 ---------- */
function preview(){
  var t = $("text").value.trim();
  var p = $("prev");
  var body = t ? esc(t) : '<span style="color:var(--dim)">…</span>';
  if (S.att && S.att.kind === "photo") body += '<img src="'+S.att.url+'" alt="預覽">';
  if (S.att && S.att.kind === "voice") body += '<audio controls src="'+S.att.url+'"></audio>';
  if (S.att && S.att.kind === "video") body += '<video controls playsinline src="'+S.att.url+'" style="max-width:100%;border-radius:10px;margin-top:8px"></video>';
  var tag = S.tier === "signal"
    ? '<span class="tag signal">SIGNAL 限定</span>'
    : '<span class="tag">所有人</span>';
  p.innerHTML = body + '<div class="meta">'+tag+'<span>'+when(Date.now())+'</span></div>';
}
$("text").addEventListener("input", preview);
preview();

/* ---------- 發布 ---------- */
$("btn-send").onclick = async function(){
  var text = $("text").value.trim();
  if (!text && !S.att) return toast("先寫點字或加個檔案");
  var btn = this; btn.disabled = true; btn.textContent = "發布中…";
  try {
    var mediaKey = "";
    if (S.att){
      $("send-hint").textContent = "上傳檔案中…";
      var up = await fetch(API + "/upload?ext=" + S.att.ext, {
        method:"PUT",
        headers:{ "X-Feed-Key": S.key, "Content-Type": S.att.blob.type || "application/octet-stream" },
        body: S.att.blob });
      var ud = await up.json();
      if (!ud.ok) throw new Error(ud.error || "上傳失敗");
      mediaKey = ud.key;
    }
    $("send-hint").textContent = "";
    var d = await api("/post", { method:"POST", json:{
      type: S.att ? S.att.kind : "text",
      text: text, media: mediaKey, dur: S.att ? S.att.dur : "", tier: S.tier } });
    if (!d.ok) throw new Error(d.error);
    $("text").value = ""; clearAtt();
    toast(d.post.status === "pending" ? "已送出，等站主審核" : "發布了");
    S.filter = d.post.status === "pending" ? "pending" : "live";
    syncFilters();
    load();
  } catch(e){
    toast(e.message || "發布失敗，再試一次");
    $("send-hint").textContent = "";
  } finally {
    btn.disabled = false; btn.textContent = "發布";
  }
};

/* ---------- 列表 ---------- */
function syncFilters(){
  Array.prototype.forEach.call($("filters").children, function(b){
    b.setAttribute("aria-pressed", b.dataset.f === S.filter ? "true" : "false"); });
}
Array.prototype.forEach.call($("filters").children, function(b){
  b.onclick = function(){ S.filter = b.dataset.f; syncFilters(); if (S.filter === "replies") { $("list").innerHTML = '<p class="hint">載入中…</p>'; loadReplies(); } else render(); };
});

async function loadReplies(){
  var d = await api("/replies");
  if (!d.ok){ $("list").innerHTML = '<p class="hint">讀不到回覆：'+esc(d.error||"")+'</p>'; return; }
  S.replies = d.replies || [];
  renderReplies();
}
function fmtWhen(iso){
  try{
    var d = new Date(iso), n = new Date();
    var pad = function(x){ return x<10?"0"+x:""+x; };
    var hm = pad(d.getHours())+":"+pad(d.getMinutes());
    if (d.toDateString() === n.toDateString()) return "今天 "+hm;
    var y = new Date(n.getTime()-86400000);
    if (d.toDateString() === y.toDateString()) return "昨天 "+hm;
    return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
  }catch(e){ return ""; }
}
function maskEmail(e){
  if (!e) return "粉絲";
  var i = e.indexOf("@"); if (i < 1) return "粉絲";
  var n = e.slice(0,i), dm = e.slice(i);
  return (n.length<=2 ? n[0]+"*" : n.slice(0,2)+"***") + dm;
}
function renderReplies(){
  var list = S.replies || [];
  if (!list.length){ $("list").innerHTML = '<p class="hint">還沒有粉絲回覆。<br><span style="color:var(--dim);font-size:12px">回覆功能目前關閉中，開放後粉絲寫的話跟語音會出現在這裡。</span></p>'; return; }
  $("list").innerHTML = list.map(function(r, i){
    var body;
    if (r.kind === "voice" && r.media){
      body = '<div class="rvoice"><button class="rv-play" data-rv="'+i+'">▶</button>'+
             '<span class="rv-dur">'+(r.dur? (r.dur+'"') : '語音')+'</span>'+
             '<span class="rv-state" id="rvs-'+i+'"></span></div>';
    } else {
      body = '<div class="body" style="white-space:pre-wrap">'+esc(r.text||"")+'</div>';
    }
    return '<div class="item">'+
      '<div class="meta"><span class="tag">'+esc(maskEmail(r.email))+'</span>'+
      '<span class="tag">'+esc(fmtWhen(r.ts))+'</span>'+
      (r.kind === "voice" ? '<span class="tag signal">語音</span>' : '')+'</div>'+
      body+
    '</div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".rv-play"), function(b){
    b.onclick = async function(){
      var idx = +b.dataset.rv, r = S.replies[idx];
      var st = document.getElementById("rvs-"+idx);
      if (b.__au){ if (b.__au.paused){ b.__au.play(); b.textContent="❚❚"; } else { b.__au.pause(); b.textContent="▶"; } return; }
      b.disabled = true; st.textContent = "載入中…";
      try{
        var res = await fetch(API+"/reply-media?key="+encodeURIComponent(r.media), { headers:{ "X-Feed-Key": S.key } });
        if (!res.ok) throw new Error("讀不到");
        var blob = await res.blob();
        var au = new Audio(URL.createObjectURL(blob));
        b.__au = au; st.textContent = "";
        au.onended = function(){ b.textContent = "▶"; };
        au.play(); b.textContent = "❚❚";
      }catch(e){ st.textContent = "播不出來"; }
      b.disabled = false;
    };
  });
}
async function load(){
  if (S.filter === "replies") return loadReplies();
  var d = await api("/list");
  if (!d.ok){ $("list").innerHTML = '<p class="hint">讀不到貼文：'+esc(d.error)+'</p>'; return; }
  S.posts = d.posts || [];
  if (d.settings){ S.settings = d.settings; if (S.role==="owner") syncReviewBtn(); }
  render();
}

function mediaURL(key){ return API + "/media?key=" + encodeURIComponent(key) + "&_k=" + Date.now(); }

function render(){
  if (S.filter === "replies") return renderReplies();
  var list = S.posts.filter(function(p){ return p.status === S.filter; });
  if (!list.length){
    var empty = { live:"還沒有發布中的貼文。", pending:"沒有待審核的貼文。",
                  hidden:"沒有隱藏中的貼文。", deleted:"沒有刪掉的貼文。" }[S.filter];
    $("list").innerHTML = '<p class="hint">'+empty+'</p>'; return;
  }
  $("list").innerHTML = list.map(function(p){
    var body = p.text ? esc(p.text) : "";
    if (p.type === "photo" && p.media) body += '<img loading="lazy" alt="" src="'+mediaURL(p.media)+'">';
    if (p.type === "voice" && p.media) body += '<audio controls preload="none" src="'+mediaURL(p.media)+'"></audio>';
    if (!body) body = '<span style="color:var(--dim)">（空白）</span>';

    var tags = p.tier === "signal" ? '<span class="tag signal">SIGNAL</span>' : '<span class="tag">公開</span>';
    if (p.status === "pending") tags += '<span class="tag pending">待審核</span>';
    if (p.status === "hidden")  tags += '<span class="tag hidden">已隱藏</span>';
    if (p.status === "deleted") tags += '<span class="tag deleted">已刪除</span>';
    if (p.author === "owner")   tags += '<span class="tag">站主發布</span>';
    if (p.editedAt)             tags += '<span class="tag">已編輯</span>';

    var mine = !(S.role === "artist" && p.author === "owner");
    var acts = "";
    if (p.status === "deleted"){
      if (S.role === "owner")
        acts = '<button data-a="restore" data-id="'+p.id+'">復原</button>' +
               '<button class="danger" data-a="purge" data-id="'+p.id+'">永久刪除</button>';
    } else if (mine){
      acts = '<button data-a="edit" data-id="'+p.id+'">編輯</button>';
      if (p.status === "pending" && S.role === "owner")
        acts += '<button class="primary" style="flex:0" data-a="approve" data-id="'+p.id+'">發布</button>';
      if (p.status === "live")
        acts += '<button data-a="hide" data-id="'+p.id+'">隱藏</button>';
      if (p.status === "hidden")
        acts += '<button data-a="show" data-id="'+p.id+'">重新發布</button>';
      acts += '<button class="danger" data-a="del" data-id="'+p.id+'">刪除</button>';
    } else {
      acts = '<span class="hint">這則是你發的，藝人端改不了。</span>';
    }

    return '<div class="item'+(p.status==="deleted"?" gone":"")+'" id="i-'+p.id+'">' +
             '<div class="bubble">'+body+'</div>' +
             '<div class="meta">'+tags+'<span>'+when(p.ts)+'</span></div>' +
             '<div class="acts">'+acts+'</div></div>';
  }).join("");

  Array.prototype.forEach.call($("list").querySelectorAll("button[data-a]"), function(b){
    b.onclick = function(){ act(b.dataset.a, b.dataset.id, b); };
  });
}

async function act(a, id, btn){
  var p = S.posts.filter(function(x){ return x.id === id; })[0];
  if (!p) return;

  if (a === "edit"){
    var box = $("i-" + id);
    if (box.querySelector("textarea")) return;
    var ed = document.createElement("div");
    ed.style.marginTop = "10px";
    ed.innerHTML = '<textarea></textarea>' +
      '<div class="seg" style="margin-top:8px">' +
        '<button data-t="public" aria-pressed="'+(p.tier!=="signal")+'">所有人</button>' +
        '<button data-t="signal" aria-pressed="'+(p.tier==="signal")+'">SIGNAL 會員</button></div>' +
      '<div class="acts"><button class="primary" style="flex:0">儲存</button><button class="ghost">取消</button></div>';
    ed.querySelector("textarea").value = p.text || "";
    var tier = p.tier;
    Array.prototype.forEach.call(ed.querySelectorAll(".seg button"), function(x){
      x.onclick = function(){
        tier = x.dataset.t;
        Array.prototype.forEach.call(ed.querySelectorAll(".seg button"), function(y){
          y.setAttribute("aria-pressed", y===x ? "true" : "false"); });
      };
    });
    var btns = ed.querySelectorAll(".acts button");
    btns[1].onclick = function(){ ed.remove(); };
    btns[0].onclick = async function(){
      btns[0].disabled = true;
      var d = await api("/edit", { method:"POST",
        json:{ id:id, text: ed.querySelector("textarea").value, tier: tier } });
      if (!d.ok){ btns[0].disabled=false; return toast(d.error); }
      toast("改好了"); load();
    };
    box.appendChild(ed);
    ed.querySelector("textarea").focus();
    return;
  }

  if (a === "del"){
    var what = (p.text || "").slice(0, 24) || ({photo:"這張照片", voice:"這段語音"}[p.type] || "這則貼文");
    if (!confirm("要刪掉「" + what + "」嗎？\n粉絲會馬上看不到。站主可以在「已刪除」裡復原。")) return;
    var d = await api("/delete", { method:"POST", json:{ id:id } });
    if (!d.ok) return toast(d.error);
    toast("刪掉了"); return load();
  }
  if (a === "purge"){
    if (!confirm("永久刪除，連檔案一起清掉，救不回來。確定？")) return;
    var d2 = await api("/delete", { method:"POST", json:{ id:id, purge:true } });
    if (!d2.ok) return toast(d2.error);
    toast("永久刪除了"); return load();
  }

  var map = { hide:"hidden", show:"live", approve:"live" };
  if (map[a]){
    if (btn) btn.disabled = true;
    var d3 = await api("/edit", { method:"POST", json:{ id:id, status: map[a] } });
    if (!d3.ok){ if (btn) btn.disabled=false; return toast(d3.error); }
    toast({ hide:"已隱藏", show:"重新發布了", approve:"發布了" }[a]);
    return load();
  }
  if (a === "restore"){
    var d4 = await api("/restore", { method:"POST", json:{ id:id } });
    if (!d4.ok) return toast(d4.error);
    toast("復原了"); return load();
  }
}

/* ---------- 啟動 ---------- */
(function(){
  var saved = localStorage.getItem(LSK);
  if (saved) login(saved); else $("key").focus();
})();
</script>
