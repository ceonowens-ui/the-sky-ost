<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHANCE 播放器 Tuner</title>
<style>
:root{ --bg:#0f0e10; --panel:#18161a; --line:#2b2830; --tx:#ece6dc; --mut:#9a93a0; --gold:#d8c3a0; }
*{ box-sizing:border-box; } html,body{ margin:0; height:100%; background:var(--bg); color:var(--tx); font:13px/1.45 -apple-system,"PingFang TC",sans-serif; }
.app{ display:flex; height:100%; }
.stageWrap{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.scaler{ transform-origin:center center; }
.device{ position:relative; border-radius:56px; background:#000; box-shadow:0 0 0 12px #1c1b1f, 0 0 0 13px #3a3840, 0 30px 80px rgba(0,0,0,.6); overflow:hidden; }
.device iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
.island{ position:absolute; left:50%; transform:translateX(-50%); background:#000; border-radius:20px; z-index:5; pointer-events:none; }
.statusbar{ position:absolute; left:0; right:0; display:flex; justify-content:space-between; padding:0 34px; font-weight:600; font-size:15px; color:#fff; z-index:4; pointer-events:none; mix-blend-mode:difference; }
.home{ position:absolute; left:50%; bottom:8px; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:rgba(255,255,255,.85); z-index:5; pointer-events:none; }
.side{ width:360px; flex:none; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px 16px 40px; }
h1{ font-size:15px; margin:0 0 4px; color:var(--gold); letter-spacing:.04em; }
.note{ color:var(--mut); font-size:12px; margin:0 0 12px; }
h2{ font-size:12px; letter-spacing:.14em; color:var(--gold); margin:18px 0 6px; padding-top:12px; border-top:1px solid var(--line); }
.row{ display:grid; grid-template-columns:96px 1fr 50px; align-items:center; gap:8px; margin:6px 0; }
.row label{ color:#cfc8d2; }
.row input[type=range]{ width:100%; accent-color:var(--gold); }
.row .v{ text-align:right; font-variant-numeric:tabular-nums; color:var(--tx); }
.row .v.changed{ color:var(--gold); }
select,input[type=text]{ width:100%; background:#0f0e10; color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font:inherit; }
.btns{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
button{ background:#232027; color:var(--tx); border:1px solid #37333c; border-radius:9px; padding:7px 10px; font:inherit; cursor:pointer; }
button:hover{ border-color:var(--gold); }
button.primary{ background:var(--gold); color:#151210; border-color:var(--gold); font-weight:600; }
.seg{ display:flex; gap:4px; } .seg button{ flex:1; padding:6px 4px; } .seg button.on{ border-color:var(--gold); color:var(--gold); }
textarea{ width:100%; height:150px; background:#0b0a0c; color:#cfe; border:1px solid var(--line); border-radius:8px; font:11px/1.4 ui-monospace,Menlo,monospace; padding:8px; }
/* ===== 手機模式（寬度 ≤700）：App 全螢幕＋上方可收合的調整面板 ===== */
.mbar{ display:none; }
body.mobile{ overflow:hidden; }
body.mobile .stageWrap{ position:fixed; inset:0; display:block; }
body.mobile .scaler{ transform:none !important; }
body.mobile .device{ width:100vw !important; height:100vh !important; height:100dvh !important; border-radius:0 !important; box-shadow:none !important; }
body.mobile .island, body.mobile .statusbar, body.mobile .home, body.mobile .devRow, body.mobile .desktopOnly{ display:none !important; }
body.mobile .side{ position:fixed; left:0; right:0; top:0; width:auto; z-index:20; max-height:48vh; max-height:48dvh; padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 12px;
  background:rgba(16,14,18,.94); border:0; border-bottom:1px solid #3a3530; border-radius:0 0 18px 18px; box-shadow:0 10px 30px rgba(0,0,0,.5); transition:opacity .15s ease; -webkit-overflow-scrolling:touch; }
body.mobile.bottom .side{ top:auto; bottom:0; border-radius:18px 18px 0 0; border-bottom:0; border-top:1px solid #3a3530; padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px); }
body.mobile .side.peek{ opacity:.28; }
body.mobile .side.closed{ max-height:none; overflow:hidden; padding-bottom:6px; }
body.mobile .side.closed > *:not(.mbar){ display:none !important; }
body.mobile .mbar{ display:flex; align-items:center; gap:6px; position:sticky; top:-6px; z-index:2; background:inherit; padding:2px 0 8px; }
body.mobile .mbar b{ color:var(--gold); font-size:13px; flex:1; }
body.mobile .mbar button{ padding:7px 10px; font-size:12px; }
body.mobile .mtabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:2px 0 6px; } body.mobile .mtabs button{ padding:7px 2px; font-size:12px; }
body.mobile .mtabs button.on{ border-color:var(--gold); color:var(--gold); }
body.mobile .grp{ display:none; } body.mobile .grp.on{ display:block; }
body.mobile h2{ margin-top:4px; padding-top:0; border-top:0; }
body.mobile .row{ grid-template-columns:84px 1fr 52px; margin:9px 0; }
body.mobile .row input[type=range]{ height:28px; }
body.mobile h1, body.mobile .side > .note{ display:none; }
.warn{ background:#2a1f12; border:1px solid #5a4322; color:#e8cf9e; border-radius:8px; padding:8px 10px; font-size:12px; margin:8px 0; display:none; }
</style></head>
<body>
<div class="app">
  <div class="stageWrap" id="stageWrap"><div class="scaler" id="scaler">
    <div class="device" id="device">
      <div class="island" id="island"></div>
      <div class="statusbar" id="statusbar"><span>9:41</span><span>●●● ▮</span></div>
      <iframe id="f" title="CHANCE App 預覽"></iframe>
      <div class="home" id="home"></div>
    </div>
  </div></div>
  <aside class="side" id="side">
    <div class="mbar"><b>播放器 Tuner</b><button onclick="appCall('play')">▶ 播放</button><button id="mPos" onclick="togglePos()">移到下方</button><button id="mClose" onclick="toggleClose()">收起</button></div>
    <div class="mtabs" id="mtabs"></div>
    <h1>CHANCE 播放器 Tuner</h1>
    <p class="note">預設值＝B248T。拖滑桿即時預覽（只改這個預覽，不會改到線上）。調好按「複製設定」貼給 Claude。</p>
    <div class="warn" id="warn">讀不到 App 內容：tuner 必須和 test225.html 放在同一個網站（例如 chance1228.com/play-tuner.html），直接開下載的檔案不能用。</div>
    <div class="row devRow" style="grid-template-columns:96px 1fr"><label>機型</label><select id="dev"></select></div>
    <div class="grp" data-g="app">
    <div class="row" style="grid-template-columns:96px 1fr"><label>App 網址</label><input type="text" id="src" value="test225.html?album=classics&track=1"></div>
    <div class="btns"><button onclick="loadSrc()">載入</button><button onclick="reloadApp()">重新整理</button></div>
    <div class="note" style="margin:2px 0 4px">切換分頁：</div>
    <div class="seg" id="tabs">
      <button data-s="player">PLAY</button><button data-s="mood">FEED</button><button data-s="merch">SHOP</button><button data-s="purchase">OWN</button><button data-s="lucky">LUCKY</button>
    </div>
    <div class="btns"><button onclick="appCall('queue')">開待播清單</button><button onclick="appCall('cover')">回主播放器</button><button onclick="appCall('album')">切換專輯</button></div>
    <div class="btns"><button class="primary" onclick="appCall('play')">▶ 播放（顯示音樂島）</button><button onclick="appCall('collapse')">收合 nav</button><button onclick="appCall('expand')">展開 nav</button></div>
    <p class="note">音樂島要「開始播放」後才會出現：先按「▶ 播放」，再切到 FEED／SHOP／OWN。</p>
    </div>
    <div id="groups"></div>
    <div class="grp" data-g="out">
    <h2>輸出</h2>
    <div class="btns"><button class="primary" onclick="copyCfg()">複製設定</button><button onclick="resetAll()">全部重設為 B248T</button></div>
    <textarea id="out" readonly placeholder="按「複製設定」後這裡會出現設定文字"></textarea>
    </div>
  </aside>
</div>
<script>
/* ---- 機型（safe-area 依 iPhone 實際規格） ---- */
var DEVICES=[
  {id:'14plus',name:'iPhone 14 Plus（428×926）',w:428,h:926,top:47,bottom:34,island:false},
  {id:'14',name:'iPhone 12/13/14（390×844）',w:390,h:844,top:47,bottom:34,island:false},
  {id:'15',name:'iPhone 15/16（393×852 靈動島）',w:393,h:852,top:59,bottom:34,island:true},
  {id:'15pm',name:'iPhone 15/16 Plus/Pro Max（430×932）',w:430,h:932,top:59,bottom:34,island:true},
  {id:'mini',name:'iPhone 12/13 mini（375×812）',w:375,h:812,top:50,bottom:34,island:false},
  {id:'se',name:'iPhone SE（375×667）',w:375,h:667,top:20,bottom:0,island:false},
  {id:'320',name:'窄螢幕測試（320×690）',w:320,h:690,top:20,bottom:0,island:false}
];
/* ---- 可調參數（預設＝B248T） ---- */
var GROUPS=[
 {title:'PLAY 主播放器（只影響封面模式）',items:[
  {k:'lift',label:'整組上移',min:0,max:90,step:1,def:21,u:'px'},
  {k:'gap',label:'歌名↔控制列',min:4,max:48,step:1,def:18,u:'px'},
  {k:'ttl',label:'歌名字級',min:24,max:46,step:1,def:36,u:'px'},
  {k:'sub',label:'副標字級',min:12,max:22,step:1,def:15,u:'px'},
  {k:'tim',label:'時間字級',min:10,max:18,step:1,def:14,u:'px'},
  {k:'pp',label:'主播放大小',min:52,max:92,step:1,def:74,u:'px'},
  {k:'pn',label:'上/下一首',min:20,max:42,step:1,def:31,u:'px'},
  {k:'pstyle',label:'主播放樣式',type:'seg',opts:[['ring','細線圓'],['solid','實心白圓'],['none','無框']],def:'ring'},
  {k:'tl',label:'時間軸',type:'seg',opts:[['pill','玻璃膠囊（現行）'],['line','細線']],def:'pill'},
  {k:'tlh',label:'膠囊高度',min:40,max:64,step:1,def:40,u:'px'},
  {k:'tla',label:'膠囊底色',min:4,max:40,step:1,def:4,u:'%'}
 ]},
 {title:'PLAY 主照片（柔化）',items:[
  {k:'cvb',label:'照片底部位置',min:0,max:30,step:1,def:25,u:'%'},
  {k:'cvf',label:'漸層開始',min:30,max:85,step:1,def:80,u:'%'},
  {k:'cvr',label:'底部圓角',min:0,max:48,step:1,def:28,u:'px'},
  {k:'cvs',label:'左右內縮',min:0,max:24,step:1,def:0,u:'px'}
 ]},
 {title:'NAV 導覽列（全分頁）',items:[
  {k:'nscale',label:'nav 整體比例',min:60,max:140,step:1,def:100,u:'%'},
  {k:'navh',label:'nav 高度',min:44,max:92,step:0.5,def:59,u:'px'},
  {k:'nfs',label:'文字字級',min:10,max:18,step:0.5,def:11,u:'px'},
  {k:'nico',label:'圖示大小',min:14,max:32,step:0.5,def:20,u:'px'},
  {k:'nwt',label:'文字粗細',min:400,max:700,step:100,def:400,u:''},
  {k:'side',label:'左右留白',min:6,max:48,step:1,def:24,u:'px'},
  {k:'nop',label:'未選中亮度',min:20,max:100,step:1,def:45,u:'%'},
  {k:'nact',label:'選中放大',min:0,max:3,step:0.5,def:1,u:'px'},
  {k:'nls',label:'字距',min:0,max:3,step:0.1,def:1.7,u:'px'},
  {k:'nfont',label:'字型',type:'seg',opts:[['serif','襯線（現行）'],['sans','無襯線']],def:'serif'},
  {k:'nrad',label:'外框圓角',min:0,max:40,step:1,def:40,u:'px'},
  {k:'irad',label:'選中底色圓角',min:0,max:32,step:1,def:18,u:'px'},
  {k:'nopa',label:'島不透明度',min:20,max:100,step:1,def:31,u:'%'},
  {k:'glass',label:'島樣式',type:'seg',opts:[['solid','實心（現行）'],['glass','玻璃剝離']],def:'solid'},
  {k:'galpha',label:'玻璃底色',min:15,max:95,step:1,def:45,u:'%'},
  {k:'gblur',label:'玻璃模糊',min:0,max:40,step:1,def:22,u:'px'},
  {k:'gshadow',label:'浮起陰影',min:0,max:100,step:1,def:60,u:'%'},
  {k:'glift',label:'離底距離',min:0,max:32,step:1,def:10,u:'px'}
 ]},
 {title:'音樂島（mini 播放器）',items:[
  {k:'mscale',label:'島整體比例',min:60,max:140,step:1,def:100,u:'%'},
  {k:'minih',label:'島高度',min:56,max:100,step:0.5,def:65,u:'px'},
  {k:'cov',label:'封面',min:30,max:64,step:0.5,def:39.5,u:'px'},
  {k:'mt',label:'歌名字級',min:13,max:24,step:0.5,def:14,u:'px'},
  {k:'ms',label:'副標字級',min:10,max:18,step:0.5,def:10,u:'px'},
  {k:'mp',label:'播放鍵',min:44,max:64,step:1,def:44,u:'px'},
  {k:'mfont',label:'歌名字型',type:'seg',opts:[['serif','襯線（現行）'],['sans','無襯線粗體']],def:'serif'},
  {k:'split',label:'島的形式',type:'seg',opts:[['merged','合併（現行）'],['float','分開浮動']],def:'merged'},
  {k:'marq',label:'字幕流動',type:'seg',opts:[['always','一律流動（現行）'],['overflow','超出才動']],def:'always'}
 ]},
 {title:'待播清單（按 PLAY 右下 ☰ 開啟）',items:[
  {k:'qn',label:'曲名',min:14,max:22,step:0.5,def:17.5,u:'px'},
  {k:'qa',label:'歌手',min:11,max:18,step:0.5,def:15,u:'px'},
  {k:'qnote',label:'插曲註解',min:10,max:17,step:0.5,def:14,u:'px'},
  {k:'qh',label:'分類標題',min:11,max:18,step:0.5,def:14.5,u:'px'},
  {k:'qtop',label:'頂部目前歌曲',min:15,max:26,step:0.5,def:21,u:'px'},
  {k:'qimg',label:'封面',min:36,max:64,step:1,def:47,u:'px'},
  {k:'qrow',label:'每列高度',min:56,max:96,step:1,def:75,u:'px'}
 ]},
 {title:'FEED 未解鎖 Unlock',items:[
  {k:'uh',label:'按鈕高度',min:36,max:64,step:1,def:50,u:'px'},
  {k:'uf',label:'文字字級',min:15,max:28,step:0.5,def:21,u:'px'},
  {k:'uw',label:'寬度',min:40,max:80,step:1,def:58,u:'vw'},
  {k:'ug',label:'與 dock 間距',min:16,max:96,step:1,def:40,u:'px'}
 ]}
];
var S={}, DEF={};
var f=document.getElementById('f');
function each(fn){ GROUPS.forEach(function(g){ g.items.forEach(fn); }); }
each(function(it){ S[it.k]=it.def; DEF[it.k]=it.def; });

function V(){   /* 套用整體比例後的實際尺寸（四捨五入到 0.5px） */
  var n=S.nscale/100, m=S.mscale/100, r=function(x){ return Math.round(x*2)/2; };
  return {navh:r(S.navh*n), nfs:r(S.nfs*n), nico:r(S.nico*n), minih:r(S.minih*m), cov:r(S.cov*m), mt:r(S.mt*m), ms:r(S.ms*m), mp:Math.max(44,r(S.mp*m))};
}
function solidAlphaCSS(){   /* 實心樣式的透明度：底色 #0D0C0B 改成半透明，並加一點毛玻璃，字才不會糊在照片上 */
  var a=(S.nopa/100).toFixed(2), bf=S.nopa>=100?'none':'blur('+Math.max(8,S.gblur)+'px) saturate(150%)';   /* App 本身已是 31%：100% 時要明確蓋回實心 */
  return 'body.dock-merged #nav-wrap #nav, #nav-wrap #nav, #mini-player.mini-player{background:rgba(13,12,11,'+a+') !important;-webkit-backdrop-filter:'+bf+' !important;backdrop-filter:'+bf+' !important;}';
}
function glassCSS(X){   /* TIDE 式玻璃剝離：完全膠囊、半透明毛玻璃、亮邊、明顯陰影、離底更高；音樂島改成獨立浮動 */
  var a=S.galpha/100, sh=S.gshadow/100, bf='blur('+S.gblur+'px) saturate(160%)';
  var glassBg='background:rgba(22,20,26,'+a+') !important;-webkit-backdrop-filter:'+bf+' !important;backdrop-filter:'+bf+' !important;border:1px solid rgba(255,255,255,.14) !important;';
  var glassSh='box-shadow:0 18px 40px rgba(0,0,0,'+(0.75*sh).toFixed(2)+'),0 3px 10px rgba(0,0,0,'+(0.45*sh).toFixed(2)+'),inset 0 1px 0 rgba(255,255,255,.16) !important;';
  return [':root{--dock-b:calc(max(8px, calc(var(--sab, env(safe-area-inset-bottom)) + 8px)) + '+S.glift+'px);}',
   'body.dock-merged #nav-wrap #nav, #nav-wrap #nav{'+glassBg+glassSh+'border-radius:999px !important;}',
   '#nav-wrap #nav-ind{background:rgba(255,255,255,.12) !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16) !important;border-radius:999px !important;}',
   'body.dock-merged #mini-player.mini-player, #mini-player.mini-player{'+glassBg+glassSh+'border-radius:28px !important;bottom:calc(var(--dock-b) + var(--dock-nav-h) + 10px) !important;}',
   'body.dock-collapsed #mini-player.mini-player{transform:translateY(calc(var(--dock-nav-h) + 10px)) !important;}',
   'body.has-mini .screen.active::after{height:calc(var(--dock-mini-h) + 18px) !important;}'].join('\n');
}
function lineCSS(){   /* App 已內建玻璃膠囊：選「細線」時要把它蓋回原本的排法 */
  var P='#screen-player.cp-ready:not(.cp-immersive) ';
  return [P+'#cp-transport{display:block !important;} '+P+'#cp-transport::before{content:none !important;display:none !important;}',
   P+'.np-times{display:flex !important;} '+P+'#cm-btn{margin:0 !important;} '+P+'#prog{margin:revert !important;}'].join('\n');
}
function pillCSS(){   /* Moonly 式時間軸：時間｜進度條｜時間 放進同一顆玻璃膠囊（只在 PLAY 封面模式；拖曳進度仍是原本的 #prog） */
  var P='#screen-player.cp-ready:not(.cp-immersive) ';
  return [P+'#cp-transport{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"cur bar dur" "cm cm cm" "ctl ctl ctl" "lyr lyr lyr";column-gap:14px;align-items:center;}',
   P+'#cp-transport::before{content:"";grid-row:1;grid-column:1 / 4;height:'+S.tlh+'px;margin:0 -16px;border-radius:999px;pointer-events:none;background:rgba(255,255,255,'+(S.tla/100)+');border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);}',
   P+'.np-times{display:contents;}',
   P+'#t-cur{grid-area:cur;z-index:1;} '+P+'#t-dur{grid-area:dur;z-index:1;} '+P+'#prog{grid-area:bar;z-index:1;margin:0 !important;}',
   P+'#cm-btn{grid-area:cm;justify-self:center;margin:12px 0 12px;} '+P+'.np-controls{grid-area:ctl;} '+P+'#cp-lyr-row{grid-area:lyr;}'].join('\n');
}
function css(){
  var X=V();
  var sideW='min(calc(100vw - '+(S.side*2)+'px),480px)';
  var pv=S.pstyle==='solid'?'border:0 !important;background:#F1ECE3 !important;color:#141210 !important;':
         S.pstyle==='none'?'border:0 !important;background:transparent !important;':
         'border:1.5px solid rgba(241,236,227,.82) !important;background:rgba(12,11,10,.28) !important;';
  var merged=S.split==='merged';
  return [
   ':root{--dock-nav-h:'+X.navh+'px;--dock-mini-h:'+X.minih+'px;--nav-fs:'+X.nfs+'px;--nav-ico:'+X.nico+'px;--dock-w:'+sideW+';--dock-mini-reserve:calc(var(--dock-mini-h) + 8px);}',
   '#nav-wrap #nav .navbtn{color:rgba(230,223,210,'+(S.nop/100)+') !important;}',
   '#nav-wrap #nav .navbtn.active .navlbl{font-size:'+(X.nfs+S.nact)+'px !important;}',
   (S.glass==='glass'?glassCSS(X):solidAlphaCSS()),
   (S.tl==='pill'?pillCSS():lineCSS()),
   ':root{--dock-r:'+S.nrad+'px;} #nav-wrap #nav-ind{border-radius:'+S.irad+'px !important;} #nav-wrap #nav .navbtn:focus-visible{border-radius:'+Math.max(0,S.irad)+'px;}',
   '#nav-wrap #nav .navbtn .navlbl{letter-spacing:'+S.nls+'px !important;text-indent:'+S.nls+'px !important;'+(S.nfont==='sans'?'font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif !important;':'')+'}',
   '#nav-wrap #nav .navbtn .navlbl{font-weight:'+S.nwt+';height:'+(X.nfs+3)+'px;line-height:'+(X.nfs+3)+'px;}',
   '#mini-player .mp-cover{width:'+X.cov+'px;height:'+X.cov+'px;}',
   '#mini-player .mp-open{height:'+Math.max(44,X.cov)+'px;min-height:'+Math.max(44,X.cov)+'px;}',
   '#mini-player .mp-title{font-size:'+X.mt+'px;line-height:'+(X.mt+4)+'px;'+(S.mfont==='sans'?'font-family:-apple-system,"PingFang TC",sans-serif;font-weight:700;':'')+'}',
   '#mini-player .mp-marq{font-size:'+X.ms+'px;line-height:'+(X.ms+4)+'px;height:'+(X.ms+4)+'px;}',
   '#mini-player .mp-btn.mp-play{width:'+X.mp+'px;height:'+X.mp+'px;min-width:'+X.mp+'px;}',
   '#mini-player .mp-btn.mp-play svg{width:'+Math.round(X.mp*0.46)+'px;height:'+Math.round(X.mp*0.46)+'px;}',
   merged?'':'#mini-player.mini-player{bottom:calc(var(--dock-b) + var(--dock-nav-h) + 10px) !important;border-radius:22px !important;border:1px solid rgba(241,236,227,.12) !important;box-shadow:0 14px 34px rgba(0,0,0,.5) !important;} #nav-wrap #nav{border-radius:22px !important;border-top-color:rgba(241,236,227,.10) !important;} body.dock-collapsed #mini-player.mini-player{transform:translateY(calc(var(--dock-nav-h) + 10px)) !important;} body.has-mini .screen.active::after{height:calc(var(--dock-mini-h) + 18px) !important;}',
   '#screen-player.cp-ready{--cp-lift:'+S.lift+'px !important;--cp-gap:'+S.gap+'px !important;--cv-bottom:'+S.cvb+'% !important;--cv-fade:'+S.cvf+'% !important;--cv-r:'+S.cvr+'px !important;--cv-side:'+S.cvs+'px !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-title{font-size:'+S.ttl+'px !important;}',
   '#screen-player #cp-queue .cp-track-name{font-size:'+S.qn+'px !important;} #screen-player #cp-queue .cp-track-artist{font-size:'+S.qa+'px !important;} #screen-player #cp-queue .cp-track-note{font-size:'+S.qnote+'px !important;}',
   '#screen-player #cp-queue .cp-queue-heading{font-size:'+S.qh+'px !important;} #screen-player.cp-immersive:not(.cp-lyr) #cp-title{font-size:'+S.qtop+'px !important;}',
   '#screen-player #cp-queue .cp-track img{width:'+S.qimg+'px !important;height:'+S.qimg+'px !important;} #screen-player #cp-queue .cp-track{min-height:'+S.qrow+'px !important;}',
   '#screen-mood.sgl-locked{--sg-btn-h:'+S.uh+'px !important;--sg-btn-font:'+S.uf+'px !important;--sg-btn-w:min('+S.uw+'vw,280px) !important;--sgl-gap:'+S.ug+'px !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-sub{font-size:'+S.sub+'px !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-times{font-size:'+S.tim+'px !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-controls{grid-template-columns:minmax(44px,1fr) minmax(44px,1fr) '+(S.pp+2)+'px minmax(44px,1fr) minmax(44px,1fr) !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-controls #btn-play{width:'+S.pp+'px !important;height:'+S.pp+'px !important;max-width:none !important;min-width:'+S.pp+'px !important;border-radius:50% !important;'+pv+'}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-controls #btn-play svg{width:'+Math.round(S.pp*0.5)+'px !important;height:'+Math.round(S.pp*0.5)+'px !important;}',
   '#screen-player.cp-ready:not(.cp-immersive) .np-controls #btn-prev svg,#screen-player.cp-ready:not(.cp-immersive) .np-controls #btn-next svg{width:'+S.pn+'px !important;height:'+S.pn+'px !important;}'
  ].join('\n');
}
function doc(){ try{ return f.contentDocument; }catch(e){ return null; } }
function apply(){
  var d=doc(); var w=document.getElementById('warn');
  if(!d||!d.body){ if(f.src) w.style.display='block'; return; }
  w.style.display='none';
  var st=d.getElementById('tuner-override');
  if(!st){ st=d.createElement('style'); st.id='tuner-override'; d.body.appendChild(st); }
  else if(st!==d.body.lastElementChild){ d.body.appendChild(st); }
  var c=css(); if(st.textContent!==c) st.textContent=c;
  d.documentElement.style.setProperty('--sab',CUR.bottom+'px');
  var mpEl=d.getElementById('mini-player'); if(mpEl&&mpEl.getAttribute('data-marq')!==S.marq) mpEl.setAttribute('data-marq',S.marq);
  try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
}
/* ---- UI ---- */
function build(){
  var box=document.getElementById('groups');
  GROUPS.forEach(function(g,gi){
    var wrapG=document.createElement('div'); wrapG.className='grp'; wrapG.dataset.g='g'+gi; box.appendChild(wrapG);
    var h=document.createElement('h2'); h.textContent=g.title; wrapG.appendChild(h);
    g.items.forEach(function(it){
      var row=document.createElement('div'); row.className='row';
      var lab=document.createElement('label'); lab.textContent=it.label; row.appendChild(lab);
      if(it.type==='seg'){
        row.style.gridTemplateColumns='96px 1fr';
        var seg=document.createElement('div'); seg.className='seg';
        it.opts.forEach(function(o){ var b=document.createElement('button'); b.textContent=o[1]; b.dataset.v=o[0];
          b.onclick=function(){ S[it.k]=o[0]; [].forEach.call(seg.children,function(x){x.classList.toggle('on',x.dataset.v===o[0]);}); apply(); };
          if(o[0]===it.def) b.classList.add('on'); seg.appendChild(b); });
        row.appendChild(seg); it._seg=seg;
      } else {
        var inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=it.def;
        var v=document.createElement('div'); v.className='v'; v.textContent=it.def+it.u;
        inp.addEventListener('pointerdown',function(){ if(document.body.classList.contains('mobile')) document.getElementById('side').classList.add('peek'); });
        inp.oninput=function(){ S[it.k]=Number(inp.value); v.textContent=inp.value+it.u; v.classList.toggle('changed',S[it.k]!==it.def); apply(); };
        row.appendChild(inp); row.appendChild(v); it._inp=inp; it._v=v;
      }
      wrapG.appendChild(row);
    });
  });
  document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick=function(){ var d=doc(); if(!d) return; var n=d.querySelector('.navbtn[data-screen="'+b.dataset.s+'"]'); if(n) n.click(); }; });
}
function resetAll(){ each(function(it){ S[it.k]=it.def; if(it._inp){ it._inp.value=it.def; it._v.textContent=it.def+it.u; it._v.classList.remove('changed'); } if(it._seg){ [].forEach.call(it._seg.children,function(x){x.classList.toggle('on',x.dataset.v===it.def);}); } }); apply(); }
function appCall(a){ try{ var w=f.contentWindow, d=f.contentDocument;
  if(a==='queue'){ var p0=d.querySelector('.navbtn[data-screen="player"]'); if(p0) p0.click(); var qb=d.getElementById('cp-open-queue'); if(qb) qb.click(); return; }
  if(a==='cover'){ for(var k=0;k<3;k++){ if(!d.getElementById('screen-player').classList.contains('cp-immersive')) break; var cl=d.getElementById('cp-close'); if(cl) cl.click(); } return; }
  if(a==='album'){ var u=document.getElementById('src'); u.value=/album=classics/.test(u.value)?u.value.replace('album=classics','album=the-sky'):u.value.replace(/album=[^&]*/,'album=classics'); loadSrc(); return; }
  if(a==='play'){ var pb=d.getElementById('btn-play'); var p=d.querySelector('.navbtn[data-screen="player"]'); if(p) p.click(); if(pb) pb.click(); return; }
  if(w.__dock) w.__dock.set(a==='collapse'); }catch(e){} }
function copyCfg(){
  var lines=['【CHANCE 播放器 Tuner 設定】機型：'+CUR.name];
  GROUPS.forEach(function(g){ lines.push('— '+g.title); g.items.forEach(function(it){
    var val=it.type==='seg'?it.opts.filter(function(o){return o[0]===S[it.k];})[0][1]:S[it.k]+it.u;
    var dv=it.type==='seg'?it.opts.filter(function(o){return o[0]===it.def;})[0][1]:it.def+it.u;
    lines.push('  '+it.label+'：'+val+(S[it.k]!==it.def?'（B248T：'+dv+'）':'')); }); });
  if(S.nscale!==100||S.mscale!==100){ var X=V(); lines.push('— 套用比例後的實際尺寸'); lines.push('  nav：高 '+X.navh+'px、文字 '+X.nfs+'px、圖示 '+X.nico+'px'); lines.push('  音樂島：高 '+X.minih+'px、封面 '+X.cov+'px、歌名 '+X.mt+'px、副標 '+X.ms+'px、播放鍵 '+X.mp+'px'); }
  var t=lines.join('\n'); var ta=document.getElementById('out'); ta.value=t; ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(t).catch(function(){ document.execCommand('copy'); }); else document.execCommand('copy');
}
/* ---- 機型與縮放 ---- */
var CUR=DEVICES[0];
function setDevice(id){
  CUR=DEVICES.filter(function(d){return d.id===id;})[0]||DEVICES[0];
  var dev=document.getElementById('device'); dev.style.width=CUR.w+'px'; dev.style.height=CUR.h+'px';
  dev.style.borderRadius=(CUR.bottom?56:24)+'px';
  var isl=document.getElementById('island');
  if(CUR.bottom===0){ isl.style.display='none'; }
  else if(CUR.island){ isl.style.display='block'; isl.style.top='11px'; isl.style.width='124px'; isl.style.height='36px'; }
  else { isl.style.display='block'; isl.style.top='0'; isl.style.width='162px'; isl.style.height='32px'; isl.style.borderRadius='0 0 20px 20px'; }
  document.getElementById('statusbar').style.top=(CUR.island?18:14)+'px';
  document.getElementById('statusbar').style.display=CUR.bottom?'flex':'none';
  document.getElementById('home').style.display=CUR.bottom?'block':'none';
  fit(); apply();
}
function fit(){ if(document.body.classList.contains('mobile')) return; var wrap=document.getElementById('stageWrap'); var s=Math.min(1,(wrap.clientHeight-60)/CUR.h,(wrap.clientWidth-60)/CUR.w); document.getElementById('scaler').style.transform='scale('+s+')'; }
function loadSrc(){ f.src=document.getElementById('src').value.trim(); }
function reloadApp(){ var u=document.getElementById('src').value.trim(); f.src=u+(u.indexOf('?')>=0?'&':'?')+'t='+Date.now(); }
(function(){ var sel=document.getElementById('dev'); DEVICES.forEach(function(d){ var o=document.createElement('option'); o.value=d.id; o.textContent=d.name; sel.appendChild(o); }); sel.onchange=function(){ setDevice(sel.value); }; })();
f.addEventListener('load',function(){ apply(); setTimeout(apply,600); setTimeout(apply,1600); });
window.addEventListener('resize',fit);
/* ---- 手機模式 ---- */
var MOBILE=window.matchMedia('(max-width:700px)').matches;
function safeBottom(){ var t=document.createElement('div'); t.style.cssText='position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px)'; document.body.appendChild(t); var v=parseFloat(getComputedStyle(t).paddingBottom)||0; t.remove(); return v; }
var TABS=[['g0','PLAY'],['g1','照片'],['g2','NAV'],['g3','島'],['g4','清單'],['g5','Unlock'],['app','分頁'],['out','輸出']];
function showTab(k){ document.querySelectorAll('.grp').forEach(function(g){ g.classList.toggle('on',g.dataset.g===k); }); document.querySelectorAll('#mtabs button').forEach(function(b){ b.classList.toggle('on',b.dataset.k===k); }); }
function togglePos(){ var bt=document.body.classList.toggle('bottom'); document.getElementById('mPos').textContent=bt?'移到上方':'移到下方'; }
function toggleClose(){ var c=document.getElementById('side').classList.toggle('closed'); document.getElementById('mClose').textContent=c?'展開':'收起'; }
document.addEventListener('pointerup',function(){ document.getElementById('side').classList.remove('peek'); },true);
document.addEventListener('pointercancel',function(){ document.getElementById('side').classList.remove('peek'); },true);
build();
if(MOBILE){
  document.body.classList.add('mobile');
  var tb=document.getElementById('mtabs'); TABS.forEach(function(t){ var b=document.createElement('button'); b.textContent=t[1]; b.dataset.k=t[0]; b.onclick=function(){ showTab(t[0]); }; tb.appendChild(b); });
  showTab('g0');
  CUR={id:'device',name:'本機 '+window.innerWidth+'×'+window.innerHeight,w:window.innerWidth,h:window.innerHeight,top:0,bottom:safeBottom(),island:false};
  apply();
} else {
  document.querySelectorAll('.grp').forEach(function(g){ g.classList.add('on'); });
  setDevice(DEVICES[0].id);
}
loadSrc();
setInterval(apply,1000);   /* 只在預覽工具裡用：App 重繪後補回覆寫（不影響 App 本身） */
</script>
</body></html>
