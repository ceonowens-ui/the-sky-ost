<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}</style>
<title>購票按鈕調整台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@500&display=swap">
<style>
/* 版面：手機上預覽用真實 px、滑桿緊貼在下面；電腦上四頁並排同步變 */
:root{color-scheme:dark;--bg:#16141a;--panel:#201d24;--line:#3a3640;--fg:#f1ebdf;--soft:#b5ada3;--gold:#dab77f;--ink:#201c17;--btn:#171416;--btn-fg:#f5efe3;--btn-line:#756c62;--warn:#e8a38f;--sans:"Noto Sans TC","PingFang TC",sans-serif;--serif:"Noto Serif TC","Songti TC",serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;max-width:1720px;margin:0 auto;align-items:start}
.panel{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
h1{margin:0;font:500 22px/1.3 var(--serif);text-wrap:balance}
.row{display:grid;gap:2px}
.row label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600}
.row output{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--gold);touch-action:pan-y}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{flex:1 1 auto;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:600 14px var(--sans);cursor:pointer}
.acts button.main{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.sum{margin:0;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums;user-select:text}
.sum.tight{color:var(--warn)}
.tabs{display:none;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:40px;padding:0 4px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--soft);font:600 14px var(--sans)}
.tabs button[aria-selected=true]{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.screens{display:flex;gap:16px;justify-content:center;min-width:0}
.scr{min-width:0}
.cap{margin:0 0 8px;color:var(--soft);font-weight:600}
.win{position:relative;overflow:hidden;border-radius:18px;background:#0b090d}
.inner{position:absolute;left:50%;top:0;width:390px;height:844px;transform-origin:top center}
.inner img{display:block;width:390px;height:844px;max-width:none}
.cta{position:absolute;left:50%;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden;white-space:nowrap;margin:0;padding:0 18px;border:1px solid var(--btn-line);background:var(--btn);color:var(--btn-fg);font-family:var(--sans);font-weight:600;line-height:1.2;transform:translateX(-50%) scale(1);transition:transform 120ms ease-out;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cta small{display:flex;align-items:center;align-self:stretch;flex:none;margin:0 -18px 0 0;padding:0 12px;background:var(--gold);color:var(--ink);font:inherit}
.cta.is-press,.cta:active{transform:translateX(-50%) scale(.97)}
@media (prefers-reduced-motion:reduce){.cta{transition:none}.cta.is-press,.cta:active{transform:translateX(-50%)}}
@media (max-width:759px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px}
  .stage{order:1;min-width:0}.panel{order:2;position:static;padding:12px 14px;gap:6px}
  h1{display:none}
  .tabs{display:flex}
  .screens{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .win{border-radius:0}
  .scr{display:none;width:100%}.scr.on{display:block}.cap{display:none}
}
</style>
<div class="wrap">
  <div class="panel" id="panel">
    <h1>購票按鈕調整台</h1>
    <div class="row"><label for="w">寬度<output id="wo"></output></label><input id="w" type="range" min="280" max="358" step="1"></div>
    <div class="row"><label for="h">高度<output id="ho"></output></label><input id="h" type="range" min="40" max="64" step="1"></div>
    <div class="row"><label for="f">字大小<output id="fo"></output></label><input id="f" type="range" min="13" max="20" step="0.5"></div>
    <div class="row"><label for="r">圓角<output id="ro"></output></label><input id="r" type="range" min="0" max="32" step="1"></div>
    <p class="sum" id="sum"></p>
    <div class="acts"><button class="main" id="copy" type="button">複製這組數字</button><button id="reset" type="button">回到線上版</button></div>
  </div>
  <div class="stage">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-i="0" aria-selected="false">SHOP</button>
      <button type="button" role="tab" data-i="1" aria-selected="true">封面</button>
      <button type="button" role="tab" data-i="2" aria-selected="false">選位</button>
      <button type="button" role="tab" data-i="3" aria-selected="false">付款</button>
    </div>
    <div class="screens" id="screens"></div>
  </div>
</div>
