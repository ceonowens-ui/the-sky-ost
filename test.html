<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- iPhone 鐵則：viewport-fit=cover 必須有，安全區才會生效 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PWA / iPhone 加入主畫面 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 最終解法：不設 status-bar-style（black-translucent 就是底部黑 bar 元兇），
     iOS 會用 theme-color 填滿頂/底安全區 -->
<!-- theme-color 由 app.js 依 ALBUM_CONFIG.theme.themeColor 覆寫 -->
<meta name="theme-color" content="#0B0709">
<!-- 標題與 icon 由 app.js 從 config 填入 -->
<title>Album App</title>
<link id="apple-touch-icon" rel="apple-touch-icon" href="assets/images/cover.png">

<!-- 字體（想換字體就改這行 + styles.css 的 --font-* 變數） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
 * ALBUM APP TEMPLATE — styles.css
 * =====================================================================
 * 不含專輯專屬資料。所有顏色透過 CSS 變數（由 app.js 從
 * ALBUM_CONFIG.theme 注入），換專輯不需要改這個檔案。
 *
 * iPhone 鐵則（來自實測，違反任何一條 iPhone Safari 就會壞）：
 *   1. 每個 backdrop-filter 都「同時」有 -webkit-backdrop-filter
 *   2. 安全區：env(safe-area-inset-top / bottom)
 *   3. 高度：100vh 後面補 100dvh
 *   4. viewport meta 必須有 viewport-fit=cover（在 index.html）
 * ===================================================================== */

:root {
  /* 預設值 = Secret Lover 主題；app.js 會用 ALBUM_CONFIG.theme 覆寫 */
  --bg: #0B0709;
  --bg-top: #2A0E13;
  --surface: rgba(32, 14, 16, .55);
  --primary: #E9C46A;
  --secondary: #C4303A;
  --accent: #E0A94E;
  --text: #ffffff;
  --muted: rgba(255, 255, 255, .62);
  /* app.js 會把 primary 換算成 r,g,b 填進來，供 rgba() 使用 */
  --primary-rgb: 233, 196, 106;
  --grad: linear-gradient(135deg, var(--primary), var(--secondary) 52%, var(--accent));
  --font-display: 'Playfair Display', serif;   /* 英文斜體大標 */
  --font-label: 'Bodoni Moda', serif;          /* 小型全大寫 label / 數字 */
  --font-serif-tc: 'Noto Serif TC', serif;     /* 中文標題 */
  --font-sans-tc: 'Noto Sans TC', sans-serif;  /* 中文內文 */

  /* ── PWA 版面微調（iphone-frame-live-tuner 合約，見 PLAYER_CSS_CONTRACT）──
     fallback = 現值：不套 tuner 時外觀完全不變；tuner「複製設定」後貼回覆蓋這幾行 ── */
  --pv-cover-top: -1px;      /* 封面上距（tuner 定稿 2026-08-15） */
  --pv-card-overlap: 52px;   /* Now Playing 卡往上疊住封面多少 */
  --pv-nav-bottom: 12px;     /* nav 島下緣（安全區之外再留） */
  --pv-nav-shift-y: -25px;   /* nav 島額外垂直位移（可負→蓋進安全區） */
  --pv-nav-opacity: 1;       /* nav 島透明度 0~1 */
  --pv-nav-scale: 1;         /* nav 島整體大小（縮放，1=原大小） */
  --pv-nav-font: 9px;        /* nav 島文字大小 */
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100vh;
  height: 100dvh; /* iPhone：dvh 蓋掉 vh */
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none; /* 擋掉 iOS 橡皮筋露出底色 */
  background: var(--bg);     /* 與 theme-color 完全一致 */
  color: var(--text);
  font-family: var(--font-sans-tc);
  -webkit-font-smoothing: antialiased;
}

/* ---- 舞台：手機滿版；桌機置中成手機比例 --------------------------- */
#stage {
  position: fixed; inset: 0;   /* PWA 配方：不用 vh/dvh，fixed+inset 永遠貼齊真實四邊，standalone 不露異色縫 */
  height: auto;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
  background: var(--bg);
}
/* 配方：standalone 下讓畫布吃滿真實可視高度 */
@media (display-mode: standalone) { html, body { min-height: 100lvh; } }
@media (min-width: 520px) {
  body { display: flex; align-items: center; justify-content: center;
         background: radial-gradient(130% 100% at 50% -5%, var(--bg-top), #060409 60%); }
  #stage { position: relative; inset: auto; width: 416px; height: min(870px, 96vh); border-radius: 44px;
           box-shadow: 0 44px 90px rgba(0,0,0,.6), 0 0 0 12px #1A0D0E, 0 0 0 13px rgba(255,255,255,.07); }
}

/* ---- 分頁 screen ---------------------------------------------------- */
.screen { position: absolute; inset: 0; display: none; overflow-y: auto;
          -webkit-overflow-scrolling: touch; }
.screen.active { display: block; }
.screen-sub { background: radial-gradient(120% 60% at 50% 0%, var(--bg-top), var(--bg) 70%);
              padding: 62px 0 calc(96px + env(safe-area-inset-bottom)); }

/* =====================================================================
 * PLAYER
 * =================================================================== */
#screen-player { background: var(--bg); }
.player-fold { height: 100%; min-height: 520px; display: flex; flex-direction: column; }

/* 專輯切換：改成封面底部的圓點指示器（可點也可滑），不再用文字膠囊
   —— 原本的文字膠囊會跟封面大標重疊，且沒有暗示「可以滑」 */
/* 位置：封面卡內部下緣，np-card 會往上疊 52px，所以再往上留 62px 才不會被蓋住 */
#album-switch { position: absolute; z-index: 6;
                bottom: calc(var(--pv-card-overlap, 52px) + 12px); left: 50%; transform: translateX(-50%);
                display: flex; align-items: center; gap: 7px;
                padding: 6px 10px; border-radius: 20px;
                background: rgba(10,10,14,.34);
                backdrop-filter: blur(18px) saturate(1.4);
                -webkit-backdrop-filter: blur(18px) saturate(1.4); /* iPhone 必要 */
                border: 1px solid rgba(255,255,255,.12); }
.album-dot { width: 7px; height: 7px; border-radius: 50%; border: none; padding: 0;
             cursor: pointer; background: rgba(255,255,255,.34);
             transition: background .25s ease, width .25s ease; }
.album-dot.active { width: 20px; border-radius: 4px; background: var(--primary);
                    box-shadow: 0 0 8px rgba(var(--primary-rgb), .7); }
/* 首次進入時提示可滑動，3 秒後淡出 */
/* BUG FIX：分頁島隱藏時（player-only 專輯），把為它預留的底部空白收掉，
   不然畫面下方會有一大塊莫名的空白 */
/* player-only 專輯(BEFORE THE SKY)封面比例對齊 THE SKY：底部保留同樣空間，封面高度一致 */
body.no-nav .np-card { margin-bottom: calc(86px + env(safe-area-inset-bottom)); }
body.no-nav .screen-sub { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
body.no-nav .tracklist-block { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
body.no-nav #toast { bottom: calc(34px + env(safe-area-inset-bottom)); }

.swipe-hint { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
              bottom: 88px; white-space: nowrap;
              font-family: var(--font-label); font-size: 9px; letter-spacing: 2px;
              color: rgba(255,255,255,.55); text-transform: uppercase;
              text-shadow: 0 1px 6px rgba(0,0,0,.7);
              animation: hintFade 4s ease forwards; pointer-events: none; }
@keyframes hintFade { 0%,12% { opacity: 0; } 30%,62% { opacity: 1; } 100% { opacity: 0; } }

/* 封面：滿版 hero（比例圖版型）——貼頂進 status bar 後方、左右貼邊、無圓角無框
   --pv-cover-top 保留給 tuner 微調（預設 0 = 滿版貼頂） */
.cover-card {
  position: relative; flex: 1; min-height: 240px; overflow: hidden;
  margin: var(--pv-cover-top, 0px) 0 0;
  border-radius: 0;
  box-shadow: none;
}
.cover-card img, .cover-card video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 42%;
  transform-origin: center 45%;
  animation: breathe 7s ease-in-out infinite;
  animation-play-state: paused; /* 播放時 app.js 切成 running（呼吸動畫） */
}
.cover-card.playing img, .cover-card.playing video { animation-play-state: running; }
/* 有設定 coverVideo 時，影片顯示、圖片當作影片載入前的 poster 用途隱藏 */
.cover-card video { display: none; }
.cover-card.has-video video { display: block; z-index: 1; }
/* 保留 img 當底層封面：影片還沒載入或載入失敗時，靜態封面照樣顯示（修「封面圖不見」）*/
.cover-shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.33) 7%,
              transparent 15%, transparent 78%, rgba(0,0,0,.3) 91%, rgba(0,0,0,.51) 100%);
}
.cover-titles { display: none; position: absolute; top: 0; left: 0; right: 0; padding: 14px 24px 0;
                text-align: center; z-index: 2; }
.cover-eyebrow { font-family: var(--font-label); font-weight: 500; font-size: 9px;
                 letter-spacing: 4.5px; color: rgba(255,255,255,.85);
                 text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.cover-title-en { font-family: var(--font-display); font-style: italic; font-weight: 600;
                  font-size: 28px; letter-spacing: .5px; line-height: 1; margin-top: 5px;
                  text-shadow: 0 3px 20px rgba(0,0,0,.6); }

/* Now Playing：毛玻璃卡片，往上疊在封面（DESIGN LOCK） */
.np-card {
  position: relative; z-index: 3;
  margin: calc(-1 * var(--pv-card-overlap, 52px)) 12px calc(86px + env(safe-area-inset-bottom));
  padding: 12px 18px 4px;
  background: var(--surface);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px); /* iPhone 必要 */
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.np-head { display: flex; justify-content: space-between; align-items: flex-start; }
.np-label { font-family: var(--font-label); font-size: 9px; letter-spacing: 4px;
            color: var(--primary); text-transform: uppercase; }
.np-title { font-family: var(--font-serif-tc); font-size: 22px; font-weight: 600;
            margin-top: 3px; letter-spacing: 1.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-sub { font-family: var(--font-display); font-style: italic; font-size: 13px;
          color: rgba(255,255,255,.7); margin-top: 4px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-actions { display: flex; gap: 8px; margin-left: 12px; flex: none; }
.icon-round {
  position: relative; width: 44px; height: 44px; border-radius: 50%;
  background: rgba(var(--primary-rgb), .12); border: 1px solid rgba(var(--primary-rgb), .45);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--primary);
}
.icon-round:active { transform: scale(.92); }
.icon-round.liked svg { animation: bounce .5s ease; }

/* 進度條 */
.prog { position: relative; height: 4px; border-radius: 4px;
        background: rgba(255,255,255,.18); cursor: pointer; margin-top: 12px;
        touch-action: none; }
.prog-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px;
             width: 0%; background: var(--grad); }
.prog-glow { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
             width: 32px; height: 32px; border-radius: 50%;
             background: rgba(var(--primary-rgb), .9); filter: blur(7px); opacity: .34;
             pointer-events: none; }
.prog-glow.pulsing { animation: dotPulse 2.4s ease-in-out infinite; }
.prog-dot { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
            width: 26px; height: 26px; border-radius: 50%; z-index: 1;
            background: var(--grad); border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-serif-tc); font-size: 12px; font-weight: 600; color: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.4), 0 0 12px rgba(var(--primary-rgb), .9); }
.prog-dot:empty { width: 14px; height: 14px; } /* 沒設定角色標籤時退回小圓點 */
.np-times { display: flex; justify-content: space-between; margin-top: 9px;
            font-family: var(--font-label); font-size: 11px; letter-spacing: 1px;
            color: rgba(255,255,255,.55); }

/* 控制鍵 */
.np-controls { display: flex; align-items: center; justify-content: center;
               gap: 28px; margin-top: 2px; }
.btn-ghost { background: none; border: none; cursor: pointer; padding: 6px;
             color: rgba(255,255,255,.85); }
.btn-ghost:active { transform: scale(.9); }
.btn-play {
  width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(120,90,160,.45),
              inset 0 1px 10px rgba(var(--primary-rgb), .55),
              inset 0 0 0 1px rgba(255,255,255,.55);
}
.btn-play:active { transform: scale(.94); }
.btn-play svg { fill: #2A0B0B; }

/* Next Scene（打開 Bottom Sheet） */
.np-next { display: flex; align-items: center; justify-content: space-between;
           border-top: 1px solid rgba(255,255,255,.10); margin-top: 6px;
           padding: 6px 2px 2px; cursor: pointer; }
.np-next span { font-family: var(--font-label); font-size: 10px; letter-spacing: 3px;
                color: rgba(255,255,255,.6); text-transform: uppercase; }

/* 曲目列表（fold 之下） */
.tracklist-block { background: var(--bg);
                   /* 依照《播放器設計系統－完整規格》：版面結構圖裡 NP 卡下面
                      直接就是浮動 nav，曲目清單是靠 Next Scene 打開 Bottom Sheet
                      看，不是在主畫面用負 margin 「偷跑」出來。這裡不做任何負值
                      上拉，避免跟 nav 佔用的區域打架。 */
                   margin-top: 0;
                   padding: 18px 16px calc(120px + env(safe-area-inset-bottom)); }
.tracklist-caption { font-family: var(--font-label); font-size: 10px; letter-spacing: 3px;
                     color: rgba(255,255,255,.5); text-transform: uppercase; padding: 0 12px 8px; }
.track-row { display: flex; align-items: center; gap: 13px; padding: 10px 12px;
             border-radius: 14px; cursor: pointer; }
.track-row:active { background: rgba(255,255,255,.05); }
.track-row.current { background: rgba(var(--primary-rgb), .10); }
.track-row.revealing { animation: reveal .5s ease both; }
.track-num { font-family: var(--font-label); font-size: 13px; width: 24px;
             text-align: center; color: #9a93a8; flex: none; }
.track-name { flex: 1; min-width: 0; font-family: var(--font-serif-tc); font-size: 16px;
              color: rgba(255,255,255,.82);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-row.current .track-num { color: var(--primary); }
.track-row.current .track-name { color: #fff; }
.track-row.locked .track-num { color: #5f5870; }
.track-row.locked .track-name { color: #7a7388; font-style: italic; letter-spacing: 1px; }
.track-dl { display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; flex: none; border: none; border-radius: 10px;
            background: rgba(var(--primary-rgb), .12); cursor: pointer; color: var(--primary); }

/* =====================================================================
 * BOTTOM SHEET（曲目表：可滑動、iOS 拖曳把手關閉）
 * =================================================================== */
#sheet-backdrop { position: absolute; inset: 0; z-index: 60;
                  background: rgba(8,6,12,.55); animation: fadeIn .25s ease; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 61; height: 84%;
  background: linear-gradient(180deg, var(--bg-top), var(--bg));
  border-radius: 26px 26px 0 0;
  border-top: 1px solid rgba(255,255,255,.12);
  display: flex; flex-direction: column;
  animation: slideUp .32s cubic-bezier(.22,.9,.3,1);
  touch-action: none; /* 拖曳關閉時避免頁面捲動打架 */
  will-change: transform;
}
#sheet.dragging { animation: none; transition: none; }
#sheet.snapping { transition: transform .28s cubic-bezier(.22,.9,.3,1); }
.sheet-grabber { width: 44px; height: 5px; border-radius: 3px;
                 background: rgba(255,255,255,.28); margin: 10px auto 0; flex: none; }
.sheet-head { padding: 8px 24px; display: flex; align-items: center;
              justify-content: space-between; flex: none; }
.sheet-eyebrow { font-family: var(--font-label); font-size: 10px; letter-spacing: 4px;
                 color: var(--primary); text-transform: uppercase; }
.sheet-title { font-family: var(--font-serif-tc); font-size: 15px; margin-top: 4px;
               letter-spacing: 2px; }
.sheet-close { width: 34px; height: 34px; border-radius: 50%;
               background: rgba(255,255,255,.08); border: none; color: #fff;
               cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sheet-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
              padding: 6px 14px calc(30px + env(safe-area-inset-bottom));
              touch-action: pan-y; }
.sheet-list .track-row { padding: 13px 14px; }

/* =====================================================================
 * LYRICS OVERLAY
 * =================================================================== */
#lyrics-overlay { position: absolute; inset: 0; z-index: 65;
                  background: rgba(10,7,14,.92);
                  backdrop-filter: blur(18px);
                  -webkit-backdrop-filter: blur(18px);
                  display: flex; flex-direction: column; animation: fadeIn .25s ease; }
.lyrics-head { flex: none; padding: calc(20px + env(safe-area-inset-top)) 24px 10px;
               display: flex; align-items: flex-start; justify-content: space-between; }
.lyrics-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
               padding: 8px 30px calc(60px + env(safe-area-inset-bottom));
               font-family: var(--font-serif-tc); font-size: 16px; line-height: 2.2;
               color: rgba(255,255,255,.86); white-space: pre-wrap; text-align: center;
               letter-spacing: 1px; }
/* 歌詞第一行＝歌名，放大；其餘歌詞維持中等字級 */
.lyrics-song-title { font-family: var(--font-display); font-style: italic; font-weight: 600;
                     font-size: 30px; line-height: 1.25; letter-spacing: 1px;
                     color: #fff; text-align: center; margin: 2px 0 22px;
                     white-space: pre-wrap; }
.lyrics-text { font-size: 16px; line-height: 2.2; white-space: pre-wrap; }
/* 製作名單（詞曲/製作人那幾行）自動縮小，不搶歌詞 */
.lyrics-credits { margin-top: 26px; padding-top: 18px;
                  border-top: 1px solid rgba(255,255,255,.12);
                  font-family: var(--font-sans-tc); font-size: 11.5px; line-height: 1.95;
                  color: rgba(255,255,255,.5); letter-spacing: .5px; white-space: pre-wrap; }
.lyrics-empty { color: var(--muted); font-size: 13px; padding-top: 60px; text-align: center; }

/* =====================================================================
 * PURCHASE（付費解鎖頁）
 * =================================================================== */
.page-titles { text-align: center; padding: 0 28px; }
.page-title-en { font-family: var(--font-display); font-style: italic; font-size: 27px; }
.page-title-tc { font-family: var(--font-serif-tc); font-size: 16px;
                 color: rgba(255,255,255,.85); letter-spacing: 2px; margin-top: 8px; }
.page-note { font-size: 12.5px; color: rgba(255,255,255,.5); margin-top: 12px; line-height: 1.75; }

.plans { padding: 28px 22px 0; display: flex; flex-direction: column; gap: 18px; }
.plan { position: relative; border-radius: 22px; padding: 24px 22px; cursor: pointer;
        background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.12); }
.plan.deluxe { background: rgba(var(--primary-rgb), .07);
               border-color: rgba(var(--primary-rgb), .45); }
.plan.selected { border-color: var(--primary); }
.plan-badge { position: absolute; top: -11px; right: 18px; background: var(--grad);
              color: #fff; font-family: var(--font-label); font-size: 10px;
              padding: 5px 12px; border-radius: 20px; letter-spacing: 2px; }
.plan-name { font-family: var(--font-serif-tc); font-size: 15px; letter-spacing: 1px; }
.plan-price { font-family: var(--font-label); font-size: 30px; font-weight: 700; margin-top: 4px; }
.plan-features { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan-feature { display: flex; gap: 9px; font-size: 12.5px; color: rgba(255,255,255,.7);
                align-items: center; }
.plan-feature svg { flex: none; stroke: var(--primary); }

.cta-block { padding: 18px 24px 0; }
.btn-primary { display: block; width: 100%; text-align: center; padding: 15px;
               border-radius: 16px; background: var(--grad); color: #fff; border: none;
               font-family: var(--font-serif-tc); font-size: 14px; letter-spacing: 2px;
               cursor: pointer; font-weight: 600; }
.btn-primary:active { transform: scale(.98); }
.btn-outline { display: block; width: 100%; text-align: center; padding: 14px;
               margin-top: 11px; border-radius: 16px; background: none; color: var(--primary);
               border: 1.5px solid rgba(var(--primary-rgb), .5);
               font-family: var(--font-serif-tc); font-size: 13px; letter-spacing: 2px;
               cursor: pointer; }

/* =====================================================================
 * UNLOCK（兌換頁）
 * =================================================================== */
.unlock-lock-badge { width: 62px; height: 62px; border-radius: 50%;
                     background: rgba(var(--primary-rgb), .14);
                     border: 1px solid rgba(var(--primary-rgb), .4);
                     display: flex; align-items: center; justify-content: center;
                     margin: 0 auto 16px; color: var(--primary); }
.form-block { padding: 22px 28px 0; }
.form-label { font-family: var(--font-label); font-size: 11px; font-weight: 600;
              color: rgba(255,255,255,.5); letter-spacing: 3px; }
.form-input { width: 100%; margin: 9px 0 18px; padding: 15px; border-radius: 16px;
              border: 1.5px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05);
              font-size: 14px; color: #fff; outline: none; font-family: var(--font-serif-tc); }
.form-input:focus { border-color: rgba(var(--primary-rgb), .6); }
.form-hint { text-align: center; font-size: 12px; color: rgba(255,255,255,.5); margin-top: 22px;
             cursor: pointer; }
.form-hint b { color: var(--primary); font-weight: 500; }

.unlocked-card { border-radius: 22px; background: rgba(var(--primary-rgb), .08);
                 border: 1px solid rgba(var(--primary-rgb), .3);
                 padding: 28px 22px; text-align: center; margin: 26px 24px 0; }
.unlocked-check { width: 58px; height: 58px; border-radius: 50%; background: var(--grad);
                  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.unlocked-eyebrow { font-family: var(--font-label); font-size: 11px; color: var(--primary);
                    letter-spacing: 3px; }
.unlocked-title { font-family: var(--font-serif-tc); font-size: 17px; margin-top: 8px;
                  letter-spacing: 1px; }
.unlocked-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center;
                    flex-wrap: wrap; }
.btn-chip { display: flex; align-items: center; gap: 7px; padding: 13px 22px;
            border-radius: 14px; background: rgba(255,255,255,.08); color: #fff;
            border: 1px solid rgba(255,255,255,.16); font-family: var(--font-serif-tc);
            font-size: 13px; letter-spacing: 1.5px; cursor: pointer; text-decoration: none; }
.btn-chip.grad { background: var(--grad); border: none; }
.unlocked-note { font-size: 11px; color: rgba(255,255,255,.38); margin-top: 13px;
                 letter-spacing: .5px; }
.unlocked-reset { font-size: 11px; color: rgba(255,255,255,.28); margin-top: 16px;
                  letter-spacing: .5px; cursor: pointer; text-decoration: underline;
                  text-underline-offset: 3px; }

/* =====================================================================
 * MOOD WALL（粉絲心情牆）
 * =================================================================== */
.mood-count { text-align: center; font-size: 12px; color: rgba(255,255,255,.5);
              letter-spacing: .5px; padding: 18px 28px 4px; }
.mood-count b { color: var(--primary); font-weight: 600; font-family: var(--font-label); }
.mood-form { margin: 10px 20px 0; padding: 18px 17px; border-radius: 22px;
             background: rgba(255,255,255,.05);
             backdrop-filter: blur(10px);
             -webkit-backdrop-filter: blur(10px);
             border: 1px solid rgba(var(--primary-rgb), .22);
             box-shadow: 0 12px 30px rgba(0,0,0,.3); }
.mood-form .form-input { margin: 0; padding: 12px 14px; border-radius: 14px; font-size: 13.5px; }
.mood-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.mood-tag { padding: 7px 14px; border-radius: 20px; font-size: 12px;
            font-family: var(--font-serif-tc); cursor: pointer;
            background: rgba(255,255,255,.05); color: rgba(255,255,255,.6);
            border: 1px solid rgba(255,255,255,.16); }
.mood-tag.selected { background: var(--grad); color: #fff; border-color: transparent;
                     box-shadow: 0 5px 14px rgba(var(--primary-rgb), .3); }
.mood-textarea { width: 100%; min-height: 74px; resize: none; margin-top: 12px;
                 padding: 13px 15px; border-radius: 14px;
                 border: 1.5px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05);
                 font-size: 13.5px; line-height: 1.6; color: #fff; outline: none;
                 font-family: var(--font-serif-tc); }
.mood-chars { text-align: right; font-family: var(--font-label); font-size: 11px;
              color: rgba(255,255,255,.4); margin-top: 6px; }
.mood-err { color: var(--primary); font-size: 11.5px; text-align: center; margin-top: 4px; }
.mood-submit { margin-top: 10px; border-radius: 22px; }
.mood-notes { padding: 20px 20px 0; }
.mood-note { background: rgba(255,255,255,.04);
             backdrop-filter: blur(8px);
             -webkit-backdrop-filter: blur(8px);
             border: 1px solid rgba(255,255,255,.08); border-radius: 18px;
             padding: 15px 17px; margin-bottom: 12px; }
.mood-note.new { animation: reveal .5s ease both; }
.mood-note-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.mood-note-name { font-family: var(--font-serif-tc); font-size: 13px; font-weight: 600;
                  color: #F0E2C6; }
.mood-note-tag { font-size: 10.5px; color: var(--primary);
                 background: rgba(var(--primary-rgb), .14); padding: 3px 10px;
                 border-radius: 14px; letter-spacing: .5px; white-space: nowrap; }
.mood-note-text { font-family: var(--font-serif-tc); font-size: 13.5px; line-height: 1.7;
                  color: rgba(255,255,255,.85); }
.mood-note-time { font-family: var(--font-label); font-size: 10.5px;
                  color: rgba(255,255,255,.35); margin-top: 9px; letter-spacing: .5px; }

/* =====================================================================
 * GALLERY（寫真牆：橫向滑動相簿，scroll-snap 一次一張）
 * =================================================================== */
.gallery-scroll {
  display: flex; gap: 14px; margin-top: 22px; padding: 4px 28px 8px;
  overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.gallery-scroll::-webkit-scrollbar { display: none; }
.gallery-slide {
  position: relative; flex: 0 0 78%; scroll-snap-align: center;
  aspect-ratio: 3 / 4.4; border-radius: 24px; overflow: hidden;
  box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35),
              0 0 0 1px rgba(255,255,255,.06);
}
.gallery-slide img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 30%;
}
.gallery-slide .gallery-shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.55) 100%);
}
.gallery-slide .gallery-caption {
  position: absolute; left: 16px; right: 16px; bottom: 14px;
  font-family: var(--font-serif-tc); font-size: 12.5px; letter-spacing: .5px;
  color: rgba(255,255,255,.9);
}
.gallery-dots { display: flex; justify-content: center; gap: 7px; margin-top: 16px; }
.gallery-dot { width: 6px; height: 6px; border-radius: 50%;
               background: rgba(255,255,255,.25); transition: background .25s ease, transform .25s ease; }
.gallery-dot.active { background: var(--primary); transform: scale(1.3); }

/* =====================================================================
 * FLOATING ISLAND BOTTOM NAV（DESIGN LOCK：浮動島狀 pill）
 * =================================================================== */
#nav-wrap { position: absolute; left: 0; right: 0;
            bottom: calc(var(--sab, env(safe-area-inset-bottom)) + var(--pv-nav-bottom, 12px) + var(--pv-nav-shift-y, 0px)); /* 避開 home indicator，可用 tuner 調 */
            z-index: 70; display: flex; justify-content: center; pointer-events: none; }
#nav { position: relative; display: flex; padding: 6px; border-radius: 30px; opacity: var(--pv-nav-opacity, 1);
       transform: scale(var(--pv-nav-scale, 1)); transform-origin: bottom center;
       background: rgba(18,18,22,.16);
       backdrop-filter: blur(44px) saturate(1.7);
       -webkit-backdrop-filter: blur(44px) saturate(1.7); /* iPhone 必要 */
       border: 1px solid rgba(255,255,255,.1);
       box-shadow: 0 16px 42px rgba(0,0,0,.44), 0 2px 8px rgba(0,0,0,.26),
                   inset 0 1px 0 rgba(255,255,255,.32), inset 0 -8px 16px rgba(255,255,255,.05);
       pointer-events: auto; }
#nav::before { content: ""; position: absolute; inset: 0; border-radius: 30px;
               background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 42%);
               pointer-events: none; }
#nav-ind { position: absolute; top: 6px; left: 6px; width: 64px;
           height: calc(100% - 12px); border-radius: 21px;
           transform: translateX(0);
           transition: transform .46s cubic-bezier(.34,1.32,.42,1);
           background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(var(--primary-rgb), .12));
           box-shadow: inset 0 1px 0 rgba(255,255,255,.45),
                       inset 0 0 12px rgba(var(--primary-rgb), .18),
                       inset 0 -6px 12px rgba(255,255,255,.06), 0 4px 12px rgba(0,0,0,.16);
           backdrop-filter: blur(6px);
           -webkit-backdrop-filter: blur(6px);
           pointer-events: none; }
.navbtn { position: relative; z-index: 1; width: 64px; padding: 7px 0 6px;
          border: none; background: none; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 3px;
          font-family: var(--font-serif-tc); font-size: var(--pv-nav-font, 9px); letter-spacing: 1.2px;
          color: #8f8a9c; transition: color .3s ease, transform .18s ease; }
.navbtn:active { transform: scale(.92); }
.navbtn .navico { display: flex; transition: filter .35s ease; }
.navbtn .navlbl { opacity: .62; transition: opacity .3s ease; }
.navbtn.active { color: #E9C46A; }
.navbtn.active .navico { filter: drop-shadow(0 0 7px rgba(var(--primary-rgb), .6)); }
.navbtn.active .navlbl { opacity: 1; }
.navbtn.pop .navico { animation: tabPop .26s cubic-bezier(.34,1.3,.4,1); }

/* =====================================================================
 * TOAST / 動畫特效
 * =================================================================== */
#toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
         z-index: 100; transform: translateX(-50%);
         background: rgba(20,15,26,.96); border: 1px solid rgba(var(--primary-rgb), .4);
         color: #fff; padding: 10px 20px; border-radius: 22px; font-size: 12.5px;
         font-family: var(--font-serif-tc); white-space: nowrap; max-width: 84%;
         overflow: hidden; text-overflow: ellipsis; text-align: center;
         box-shadow: 0 8px 24px rgba(0,0,0,.5);
         opacity: 0; pointer-events: none; transition: opacity .25s ease; }
#toast.show { opacity: 1; }

#fx-layer { position: absolute; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.fx-heart { position: absolute; }
.fx-glow { position: absolute; width: 150px; height: 150px; border-radius: 50%;
           background: radial-gradient(circle, rgba(var(--primary-rgb), .55),
                       rgba(var(--primary-rgb), .22) 55%, transparent 72%);
           transform: translate(-50%, -50%); animation: glowFade 1.1s ease-out both; }
.fx-ring { position: absolute; width: 64px; height: 64px; border-radius: 50%;
           border: 1.5px solid rgba(var(--primary-rgb), .8);
           transform: translate(-50%, -50%);
           animation: ringPulse .9s cubic-bezier(.2,.7,.3,1) both; }
.fx-bloom { position: absolute; transform: translate(-50%, -50%);
            filter: drop-shadow(0 4px 14px rgba(var(--primary-rgb), .6));
            animation: bloomHeart 1s cubic-bezier(.3,1.3,.5,1) both; }
#unlock-fx { position: absolute; inset: 0; z-index: 90; pointer-events: none;
             background: radial-gradient(60% 50% at 50% 45%,
                         rgba(var(--primary-rgb), .55), rgba(var(--primary-rgb), .3) 45%,
                         transparent 72%);
             animation: burstGlow 1.8s ease-out forwards; }
#unlock-fx .fx-ring2 { position: absolute; left: 50%; top: 42%;
                       transform: translate(-50%, -50%); width: 120px; height: 120px;
                       border-radius: 50%; border: 2px solid rgba(var(--primary-rgb), .7);
                       animation: ring 1.4s ease-out forwards; }
.fx-float { position: absolute; bottom: 35%; animation: floatUp 1.2s ease-out both; }

/* =====================================================================
 * 擁有頁：兌換碼分隔線（購買 + 解鎖同頁）
 * =================================================================== */
.redeem-divider { display: flex; align-items: center; gap: 12px;
                  margin: 26px 24px 16px; }
.redeem-divider::before, .redeem-divider::after { content: ""; flex: 1; height: 1px;
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent); }
.redeem-divider span { font-family: var(--font-label); font-size: 10px; letter-spacing: 2.5px;
                  color: rgba(255,255,255,.42); text-transform: uppercase; white-space: nowrap; }

/* =====================================================================
 * 周邊分頁（聽片會票 + 手鍊）
 * =================================================================== */
.merch-list { padding: 4px 18px calc(30px + env(safe-area-inset-bottom));
              display: flex; flex-direction: column; gap: 16px; }
.merch-card { background: var(--surface); border: 1px solid rgba(255,255,255,.1);
              border-radius: 22px; overflow: hidden;
              box-shadow: 0 14px 34px rgba(0,0,0,.38); }
.merch-card.soldout { opacity: .62; }
/* 高度自動：每張商品圖依自己的比例完整顯示，不裁切
   （票券很寬、手鍊接近方形，硬套同一個比例一定會切到） */
.merch-img { position: relative; width: 100%; background: #0B0709; }
.merch-img img { width: 100%; height: auto; display: block; }
.merch-img-ph { aspect-ratio: 16/10; }   /* 沒圖的佔位框才需要固定比例 */
.merch-img-ph { display: flex; align-items: center; justify-content: center;
                font-size: 46px; color: rgba(var(--primary-rgb), .5);
                background: linear-gradient(150deg, rgba(var(--primary-rgb), .14), rgba(16,32,48,.6)); }
.merch-body { padding: 15px 17px 17px; }
.merch-badge { display: inline-block; font-family: var(--font-label); font-size: 9px;
               letter-spacing: 2px; text-transform: uppercase; color: var(--primary);
               background: rgba(var(--primary-rgb), .14); border: 1px solid rgba(var(--primary-rgb), .3);
               padding: 3px 9px; border-radius: 9px; margin-bottom: 9px; }
.merch-name { font-family: var(--font-serif-tc); font-size: 17px; font-weight: 600; letter-spacing: .5px; }
.merch-desc { font-size: 12.5px; line-height: 1.8; color: var(--muted); margin-top: 7px; }
.merch-foot { display: flex; align-items: baseline; gap: 11px; margin: 13px 0 12px; }
.merch-soon { font-family: var(--font-serif-tc) !important; font-style: normal !important;
              font-size: 17px !important; letter-spacing: 3px; color: var(--muted) !important; }
.merch-price { font-family: var(--font-display); font-style: italic; font-weight: 600;
               font-size: 24px; color: #fff; }
.merch-was { font-family: var(--font-label); font-size: 13px; letter-spacing: .5px;
             color: rgba(255,255,255,.38); text-decoration: line-through; }
.merch-stock { font-family: var(--font-label); font-size: 10px; letter-spacing: 1.2px;
               color: rgba(255,255,255,.45); }
.merch-buy { width: 100%; }
.merch-buy:disabled { opacity: .5; cursor: not-allowed; }

/* =====================================================================
 * 動態牆（SIGNAL feed）—— 全部 class 都 scope 在 #screen-mood 底下，
 * 不會跟播放器其他元件衝突。參考 Weverse / Apple Journal / X。
 * =================================================================== */
#screen-mood.feedwrap { padding: 0 0 calc(96px + env(safe-area-inset-bottom)); }
#screen-mood .feed-tabs { position: sticky; top: 0; z-index: 12;
  display: flex; align-items: center; gap: 3px;
  padding: calc(10px + env(safe-area-inset-top)) 13px 9px;
  background: rgba(7,17,31,.93);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid rgba(255,255,255,.07); }
#screen-mood .feed-tab { border: none; background: none; cursor: pointer;
  padding: 6px 12px; border-radius: 14px;
  font-family: var(--font-serif-tc); font-size: 12.5px; letter-spacing: 1.2px;
  color: rgba(255,255,255,.45); transition: .22s; white-space: nowrap; }
#screen-mood .feed-tab.active { color: #fff; background: rgba(var(--primary-rgb),.16);
  box-shadow: inset 0 0 0 1px rgba(var(--primary-rgb),.28); }
#screen-mood .feed-count { margin-left: auto; font-family: var(--font-label);
  font-size: 10px; letter-spacing: 1.4px; color: rgba(255,255,255,.3); padding-right: 4px; }

#screen-mood .group-head { display: flex; align-items: baseline; gap: 9px; padding: 24px 20px 12px; }
#screen-mood .group-title { font-family: var(--font-display); font-style: italic; font-size: 20px; letter-spacing: .5px; }
#screen-mood .group-sub { font-family: var(--font-label); font-size: 9.5px; letter-spacing: 2px;
  color: rgba(255,255,255,.34); text-transform: uppercase; }
#screen-mood .group-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.14), transparent); }

#screen-mood .cards { padding: 0 14px; display: flex; flex-direction: column; gap: 13px; }
#screen-mood .card { border-radius: 24px; overflow: hidden; position: relative;
  border: 1px solid rgba(255,255,255,.09); box-shadow: 0 12px 30px rgba(0,0,0,.36);
  animation: rise .45s cubic-bezier(.22,1,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
#screen-mood .card-foot { display: flex; align-items: center; gap: 13px; padding: 11px 16px 13px; }
#screen-mood .act { display: flex; align-items: center; gap: 6px; border: none; background: none; cursor: pointer;
  color: rgba(255,255,255,.45); font-family: var(--font-label); font-size: 11.5px; letter-spacing: 1px; transition: .2s; }
#screen-mood .act.liked { color: #E0525F; }
#screen-mood .act.liked svg { fill: #E0525F; animation: bounce .5s ease; }
#screen-mood .plays { display: flex; align-items: center; gap: 5px; font-family: var(--font-label);
  font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,.34); }
#screen-mood .date { margin-left: auto; font-family: var(--font-label); font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,.3); }
#screen-mood .pin { position: absolute; top: 12px; left: 14px; z-index: 3; padding: 3px 9px; border-radius: 10px;
  background: rgba(0,0,0,.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-family: var(--font-label); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); }
#screen-mood .cap { padding: 13px 16px 0; font-size: 13.5px; line-height: 1.95; color: rgba(255,255,255,.88); white-space: pre-wrap; }

#screen-mood .card.voice { background: linear-gradient(145deg,#3A1013,#2A0B0E 65%,#1A0709); border-color: rgba(var(--primary-rgb),.24); }
#screen-mood .v-top { padding: 17px 17px 4px; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-label); font-size: 9.5px; letter-spacing: 2.6px; color: var(--primary); text-transform: uppercase; }
#screen-mood .v-player { display: flex; align-items: center; gap: 13px; padding: 11px 17px 15px; }
#screen-mood .v-btn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--primary); color: #2A0B0B; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 5px 18px rgba(var(--primary-rgb),.32); transition: transform .18s; }
#screen-mood .v-btn:active { transform: scale(.9); }
#screen-mood .wave { flex: 1; display: flex; align-items: center; gap: 2.5px; height: 36px; cursor: pointer; }
#screen-mood .wave i { flex: 1; border-radius: 2px; background: rgba(255,255,255,.24); transition: background .14s, transform .14s; }
#screen-mood .wave i.on { background: var(--primary); }
#screen-mood .wave i.cur { background: #fff; transform: scaleY(1.18); }
#screen-mood .v-time { flex: none; font-family: var(--font-label); font-size: 11.5px; letter-spacing: 1.2px;
  color: rgba(255,255,255,.68); min-width: 36px; text-align: right; }
#screen-mood .card.voice .cap { padding-top: 0; color: rgba(255,255,255,.82); font-size: 13px; }

#screen-mood .card.media { background: var(--surface); }
#screen-mood .m-wrap { position: relative; background: #0B0709; }
#screen-mood .m-wrap img, #screen-mood .m-wrap video { width: 100%; display: block; object-fit: cover; aspect-ratio: 4/5; max-height: 452px; }
#screen-mood .m-badge { position: absolute; top: 12px; right: 12px; padding: 4px 9px; border-radius: 11px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-family: var(--font-label); font-size: 9px; letter-spacing: 1.6px; display: flex; align-items: center; gap: 5px; }

#screen-mood .card.text { background: linear-gradient(150deg, rgba(var(--primary-rgb),.1), rgba(127,166,201,.05)); }
#screen-mood .card.text .cap { font-family: var(--font-serif-tc); font-size: 15px; line-height: 2.15;
  letter-spacing: .7px; padding: 20px 19px 2px; color: rgba(255,255,255,.92); }
#screen-mood .quote { position: absolute; top: 8px; right: 16px; font-family: var(--font-display); font-style: italic;
  font-size: 52px; line-height: 1; color: rgba(var(--primary-rgb),.1); pointer-events: none; }
#screen-mood .feed-empty { padding: 70px 30px; text-align: center; color: rgba(255,255,255,.35); font-size: 12.5px; line-height: 2; }

/* =====================================================================
 * EMAIL 輸入視窗（取代 window.prompt —— PWA standalone 會忽略 prompt）
 * =================================================================== */
#email-modal { position: absolute; inset: 0; z-index: 80;
               display: flex; align-items: center; justify-content: center; padding: 26px;
               background: rgba(3,7,14,.8);
               backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
               animation: fadeIn .22s ease; }
.email-card { width: 100%; max-width: 340px; padding: 26px 22px 20px; border-radius: 24px;
              background: var(--surface); border: 1px solid rgba(255,255,255,.14);
              box-shadow: 0 28px 64px rgba(0,0,0,.6); }
.email-title { font-family: var(--font-serif-tc); font-size: 17px; font-weight: 600;
               letter-spacing: 1px; text-align: center; }

  /* ---------- 歌詞 ----------

  var CREDIT_RE = /^\s*(詞|曲|詞曲|作詞|作曲|製作人|編曲|和聲|錄音|混音|母帶|Producer|PRODUCER|Arrang|Mixing|Mastering|Recording|Vocal|Film|Director|Editor|HARMONY|ARRANGEMENT)/;

    var lines = String(raw || "").replace(/\r/g, "").split("\n");

    var cut = lines.length;

      (credits ? '<div class="lyrics-credits">' + esc(credits) + "</div>" : "");

  var ORDER = ["player", "purchase", "merch", "mood", "gallery"];
  function go(screen) {
    /* BUG FIX：player-only 專輯（BEFORE THE SKY）沒有分頁島，
       若被程式導去其他頁會沒有按鈕可以回來 → 直接擋掉 */
    if (PLAYER_ONLY && screen !== "player") return;
    state.screen = screen;
    closeSheet();
    ORDER.forEach(function (s) {
      $("screen-" + s).classList.toggle("active", s === screen);
    });
    var activeBtn = null;
    navBtns.forEach(function (b) {
      var on = b.getAttribute("data-screen") === screen;
      b.classList.toggle("active", on);
      b.classList.remove("pop");
      if (on) activeBtn = b;
    });
    if (activeBtn) {
      $("nav-ind").style.transform = "translateX(" + (activeBtn.offsetLeft - navBtns[0].offsetLeft) + "px)";
      void activeBtn.offsetWidth; activeBtn.classList.add("pop");
    }
    if (screen === "purchase") renderUnlockView();   // 兌換狀態現在住在「擁有」頁
    if (screen === "merch") renderMerch();
  }
  navBtns.forEach(function (b) { b.addEventListener("click", function () { go(b.getAttribute("data-screen")); }); });

  /* ---------- 付費解鎖頁 ---------- */
  function renderPlans() {
    var P = CFG.payment || {};
    var plans = [
      { key: "basic", name: P.basicName, price: P.basicPrice, features: P.basicFeatures || [], deluxe: false },
    ];
    /* 典藏版：deluxeEnabled !== false 才顯示（THE SKY 只賣 299 單一方案） */
    if (P.deluxeEnabled !== false) {
      plans.push({ key: "deluxe", name: P.deluxeName, price: P.deluxePrice, features: P.deluxeFeatures || [], deluxe: true });
    }
    $("plans").innerHTML = plans.map(function (p) {
      var check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      return '<div class="plan' + (p.deluxe ? " deluxe" : "") + (state.selectedPlan === p.key ? " selected" : "") + '" data-plan="' + p.key + '">' +
        (p.deluxe && P.deluxeBadge ? '<div class="plan-badge">' + esc(P.deluxeBadge) + "</div>" : "") +
        '<div class="plan-name">' + esc(p.name) + "</div>" +
        '<div class="plan-price">' + esc(P.currency || "NT$") + p.price + "</div>" +
        '<div class="plan-features">' + p.features.map(function (f) {
          return '<div class="plan-feature">' + check + esc(f) + "</div>";
        }).join("") + "</div></div>";
    }).join("");
    var P2 = CFG.payment || {};
    $("btn-checkout").textContent = "前往結帳 · " + (P2.currency || "NT$") +
      (state.selectedPlan === "deluxe" ? P2.deluxePrice : P2.basicPrice);
  }
  $("plans").addEventListener("click", function (e) {
    var card = e.target.closest("[data-plan]");
    if (!card) return;
    state.selectedPlan = card.getAttribute("data-plan");
    renderPlans();
  });
  /* 專輯結帳：優先走綠界（payment.productKey）；沒設就退回外部連結 */
  $("btn-checkout").addEventListener("click", function () {
    var P = CFG.payment || {};
    if (P.productKey) {
      var pre = ($("in-email").value || "").trim().toLowerCase();
      if (EMAIL_RE.test(pre)) { goEcpay(P.productKey, pre); return; }   // 下方欄位已填就直接用
      askEmail({
        title: "擁有 " + (CFG.albumTitle || "專輯"),
        desc: (P.currency || "NT$") + P.basicPrice + "　兌換碼會寄到這個信箱，用它解鎖完整專輯。"
      }, function (email) { goEcpay(P.productKey, email); });
      return;
    }
    var link = state.selectedPlan === "deluxe" ? P.stripeLinkDeluxe : P.stripeLinkBasic;
    if (!link) { toast("尚未設定付款連結"); return; }
    window.open(link, "_blank");
  });
  $("btn-goto-player").addEventListener("click", function () { go("player"); });

  /* ---------- 周邊（聽片會票 + 手鍊）---------- */
  function renderMerch() {
    var M = CFG.merch || {};
    $("merch-title-tc").textContent = M.heading || "周邊商品";
    $("merch-note").textContent = M.note || "";
    var items = M.items || [];
    $("merch-list").innerHTML = items.map(function (it, i) {
      var soldout = it.soldOut;
      /* 未上架：不顯示任何金額，按鈕鎖住。價格還留在設定裡，開賣只要關掉 comingSoon */
      var soon = (it.comingSoon != null) ? it.comingSoon : !!M.comingSoon;
      var stock = (it.limited != null)
        ? '<span class="merch-stock">限量 ' + it.limited + (it.left != null && !soon ? ' · 剩 ' + it.left : '') + '</span>'
        : "";
      var img = it.image
        ? '<div class="merch-img"><img src="' + esc(it.image) + '" alt="" loading="lazy"></div>'
        : '<div class="merch-img merch-img-ph">' + esc(it.emoji || "◈") + '</div>';
      var btn = soon
        ? '<button class="btn-primary merch-buy" disabled>敬請期待 · 尚未上架</button>'
        : soldout
        ? '<button class="btn-primary merch-buy" disabled>已售罄</button>'
        : '<button class="btn-primary merch-buy" data-merch="' + i + '">' +
          (it.buyLabel || "購買") + ' · ' + (M.currency || "NT$") + it.price + "</button>";
      var priceHtml = soon
        ? '<span class="merch-price merch-soon">敬請期待</span>'
        : '<span class="merch-price">' + (M.currency || "NT$") + it.price + "</span>";
      var wasPrice = (!soon && it.originalPrice && it.originalPrice > it.price)
        ? '<span class="merch-was">' + (M.currency || "NT$") + it.originalPrice + "</span>" : "";
      return '<div class="merch-card' + (soldout && !soon ? " soldout" : "") + '">' + img +
        '<div class="merch-body">' +
          (it.badge ? '<div class="merch-badge">' + esc(it.badge) + "</div>" : "") +
          '<div class="merch-name">' + esc(it.name) + "</div>" +
          '<div class="merch-desc">' + esc(it.desc || "") + "</div>" +
          '<div class="merch-foot">' + priceHtml + wasPrice + stock + "</div>" +
          btn +
        "</div></div>";
    }).join("");
    /* 沒有周邊商品的專輯（BEFORE THE SKY，但強制顯示 5 顆分頁）：放「敬請期待」佔位，不留白 */
    if (CFG.navShowAll && !items.length) {
      $("merch-list").innerHTML =
        '<div style="text-align:center;padding:44px 24px">' +
        '<div class="page-note" style="font-size:15px;line-height:2.1">周邊商品敬請期待 ✨<br>上架後會在這裡跟你說</div>' +
        '</div>';
    }
  }
  /* 綠界結帳：導向 Worker 的 /ecpay/create（需要 email 才能寄兌換碼／出貨通知）。
     綠界沒有可直接貼的付款連結，一定要經 Worker 組參數 + CheckMacValue。 */
  function goEcpay(productKey, email, name) {
    var base = (CFG.api && CFG.api.workerBaseUrl) || "";
    if (!base) { toast("後端尚未設定"); return; }
    var u = base.replace(/\/$/, "") + "/ecpay/create?productKey=" + encodeURIComponent(productKey) +
            "&email=" + encodeURIComponent(email) +
            (name ? "&name=" + encodeURIComponent(name) : "");
    window.location.href = u;   // 同分頁導轉，付完綠界會用 ClientBackURL 導回
  }

  /* ---------- Email 輸入視窗 ----------
   * ⚠️ 不能用 window.prompt()：加到主畫面的 PWA（standalone）iOS 會直接忽略，
   *    使用者按了購買什麼都沒發生 —— 這是實際踩到的 bug。 */
  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  function askEmail(opts, cb) {
    var saved = (unlockInfo().email || lsGet(NS + ":lastemail", "") || "").trim();
    $("email-modal-title").textContent = opts.title || "購買前，先留下 Email";
    $("email-modal-desc").textContent = opts.desc || "付款完成後，訂單與兌換碼會寄到這個信箱。";
    $("email-modal-input").value = saved;
    var nameEl = $("email-modal-name");
    nameEl.classList.toggle("hidden", !opts.needName);
    nameEl.value = lsGet(NS + ":lastname", "");
    askNeedName = !!opts.needName;
    $("email-modal-err").classList.add("hidden");
    $("email-modal").classList.remove("hidden");
    setTimeout(function () { $("email-modal-input").focus(); }, 120);
    emailCb = cb;
  }
  var emailCb = null, askNeedName = false;
  function closeEmailModal() { $("email-modal").classList.add("hidden"); emailCb = null; }
  $("email-modal-ok").addEventListener("click", function () {
    var v = ($("email-modal-input").value || "").trim().toLowerCase();
    if (!EMAIL_RE.test(v)) { $("email-modal-err").textContent = "Email 格式不太對，再確認一下"; $("email-modal-err").classList.remove("hidden"); return; }
    var nm = ($("email-modal-name").value || "").trim();
    if (askNeedName && nm.length < 2) {
      $("email-modal-err").textContent = "請填購票人姓名，入場時需要核對";
      $("email-modal-err").classList.remove("hidden"); return;
    }
    lsSet(NS + ":lastemail", v);       // 記住，下次不用再打
    if (nm) lsSet(NS + ":lastname", nm);
    var cb = emailCb; closeEmailModal();
    if (cb) cb(v, nm);
  });
  $("email-modal-cancel").addEventListener("click", closeEmailModal);
  $("email-modal").addEventListener("click", function (e) { if (e.target === this) closeEmailModal(); });
  $("email-modal-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("email-modal-ok").click();
  });
  $("merch-list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-merch]"); if (!b) return;
    var it = (CFG.merch.items || [])[+b.getAttribute("data-merch")];
    if (!it) return;
    /* 保險：即使按鈕被繞過也不會走到結帳 */
    var soonNow = (it.comingSoon != null) ? it.comingSoon : !!(CFG.merch || {}).comingSoon;
    if (soonNow) { toast("這個商品還沒上架，敬請期待"); return; }
    hap(10);
    if (it.link) { window.open(it.link, "_blank"); return; }        // 若之後改用外部連結
    if (!it.productKey) { toast("這個商品尚未設定"); return; }
    var isTicket = String(it.productKey || "").indexOf("ticket") === 0;
    askEmail({
      title: it.name,
      needName: isTicket,
      desc: (it.buyLabel || "購買") + " · " + ((CFG.merch || {}).currency || "NT$") + it.price +
            (isTicket ? "　付款完成後，帶 QR code 的電子票會寄到這個信箱。"
                      : "　付款完成後，訂單確認會寄到這個信箱。")
    }, function (email, name) { goEcpay(it.productKey, email, name); });
  });

  /* ---------- 兌換 / 解鎖 ---------- */
  function renderUnlockView() {
    /* 免費專輯（BEFORE THE SKY，強制顯示 5 顆分頁）：不顯示付費牆，改成「全免費」說明 */
    if (CFG.navShowAll && ALL_FREE) {
      $("unlock-form-view").classList.add("hidden");
      $("unlock-done-view").classList.add("hidden");
      $("purchase-title-en").textContent = "All Free";
      $("purchase-title-tc").textContent = "全部免費";
      $("purchase-note").textContent = "這張專輯不用購買，直接聽";
      if (!$("free-placeholder")) {
        var fp = document.createElement("div");
        fp.id = "free-placeholder";
        fp.style.cssText = "text-align:center;padding:44px 24px";
        fp.innerHTML = '<div class="page-note" style="font-size:15px;line-height:2.1">這張專輯全部免費 🎧<br>不用購買，直接聽歌就好</div>' +
          '<button class="btn-chip" id="fp-goto" style="margin-top:22px">前往聽歌 →</button>';
        $("screen-purchase").appendChild(fp);
        $("fp-goto").addEventListener("click", function () { go("player"); });

    $("unlocked-plan-note").textContent = deluxe
      ? "你的方案：典藏版 + WAV 無損 · 點上方按鈕前往雲端下載完整 WAV ♡"
      : "你的方案：數位專輯 · 可線上聆聽完整 " + TOTAL + " 首（WAV 無損下載為典藏版限定）";
  }

  function unlockNow(data) {
    /* 一併記住購買時用的 email，之後買周邊就不用再輸入一次 */
    var em = ($("in-email").value || "").trim().toLowerCase();
    lsSet(LS.unlock, Object.assign({ unlocked: true, email: em }, data));
    state.unlocked = true;
    go("player");
    openSheet();
    renderTrackLists(true);
    renderNowPlaying();
    unlockBurstFx();
    hap([12, 30, 12, 30, 40]);
    toast("解鎖成功 · " + TOTAL + " 首全部屬於你了 ♡");
  }

  $("btn-redeem").addEventListener("click", function () {
    var email = ($("in-email").value || "").trim();
    var code = ($("in-code").value || "").trim().toUpperCase();
    if (!email || !code) { toast("請輸入 email 和兌換碼"); return; }

    /* ⚠️ DEMO 模式：config 的 demoCodes 是「純前端」捷徑，方便展示。
     *    每個 demo 碼都寫死對應方案（不會誤用畫面上選的方案 —— PITFALLS #2）。
     *    正式版：demoCodes 設成 {}，所有兌換一律走下面的 Worker /verify
     *    （server-side verification：碼綁購買 email、存在 KV）。 */
    var demo = (CFG.unlock && CFG.unlock.demoCodes) || {};
    if (demo[code]) {
      unlockNow({ email: email, code: code, product: demo[code] });
      return;
    }

    if (!CFG.api || !CFG.api.workerBaseUrl) { toast("後端尚未設定 · 可先用 demo 兌換碼體驗"); return; }
    fetch(CFG.api.workerBaseUrl + "/verify", {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },  // 避免 CORS preflight
      body: JSON.stringify({ email: email, code: code }),
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.ok) unlockNow({ email: email, code: code, product: data.product || "299" });
      else toast(data.message || "兌換碼或 email 不正確");
    }).catch(function () { toast("連線失敗 · 後端未回應"); });
  });

  $("btn-reset-unlock").addEventListener("click", function () {
    try { localStorage.removeItem(LS.unlock); } catch (e) {}
    state.unlocked = false;
    renderUnlockView(); renderTrackLists(); renderNowPlaying();
    toast("已重設 · 回到未解鎖狀態");
  });

  /* ---------- 動態牆（SIGNAL feed · 只有 Chance 發文）----------
   * 貼文來自 CFG.feed.posts（語音/照片/影片/隨筆），按月分組。
   * 粉絲只能看＋按愛心（愛心存本機，key 依專輯 namespace）。 */
  var FEED = CFG.feed || {};
  var FEED_POSTS = FEED.posts || [];
  var FEED_MONTHS = FEED.monthLabels || {};
  var feedCat = "all";
  var FEED_MATCH = { all: function () { return true; },
    voice: function (p) { return p.type === "voice"; },
    media: function (p) { return p.type === "photo" || p.type === "video"; },
    text:  function (p) { return p.type === "text"; } };
  var FLS = NS + ":feedlikes";
  function feedLikes() { return lsGet(FLS, {}); }

  var HEART_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.3 1.9 4.8 5.2 4.8c2 0 3.3 1.2 3.9 2.2.6-1 1.9-2.2 3.9-2.2 3.3 0 4.9 3.5 3.2 6.9C19.5 16.4 12 21 12 21z"/></svg>';
  var PLAY_SVG = '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var MIC_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var WAVE_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="10" x2="3" y2="14"/><line x1="8" y1="6" x2="8" y2="18"/><line x1="13" y1="9" x2="13" y2="15"/><line x1="18" y1="4" x2="18" y2="20"/><line x1="22" y1="11" x2="22" y2="13"/></svg>';

  function waveBars(id, n) {
    var s = 0; for (var i = 0; i < id.length; i++) s = (s * 31 + id.charCodeAt(i)) % 9973;
    var out = "";
    for (var j = 0; j < n; j++) { s = (s * 1103515245 + 12345) % 2147483648; out += '<i style="height:' + (20 + s % 80) + '%"></i>'; }
    return out;
  }
  function feedCardHTML(p, likes) {
    var liked = !!likes[p.id];
    var foot = '<div class="card-foot">' +
      '<button class="act' + (liked ? " liked" : "") + '" data-flike="' + esc(p.id) + '">' + HEART_SVG +
        '<span>' + ((p.likes || 0) + (liked ? 1 : 0)) + '</span></button>' +
      (p.plays ? '<span class="plays">' + PLAY_SVG + esc(p.plays) + '</span>' : "") +
      '<span class="date">' + esc(p.date || "") + '</span></div>';
    var pin = p.pinned ? '<div class="pin">Pinned</div>' : "";
    if (p.type === "voice")
      return '<article class="card voice">' + pin +
        '<div class="v-top">' + WAVE_SVG + esc(p.label || "Voice") + '</div>' +
        '<div class="v-player" data-voice="' + esc(p.id) + '">' +
          '<button class="v-btn">' + MIC_SVG + '</button>' +
          '<div class="wave">' + waveBars(p.id, 32) + '</div>' +
          '<div class="v-time">0:00</div>' +
          '<audio src="' + esc(p.src) + '" preload="metadata"></audio>' +
        '</div>' +
        '<div class="cap">' + esc(p.caption) + '</div>' + foot + '</article>';
    if (p.type === "text")
      return '<article class="card text">' + pin + '<div class="quote">”</div>' +
        '<div class="cap">' + esc(p.caption) + '</div>' + foot + '</article>';
    var inner = p.type === "video"
      ? '<video src="' + esc(p.src) + '" poster="' + esc(p.poster || "") + '" muted loop playsinline webkit-playsinline preload="metadata"></video><div class="m-badge">' + PLAY_SVG + '影片</div>'
      : '<img src="' + esc(p.src) + '" alt="" loading="lazy">';
    return '<article class="card media">' + pin + '<div class="m-wrap">' + inner + '</div>' +
      '<div class="cap">' + esc(p.caption) + '</div>' + foot + '</article>';
  }
  function renderMoodWall() {   // 名稱沿用，內容已改成動態牆（開機 + go("mood") 會呼叫）
    var likes = feedLikes();
    var list = FEED_POSTS.filter(FEED_MATCH[feedCat] || FEED_MATCH.all);
    if ($("feed-count")) $("feed-count").textContent = list.length + " POSTS";
    if (!list.length) { $("feed-body").innerHTML = '<div class="feed-empty">這個分類還沒有內容。</div>'; return; }
    var groups = [];
    list.forEach(function (p) {
      var g = groups[groups.length - 1];
      if (!g || g.m !== p.month) { g = { m: p.month, items: [] }; groups.push(g); }
      g.items.push(p);
    });
    $("feed-body").innerHTML = groups.map(function (g) {
      var L = FEED_MONTHS[g.m] || [g.m || "", ""];
      return '<div class="group-head"><div class="group-title">' + esc(L[0]) + '</div>' +
        '<div class="group-sub">' + esc(L[1]) + '</div><div class="group-line"></div></div>' +
        '<div class="cards">' + g.items.map(function (p) { return feedCardHTML(p, likes); }).join("") + '</div>';
    }).join("");
    bindFeedVoices(); watchFeedVideos();
  }
  function bindFeedVoices() {
    document.querySelectorAll("#screen-mood [data-voice]").forEach(function (box) {
      var au = box.querySelector("audio"), btn = box.querySelector(".v-btn");
      var wave = box.querySelector(".wave"), bars = Array.prototype.slice.call(wave.children), t = box.querySelector(".v-time");
      function paint() {
        var d = au.duration, r = (d && isFinite(d)) ? au.currentTime / d : 0;
        var idx = Math.floor(r * bars.length);
        bars.forEach(function (b, i) { b.classList.toggle("on", i < idx); b.classList.toggle("cur", i === idx && !au.paused); });
        t.textContent = fmt((au.paused && !au.currentTime) ? au.duration : au.currentTime);
      }
      au.addEventListener("loadedmetadata", paint);
      au.addEventListener("timeupdate", paint);
      au.addEventListener("ended", function () { au.currentTime = 0; btn.innerHTML = MIC_SVG; paint(); });
      btn.addEventListener("click", function () {
        document.querySelectorAll("#screen-mood [data-voice]").forEach(function (b) {
          if (b !== box) { b.querySelector("audio").pause(); b.querySelector(".v-btn").innerHTML = MIC_SVG; }
        });
        audio.pause();   // 動態牆語音播放時，暫停主播放器，避免疊音
        if (au.paused) { au.play().catch(function () {}); btn.innerHTML = PAUSE_SVG; } else { au.pause(); btn.innerHTML = MIC_SVG; }
        hap(8); paint();
      });
      wave.addEventListener("click", function (e) {
        var d = au.duration; if (!d || !isFinite(d)) return;
        var r = wave.getBoundingClientRect();
        au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d; paint();
      });
      paint();
    });
  }
  function watchFeedVideos() {
    if (!("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { var v = en.target; if (en.isIntersecting) { v.play && v.play().catch(function () {}); } else { v.pause && v.pause(); } });
    }, { threshold: .6 });
    document.querySelectorAll("#screen-mood video").forEach(function (v) { io.observe(v); });
  }
  $("feed-body").addEventListener("click", function (e) {
    var b = e.target.closest("[data-flike]"); if (!b) return;
    var id = b.getAttribute("data-flike"), likes = feedLikes();
    if (likes[id]) delete likes[id]; else likes[id] = 1;
    lsSet(FLS, likes); hap(10);
    b.classList.toggle("liked");
    var post = FEED_POSTS.filter(function (p) { return p.id === id; })[0] || { likes: 0 };
    b.querySelector("span").textContent = (post.likes || 0) + (likes[id] ? 1 : 0);
  });
  document.querySelectorAll("#screen-mood .feed-tab").forEach(function (b) {
    b.addEventListener("click", function () {
      feedCat = b.getAttribute("data-cat");
      document.querySelectorAll("#screen-mood .feed-tab").forEach(function (x) { x.classList.toggle("active", x === b); });
      hap(8); renderMoodWall();
    });
  });

  /* ---------- Toast ---------- */
  var toastT = null;
  function toast(msg, dur) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove("show"); }, dur || 2200);
  }

  /* ---------- 特效：心動收藏 / 解鎖慶祝 ---------- */
  var HEART_PATH = "M12 21s-7.5-4.6-10-9.3C.3 8.3 1.9 4.8 5.2 4.8c2 0 3.3 1.2 3.9 2.2.6-1 1.9-2.2 3.9-2.2 3.3 0 4.9 3.5 3.2 6.9C19.5 16.4 12 21 12 21z";
  function heartSVG(size, color, style) {
    return '<svg class="fx-heart" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '" style="' + style + '"><path d="' + HEART_PATH + '"/></svg>';
  }
  $("btn-heart").addEventListener("click", function (e) {
    var t = TRACKS[state.cur];
    if (isLocked(t)) { toast("解鎖後才能收藏這首的心動瞬間"); return; }
    var stage = $("stage").getBoundingClientRect();
    var b = e.currentTarget.getBoundingClientRect();
    var ox = ((b.left + b.width / 2 - stage.left) / stage.width * 100).toFixed(1);
    var oy = ((b.top + b.height / 2 - stage.top) / stage.height * 100).toFixed(1);
    var fx = $("fx-layer");
    var cols = [getComputedStyle(document.documentElement).getPropertyValue("--primary").trim() || "#E9C46A",
                getComputedStyle(document.documentElement).getPropertyValue("--secondary").trim() || "#C4303A",
                getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#E0A94E"];
    var html = '<div class="fx-glow" style="left:' + ox + "%;top:" + oy + '%"></div>' +
               '<div class="fx-ring" style="left:' + ox + "%;top:" + oy + '%"></div>' +
               '<svg class="fx-bloom" width="60" height="60" viewBox="0 0 24 24" fill="' + cols[0] + '" style="left:' + ox + "%;top:" + oy + '%"><path d="' + HEART_PATH + '"/></svg>';
    for (var k = 0; k < 16; k++) {
      var dx = ((Math.random() * 2 - 1) * 72).toFixed(0);
      var rise = (120 + Math.random() * 150).toFixed(0);
      var sc = (0.65 + Math.random() * 0.85).toFixed(2);
      var r2 = ((Math.random() * 2 - 1) * 45).toFixed(0);
      var dur = (1.1 + Math.random() * 0.9).toFixed(2);
      var delay = (Math.random() * 0.4).toFixed(2);
      var size = (13 + Math.random() * 15).toFixed(0);
      var col = cols[Math.floor(Math.random() * cols.length)];
      html += heartSVG(size, col,
        "left:" + ox + "%;top:" + oy + "%;transform:translate(-50%,-50%);--dx:" + dx + "px;--rise:" + rise + "px;--s:" + sc + ";--r2:" + r2 + "deg;" +
        "animation:floatHeart " + dur + "s cubic-bezier(.4,.7,.5,1) " + delay + "s both");
    }
    fx.innerHTML = html;
    var hearts = (lsGet(LS.hearts, 0) || 0) + 1;
    lsSet(LS.hearts, hearts);
    var btn = $("btn-heart");
    btn.classList.add("liked");
    setTimeout(function () { btn.classList.remove("liked"); }, 1200);
    hap([8, 40, 12]); toast("已收藏這一刻", 1000);
    setTimeout(function () { fx.innerHTML = ""; }, 2600);
  });
  function unlockBurstFx() {
    var fx = $("fx-layer");
    var html = '<div id="unlock-fx"><div class="fx-ring2"></div></div>';
    for (var k = 0; k < 8; k++) {
      var left = (10 + Math.random() * 78).toFixed(0);
      var size = (13 + Math.random() * 13).toFixed(0);
      var dur = (0.95 + Math.random() * 0.45).toFixed(2);
      var delay = (Math.random() * 0.3).toFixed(2);
      html += '<svg class="fx-float" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="var(--primary)" style="left:' + left + "%;animation-duration:" + dur + "s;animation-delay:" + delay + 's"><path d="' + HEART_PATH + '"/></svg>';
    }
    fx.innerHTML = html;
    setTimeout(function () { fx.innerHTML = ""; }, 2200);
  }

  /* ---------- 控制鍵綁定 ---------- */
  $("btn-play").addEventListener("click", togglePlay);
  $("btn-prev").addEventListener("click", prev);
  $("btn-next").addEventListener("click", next);

  /* ---------- 開機 ---------- */
  renderNowPlaying();
  renderPlayState();
  renderTrackLists();
  renderPlans();
  renderUnlockView();
  renderMerch();
  renderMoodWall();
  renderProgress(pos.time || 0);
})();

</script>
</body>
